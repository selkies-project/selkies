[package]
name = "selkies-image-site"
description = "The image tier's helper inside a session under test: the tester site and a bandwidth endpoint"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

# Copied into the image under test, which may carry no Python and no particular libc: built static
# for musl (`--target x86_64-unknown-linux-musl`), so nothing native beyond std.
[dependencies]
serde_json = "1"

[lints]
workspace = true
