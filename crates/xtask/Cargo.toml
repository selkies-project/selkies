[package]
name = "xtask"
description = "The repository's own tooling, run as `cargo xtask`: the generated pages, fragments, and images, and the license gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# No crate of the workspace and nothing native, so the tool builds where the server does not.
# The PNG decoder the server's image handling already brings in.
png = "0.18"
regex = "1"
serde = "1"
serde_json = "1"
