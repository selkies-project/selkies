[package]
name = "xtask"
description = "The repository's own tooling, run as `cargo xtask`: the generated pages, fragments, and images, the license gate, and the wheel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# No crate of the workspace and nothing native, so the tool builds where the server does not.
# The PNG decoder the server's image handling already brings in.
png = "0.18"
regex = "1"
serde = "1"
serde_json = "1"
# The wheel's RECORD digests and its metadata from pyproject.toml (`wheel`)
base64 = "0.23"
sha2 = "0.11"
toml = { version = "1", features = ["preserve_order"] }
# The wheel's archive, with the deflate the server's ZIP downloads already bring in
zip = { version = "9", default-features = false, features = ["deflate"] }
