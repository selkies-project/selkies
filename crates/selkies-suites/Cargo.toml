[package]
name = "selkies-suites"
description = "The integration suites that drive a built selkies server as a black box, the tests of the C code it ships beside itself, and the harness they share."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# No crate of the workspace and nothing native beyond the server's own TLS provider, so the suites
# build where the server does not: beside a server a wheel installed. The crates are the ones the
# server speaks WebSockets and HTTP with, at its versions.
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util", "io-std"] }
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "aws_lc_rs", "fastrand"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
serde_json = "1"
libc = "0.2"
# The JPEG stripes a client of one display is sent, decoded (src/displays.rs), at pixelflux's
# version; pure Rust.
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
# What a suite reads back from the X display and puts on it: the root's size, the outputs, a
# selection owner, damage.
x11rb = { version = "0.14", features = ["randr", "res", "xf86vidmode", "xtest"] }
# A Wayland app owning a session's clipboard (src/bin/wl-clipboard-owner.rs), through the
# data-control protocol, at pixelflux's versions; pure Rust, no libwayland.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# The portal backend that forwards a session to Mutter's own D-Bus API (src/bin/mutter-portal.rs),
# at pixelflux's version.
zbus = { version = "6", default-features = false, features = ["default-rt", "service"] }
serde = "1"
# The layer surface a panel opens its menus from (src/bin/wl-popup-client.rs), at pixelflux's
# version.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# The headless WebRTC client of the pacer and recovery suites (src/bin/webrtc-peer.rs): webrtc-rs's
# sans-IO stack, its own crypto provider on AWS-LC as the server's is, so no workspace crate.
rtc = { version = "=0.21.1", default-features = false, features = ["crypto-aws-lc-rs"] }

[dev-dependencies]
# What tests/fetch_verified.rs serves GitHub's answers with: a proxy that ends TLS for the hosts
# the helper asks, under a certificate authority made for the run, at the server's versions.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
