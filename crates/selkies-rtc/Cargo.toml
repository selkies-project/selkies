[package]
name = "selkies-rtc"
description = "The Selkies WebRTC stack: ICE, DTLS, SRTP, RTP, SCTP, SDP, and signaling over the rtc-* sans-IO crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "selkies_rtc"
path = "src/lib.rs"

[dependencies]
rtc-sctp = "=0.21.1"
rtc-sdp = "=0.21.1"
rtc-shared = "=0.21.1"
rtc-ice = "=0.21.1"
rtc-stun = "=0.21.1"
rtc-turn = "=0.21.1"
rtc-dtls = "=0.21.1"
rtc-srtp = "=0.21.1"
rtc-crypto = "=0.21.1"
rtc-mdns = "=0.21.1"
sansio = "1"
base64 = "0.22"
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.10"
socket2 = "0.6"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
bytes = "1"
thiserror = "2"
rand = "0.9"
libc = "0.2"
memchr = "2"

[dev-dependencies]
rcgen = "0.14"
crc32c = "0.6"
rtc-rtp = "=0.21.1"
rtc-rtcp = "=0.21.1"
