# Fuzz targets for the parsers of what a WebRTC peer sends, built with `cargo fuzz` (nightly)
# and run by ClusterFuzzLite (.clusterfuzzlite/, .github/workflows/fuzz.yaml). Each target
# drives selkies-rtc the way the server does; the crate links no system library, and neither
# pixelflux nor pcmflux is in its graph.
[package]
name = "selkies-rtc-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
crc32c = "0.6"
rtc-sctp = "=0.21.1"
selkies-rtc = { path = ".." }

[[bin]]
name = "rtp"
path = "fuzz_targets/rtp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sctp"
path = "fuzz_targets/sctp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sdp"
path = "fuzz_targets/sdp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stun"
path = "fuzz_targets/stun.rs"
test = false
doc = false
bench = false

# A crate of its own, outside the workspace above it.
[workspace]
members = ["."]

# The workspace's patch, which a crate outside the workspace does not inherit: the association
# fuzzed is the vendored one the server runs.
[patch.crates-io]
rtc-sctp = { path = "../vendor/rtc-sctp" }
