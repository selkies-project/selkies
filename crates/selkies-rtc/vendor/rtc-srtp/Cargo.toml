# rtc-srtp 0.21.1 (https://github.com/webrtc-rs/rtc, MIT/Apache-2.0), vendored with the
# Selkies change applied on top; the workspace's `[patch.crates-io]` points the `rtc-srtp`
# dependency here. `rtc-srtp-selkies.patch` beside it is the diff against the published
# crate, the shape the change takes upstream.

[package]
name = "rtc-srtp"
version = "0.21.1"
authors = ["Rain Liu <yliu@webrtc.rs>"]
edition = "2024"
description = "RTC SRTP in Rust"
homepage = "https://webrtc.rs"
documentation = "https://docs.rs/rtc-srtp"
readme = "README.md"
keywords = ["sansio", "networking", "protocols"]
categories = ["network-programming"]
license = "MIT/Apache-2.0"
repository = "https://github.com/webrtc-rs/rtc"
publish = false

[features]
crypto-aws-lc-rs = ["crypto/crypto-aws-lc-rs"]
crypto-ring = ["crypto/crypto-ring"]
default = ["crypto-ring"]

[lib]
name = "rtc_srtp"
path = "src/lib.rs"

[[test]]
name = "provider_profiles"
path = "tests/provider_profiles.rs"

[dependencies]
byteorder = "1.5.0"
bytes = "1.12.0"
crypto = { package = "rtc-crypto", version = "0.21.1", default-features = false }
rtcp = { package = "rtc-rtcp", version = "0.21.1" }
rtp = { package = "rtc-rtp", version = "0.21.1" }
shared = { package = "rtc-shared", version = "0.21.1", default-features = false, features = ["marshal", "replay"] }

[dev-dependencies]
lazy_static = "1.4.0"

[workspace]
