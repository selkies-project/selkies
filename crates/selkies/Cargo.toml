[package]
name = "selkies"
description = "Open-Source Low-Latency Linux WebRTC HTML5 Remote Desktop and 3D Graphics / Game Streaming Platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "selkies"
path = "src/lib.rs"

[[bin]]
name = "selkies"
path = "src/main.rs"

[dependencies]
pixelflux.workspace = true
pcmflux.workspace = true
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
bytes = "1"
axum = { version = "0.8", features = ["ws", "http2", "macros", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header", "compression-gzip"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.13"
flate2 = "1"
base64 = "0.22"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
regex = "1"
percent-encoding = "2"
url = "2"
mime_guess = "2"
thiserror = "2"
parking_lot = "0.12"
dashmap = "6"
async-trait = "0.1"
libc = "0.2"
nix = { version = "0.29", features = ["fs", "socket", "signal", "process", "user", "poll", "ioctl"] }
x11rb = { version = "0.14", features = ["xtest", "xfixes", "randr", "xkb", "xinput", "render"] }
libpulse-binding = "2.30"
sysinfo = "0.33"
nvml-wrapper = "0.10"
prometheus-client = "0.23"
rmp-serde = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = "0.4"
