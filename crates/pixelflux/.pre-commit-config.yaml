# The formatting and lint checks CI runs, moved ahead of the commit. One-time
# setup:
#
#     pip install pre-commit
#     pre-commit install
#
# Run over the whole tree at any time with `pre-commit run --all-files`. rustfmt
# and clippy come with the Rust toolchain (`rustup component add rustfmt
# clippy`); rustfmt reads rustfmt.toml, and clippy builds the crate, so it needs
# the native libraries a test build does.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      # Rule selection lives in pyproject.toml
      - id: ruff-check

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      # Skip list and dictionary exceptions live in .codespellrc, and they only
      # apply to paths codespell walks itself
      - id: codespell
        pass_filenames: false

  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: rustfmt
        language: system
        types: [rust]
        # bindgen's output stays as generated
        exclude: ^pixelflux/(nvcodec-sys|va-sys)/src/bindgen/
      - id: clippy
        name: clippy
        entry: cargo clippy --manifest-path pixelflux/Cargo.toml --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: clippy-python
        name: clippy (python feature)
        entry: cargo clippy --manifest-path pixelflux/Cargo.toml --all-targets --features python -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
