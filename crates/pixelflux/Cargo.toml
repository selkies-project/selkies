[package]
name = "pixelflux"
version = "2.2.3"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/selkies-project/selkies/tree/main/crates/pixelflux"
# let-chains (stable in edition 2024 since 1.88) are the newest language feature used.
rust-version = "1.89"

[lib]
name = "pixelflux"
# The Rust library a host links, and the Python extension module when the `python` feature
# is on: the same crate serves both, so the Python classes are wrappers over the Rust API.
crate-type = ["rlib", "cdylib"]

[dependencies]
# The Python bridge (src/python.rs) and nothing else; `python` turns it on, and the wheel
# build adds `extension-module` so the module links no libpython of its own.
pyo3 = { version = "0.30.1", optional = true }
wayland-server = { version = "0.31.10", features = ["dlopen"] }
wayland-protocols = { version = "0.32", features = ["server", "client", "staging"] }
wayland-client = "0.31"
# The generated KDE output bindings (src/wayland/kdeproto.rs) build from the
# XMLs vendored under protocols/, so the scanner, the backend it references, and
# the bitflags its enums expand to are direct deps.
wayland-scanner = "0.31"
wayland-backend = "0.3"
bitflags = "2"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memmap2 = "0.9"
turbojpeg = "1.3" 
rayon = "1.10"
# Software H.264 is one of two encoders, chosen at build time by the features below:
# GPL-2.0+ libx264 (the default `gpl` feature) or BSD-licensed Cisco OpenH264 (the
# `openh264` feature, used when `gpl` is off; setup.py selects it for
# PIXELFLUX_ENABLE_GPL=0). OpenH264 builds its vendored C source (C toolchain + nasm),
# no runtime download; openh264-sys2 carries the raw calls (live bitrate, slice layout,
# the decoder interface) the safe wrapper does not expose. Its decoder is the virtual
# camera's H.264 decoder in every build.
openh264 = "0.9"
openh264-sys2 = "0.9"
# The software codec libraries, bound at build time from the headers of the copies that are
# linked: libvpx (VP8/VP9), SVT-AV1, and the virtual camera's dav1d and libde265 decoders;
# x265 and kvazaar are the features below.
codec-sys = { path = "codec-sys", features = ["vpx", "svtav1", "dav1d", "de265"] }
# VA-API types from the bundled libva headers; the library itself is loaded at run time.
va-sys = { path = "va-sys" }
libc = "0.2"
# fast_mode enables YuvConversionMode::Fast: empirically 1.23x faster than libyuv ARGBToI420
# on x86-64-v3 (AVX2) at <=1 LSB error vs a float BT.709 reference (accuracy preserved).
yuv = { version = "0.8.9", features = ["fast_mode"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
gbm = "0.18" 
libloading = "0.9"
xcursor = "0.3.1"
# X11 host capture (replaces the C++ XShm/XFixes path): shm = XShm zero-copy grab,
# xfixes = hardware cursor image, dri3 + render = the zero-copy DRI3 capture (GPU
# buffers as pixmaps, the cursor composited by the server), damage = the server's
# report that the screen changed. Pure-Rust XCB; links the system libxcb.
x11rb = { version = "0.14", features = ["shm", "xfixes", "xtest", "randr", "damage", "dri3", "render"] }
# Every default format but AVIF, whose feature is an encoder (rav1e) nothing calls: the overlay opens
# whatever image it is given.
image = { version = "=0.25.10", default-features = false, features = ["rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cfg-if = "1"
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy"] }
reis = "0.7"

[dependencies.nvcodec-sys]
path = "nvcodec-sys"
features = ["cuda"]

[features]
default = ["gpl"]
## The Python bridge: `import pixelflux` over the Rust API. Off, the crate is a Rust library
## with no interpreter in its build.
python = ["dep:pyo3"]
## A full-CPython-API extension: `python` with pyo3 linking against the importing
## interpreter rather than a libpython of its own. Tests of `python` run without it.
extension-module = ["python", "pyo3/extension-module"]
## Release wheels opt into the 3.11 limited API explicitly; ordinary source builds retain
## the full API needed for CPython 3.9/3.10 and their identical zero-copy frame exporter.
abi3-extension-module = ["extension-module", "pyo3/abi3-py311"]
## GPL-licensed components: libx264 (GPL-2.0+) as the software H.264 encoder and x265
## (GPL-2.0+) as the software HEVC encoder. Wins over `openh264` whenever both are enabled.
gpl = ["codec-sys/x264", "codec-sys/x265"]
## BSD-licensed Cisco OpenH264 as the software H.264 encoder and kvazaar as the software
## HEVC encoder of a build without `gpl`; the crate fails to compile with neither feature.
openh264 = ["codec-sys/kvazaar"]

[dependencies.smithay]
git = "https://github.com/Smithay/smithay"
rev = "928d4a9b222b2adcd739a2c60caf3e8f304a45a5"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "renderer_gl", 
    "renderer_pixman",
    "use_system_lib",
    "desktop",
    "wayland_frontend",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
