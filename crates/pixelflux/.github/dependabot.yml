# One grouped weekly pull request per ecosystem, so a crate bump does not arrive
# as a dozen separate reviews.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directories: ["/pixelflux", "/pixelflux/nvcodec-sys"]
    schedule:
      interval: weekly
    groups:
      crates:
        patterns: ["*"]
    ignore:
      # Pinned to the version that produced the committed NVENC bindings
      - dependency-name: bindgen

  # The devcontainers updater discovers `.devcontainer/**/devcontainer.json`
  # itself; naming that directory makes it report the file as not found
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    groups:
      devcontainer-features:
        patterns: ["*"]
