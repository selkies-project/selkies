[package]
name = "pcmflux"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/selkies-project/selkies/tree/main/crates/pcmflux"
# let-chains (stable in edition 2024 since 1.88) are the newest language feature used.
rust-version = "1.88"

# The workspace's lint table, repeated because the wheel builds this crate on its own, outside the
# workspace.
[lints.clippy]
assigning_clones = "deny"
cast_lossless = "deny"
cloned_instead_of_copied = "deny"
implicit_clone = "deny"
large_types_passed_by_value = "deny"
needless_collect = "deny"
rc_buffer = "deny"
redundant_clone = "deny"
trivially_copy_pass_by_ref = "deny"

[lib]
name = "pcmflux"
crate-type = ["rlib", "cdylib"]

[features]
# `python` builds the Python bridge (src/python.rs) over the Rust API; without it the
# crate links no interpreter. The Python build (setup.py) also asks for the extension
# module; left off, the crate links the interpreter, which is what `cargo test
# --features python` needs.
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]
# Only release wheels opt into the limited API; ordinary builds retain the full API.
abi3-extension-module = ["extension-module", "pyo3/abi3-py311"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true }
libpulse-binding = "2.30"
opusic-sys = "0.7"
bytemuck = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
