# Fuzz targets for pcmflux's parsers of what a client sends, built with `cargo fuzz` (nightly)
# and run by ClusterFuzzLite (.clusterfuzzlite/, .github/workflows/fuzz.yaml). A target
# compiles the module it fuzzes from ../src on its own, so it needs none of the audio stack.
[package]
name = "pcmflux-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[[bin]]
name = "red"
path = "fuzz_targets/red.rs"
test = false
doc = false
bench = false

# A crate of its own, outside any workspace above it.
[workspace]
members = ["."]

# The workspace's lint table, which a crate outside the workspace does not inherit.
[lints.clippy]
assigning_clones = "deny"
cast_lossless = "deny"
cloned_instead_of_copied = "deny"
implicit_clone = "deny"
large_types_passed_by_value = "deny"
needless_collect = "deny"
rc_buffer = "deny"
redundant_clone = "deny"
trivially_copy_pass_by_ref = "deny"
