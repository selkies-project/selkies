# One grouped weekly pull request per ecosystem, so a crate bump does not arrive
# as a dozen separate reviews.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /pcmflux
    schedule:
      interval: weekly
    groups:
      crates:
        patterns: ["*"]
