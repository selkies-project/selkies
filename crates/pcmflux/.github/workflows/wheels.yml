name: Wheels

# The wheel build the release workflows share, in two stages. An image per
# platform (libc and architecture) carries the native libraries: cibuildwheel's
# own base image with the before-all of pyproject.toml run in it. It is kept in
# the Actions cache under a key of its recipe, base, passed variables and ISO
# week (see scripts/wheel-plan.py), so the stage runs only for an image the
# cache lacks. Each platform's wheels are then built on its image in as many
# jobs as JOBS gives its libc; the interpreters of one job share its cargo
# build, past the first rebuilding only the PyO3 layer and the extension. A job
# that finds no image builds its wheels the plain way, before-all and all. The
# wheels are left as `wheels-*` artifacts of the calling run.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and version the wheels as; the calling run's commit is built as it stands when empty
        type: string
        default: ''

permissions:
  contents: read

env:
  IMAGE: pcmflux-wheel-deps
  # The jobs a platform's wheels are dealt into, by libc: one, since an
  # interpreter past the first adds 10-20 seconds to a job
  JOBS: manylinux=1 musllinux=1

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lists the images the cache holds
      actions: read
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Plan the images and the wheels
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          # Planned by the cibuildwheel release the build job's action pins,
          # read off that pin so an update of it moves both
          version="$(sed -n 's|.*uses: pypa/cibuildwheel@[0-9a-f]* # v\([0-9.]*\)$|\1|p' .github/workflows/wheels.yml)"
          if [ -z "${version}" ]; then
            echo "::error::.github/workflows/wheels.yml pins no cibuildwheel release"
            exit 1
          fi
          python3 -m venv "${RUNNER_TEMP}/cibuildwheel"
          "${RUNNER_TEMP}/cibuildwheel/bin/pip" install "cibuildwheel==${version}"
          "${RUNNER_TEMP}/cibuildwheel/bin/python" scripts/wheel-plan.py matrix "${IMAGE}" "${JOBS}" | tee -a "$GITHUB_OUTPUT"

  image:
    needs: plan
    if: needs.plan.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    name: image (${{ matrix.image.platform }})
    runs-on: ${{ matrix.image.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Build the image
        env:
          BASE: ${{ matrix.image.base }}
          PLATFORM: ${{ matrix.image.platform }}
        run: |
          python3 scripts/wheel-plan.py recipe > "${RUNNER_TEMP}/recipe.sh"
          # The sources and build trees the recipe leaves are no part of the image
          docker run --name deps --workdir /tmp \
            --volume "${RUNNER_TEMP}/recipe.sh:/recipe.sh:ro" "${BASE}" \
            bash -c 'bash /recipe.sh && rm -rf /tmp/* /root/.cache && { ! command -v dnf || dnf clean all; }'
          docker commit deps "${IMAGE}:${PLATFORM}"
          docker save "${IMAGE}:${PLATFORM}" | zstd -T0 > "${RUNNER_TEMP}/image.tar.zst"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image.tar.zst
          key: ${{ matrix.image.key }}

  build:
    needs: [plan, image]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.image.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    name: ${{ matrix.group.name }}
    runs-on: ${{ matrix.group.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Version the crate as the tag
        # The wheel takes its version from the crate, whose manifest spells a
        # pre-release the semver way; the lock names the crate's own version
        # too, and the build runs --locked.
        if: inputs.tag != ''
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          crate="$(echo "${RELEASE_TAG}" | sed -E 's/rc([0-9]+)$/-rc.\1/; s/a([0-9]+)$/-alpha.\1/; s/b([0-9]+)$/-beta.\1/; s/\.post([0-9]+)$/-post.\1/; s/\.dev([0-9]+)$/-dev.\1/')"
          sed -i "0,/^version = /s|^version = .*|version = \"${crate}\"|" pcmflux/Cargo.toml
          sed -i "/^name = \"pcmflux\"$/{n;s|^version = .*|version = \"${crate}\"|}" pcmflux/Cargo.lock
          grep -q "^version = \"${crate}\"$" pcmflux/Cargo.toml
          grep -A1 "^name = \"pcmflux\"$" pcmflux/Cargo.lock | grep -q "^version = \"${crate}\"$"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: image
        with:
          path: ${{ runner.temp }}/image.tar.zst
          key: ${{ matrix.group.key }}

      - name: Load the image
        if: steps.image.outputs.cache-hit == 'true'
        env:
          PLATFORM: ${{ matrix.group.platform }}
        run: |
          zstd -dc "${RUNNER_TEMP}/image.tar.zst" | docker load
          # The loaded image has run before-all already
          {
            echo "CIBW_BEFORE_ALL="
            for name in MANYLINUX_X86_64 MANYLINUX_AARCH64 MUSLLINUX_X86_64 MUSLLINUX_AARCH64; do
              echo "CIBW_${name}_IMAGE=${IMAGE}:${PLATFORM}"
            done
          } >> "$GITHUB_ENV"

      - name: Build the wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_BUILD: ${{ matrix.group.build }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.group.name }}
          path: wheelhouse/*.whl
          # A wheel is a deflated zip already, so the archive this is wrapped in
          # cannot compress it further: leveling off spends no CPU re-deflating
          # it for a size that does not move.
          compression-level: 0
