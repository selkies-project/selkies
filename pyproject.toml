[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "selkies"
version = "0.0.0.dev0"
authors = [{name = "Selkies Project", email = "pypi@linuxserver.io"}]
description = "Open-Source Low-Latency Linux WebRTC HTML5 Remote Desktop and 3D Graphics / Game Streaming Platform"
readme = "README.md"
license = "MPL-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.9"
dependencies = [
    "prometheus_client",
    "msgpack",
    "psutil",
    "watchdog",
    "Pillow",
    "pixelflux",
    "pcmflux",
    # PulseAudio Microphone
    "pulsectl-asyncio",
    # WebRTC
    "dnspython>=2.0.0",
    "ifaddr>=0.2.0",
    "av",
    "cffi>=1.0.0",
    "cryptography>=44.0.0",
    "google-crc32c>=1.1",
    "pyee>=13.0.0",
    "pylibsrtp>=0.10.0",
    "pyopenssl>=25.0.0",
    "aiohttp>=3.7.0",
    "aiofiles>=25.1.0",
    "uvloop>=0.19.0; platform_system == 'Linux' or platform_system == 'Darwin'",
    # GPU stats
    "nvidia-ml-py",
    "aitop",
]

[project.urls]
Homepage = "https://github.com/selkies-project/selkies"
"Bug Tracker" = "https://github.com/selkies-project/selkies/issues"

[project.scripts]
selkies = "selkies.__main__:main"
selkies-resize = "selkies.display_utils:entrypoint"
selkies-gpu-probe = "selkies.gpu_probe:main"

# Package Static web files as part of distribution wheel
[tool.setuptools.package-data]
"selkies.selkies_web" = ["**/*"]

[tool.setuptools.packages.find]
where = ["src"]

# The suites in tests/ are standalone programs; tests/test_suites.py runs each
# one as a pytest case. Select a tier with its marker: pytest -m unit
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: needs only the source tree",
    "integration: needs a display, PulseAudio and an installed selkies",
    "e2e: additionally needs Playwright browsers and the built web client",
    "perf: long constrained-link benchmark, run on request",
    "soak: full pixelflux and pcmflux API surface, run on request",
]

# Ruff runs as a bug-finder, not a style enforcer: only rule families that flag
# defects (pyflakes, bugbear, pycodestyle errors, pylint errors) are enabled.
# Run: ruff check   (from this directory)
[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E9", "F", "B", "PLE"]

[tool.ruff.lint.per-file-ignores]
# XK loads its keysym constants into module globals at import time, which no
# static analyzer can follow.
"src/selkies/Xlib/XK.py" = ["F821"]
# python-xlib and aiortc heritage. These are upstream idioms rather than
# defects here; the surrounding style is kept so upstream fixes still apply.
"src/selkies/Xlib/**" = ["B006", "B007", "B904"]
"src/selkies/webrtc/**" = ["B007", "B008", "B020", "B904"]
"src/selkies/ice/**" = ["B007"]

# Type checkers run as bug-finders on this largely unannotated codebase:
# inference-noise categories (Optional/attribute/argument inference on untyped
# values, guarded-import callables, aiohttp/av stub strictness) are disabled;
# every rule left enabled must stay clean.
# Run: pyright --pythonpath <env-python>   (from this directory)
[tool.pyright]
include = ["src/selkies"]
exclude = ["src/selkies/Xlib"]
pythonVersion = "3.12"
reportOptionalMemberAccess = "none"
reportAttributeAccessIssue = "none"
reportArgumentType = "none"
reportOperatorIssue = "none"
reportOptionalOperand = "none"
reportOptionalCall = "none"
reportOptionalSubscript = "none"
reportOptionalIterable = "none"
reportCallIssue = "none"
reportReturnType = "none"
reportAssignmentType = "none"
reportGeneralTypeIssues = "none"
reportPrivateImportUsage = "none"
reportRedeclaration = "none"
reportIndexIssue = "none"

# Run: pyrefly check --python-interpreter-path <env-python>  (from this directory)
[tool.pyrefly]
project_includes = ["src/selkies"]
project_excludes = ["src/selkies/Xlib"]
python_version = "3.12"

[tool.pyrefly.errors]
# pixelflux/pcmflux are PyO3 extensions installed at deploy time; their imports
# are try/except-guarded and have no stubs to resolve here.
missing-import = false
missing-attribute = false
bad-argument-type = false
unsupported-operation = false
bad-index = false
bad-assignment = false
bad-return = false
not-callable = false
not-async = false
no-matching-overload = false
bad-specialization = false
