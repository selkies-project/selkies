# The selkies wheel: the Rust server as the `selkies` executable, built by
# maturin, with the web client installed at <prefix>/share/selkies/web beside
# it. Nothing in it is Python but the Jupyter entry point below, which only a
# Jupyter server imports, so one py3-none wheel per platform installs on any
# Python 3 and names no floor of its own. infra/wheel/build.sh builds and
# repairs it.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "selkies"
version = "0.0.0.dev0"
authors = [{name = "Selkies Project", email = "pypi@linuxserver.io"}]
description = "Open-Source Low-Latency Linux WebRTC HTML5 Remote Desktop and 3D Graphics / Game Streaming Platform"
readme = "README.md"
license = "MPL-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
# The Jupyter launcher item and route: `pip install selkies[jupyter]` beside the
# Jupyter server that should offer the desktop
jupyter = [
    "jupyter-server-proxy>=4.1",
]

[project.urls]
Homepage = "https://github.com/selkies-project/selkies"
"Bug Tracker" = "https://github.com/selkies-project/selkies/issues"

# Jupyter's server proxy reads this group: with jupyter-server-proxy installed
# beside selkies, every Jupyter server gains a Selkies desktop at /selkies/
[project.entry-points.jupyter_serverproxy_servers]
selkies = "selkies.session:jupyter"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/selkies/Cargo.toml"
# The entry point's module
python-source = "infra/wheel"
# infra/wheel/build.sh stages the web client here, as data/share/selkies/web
data = "build/wheel/data"
# A wheel built from the sdist needs the complete workspace's native sources,
# generated bindings and protocols, codec recipes and patches, vendored crates,
# and the staged web client.
include = [
    { path = "crates/**/*", format = "sdist" },
    { path = "build/wheel/data/**/*", format = "sdist" },
]
