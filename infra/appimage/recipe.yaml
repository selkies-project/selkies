#
# rattler-build recipe producing the `selkies` conda package (used both for
# the AppImage environment and as a portable conda distribution artifact): the
# server scripts/ci/appimage.sh built inside the wheels' manylinux image, its
# web client compiled in, and the conda-forge libraries it links as its run
# dependencies.

context:
  name: selkies
  # env.get takes no default and raises when the variable is unset, and CI sets
  # SELKIES_VERSION empty for builds that carry no release version
  version: ${{ (env.get("SELKIES_VERSION") if env.exists("SELKIES_VERSION") else "") | default("0.0.0", true) }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # The server as infra/packaging/server.sh stages it (usr/bin/selkies),
  # which the repository's .gitignore would otherwise keep out
  - path: ../../build/appimage/server
    use_gitignore: false
  - path: ../../LICENSE

build:
  number: 0
  script:
    - install -Dm755 usr/bin/selkies "${PREFIX}/bin/selkies"
  dynamic_linking:
    # The C library the server was built against, the AppImage's floor, and the
    # graphics stack are the host's: libgbm has to be the one beside the
    # host's GPU driver for the GPU to be reachable at all
    missing_dso_allowlist:
      - "**/ld-linux*.so*"
      - "**/libc.so.6"
      - "**/libdl.so.2"
      - "**/libm.so.6"
      - "**/libmvec.so.1"
      - "**/libpthread.so.0"
      - "**/libgbm.so.1"

requirements:
  # What the server links, so the linkage check finds each one in a package
  # and each package's run exports pin what the server needs at run time. Its
  # codecs are linked in, and the libraries pixelflux opens at run time (libva
  # among them) are scripts/ci/appimage.sh's to add.
  host:
    - libxkbcommon
    - pixman
    - pulseaudio-client
    - libgcc
    - libstdcxx
  run:
    - libxkbcommon
    - pixman
    - pulseaudio-client
    - libgcc
    - libstdcxx

tests:
  - script:
      # The server answers from the prefix conda installed it into, its
      # libraries found there, with the web client compiled into it
      - selkies --version
      - selkies --help > /dev/null
      - selkies --version | grep -F "web client: embedded ("

about:
  summary: Low-latency HTML5 remote desktop streaming (WebSocket and WebRTC)
  description: Selkies is an open-source low-latency high-performance Linux-native GPU/CPU-accelerated HTML5 remote desktop streaming platform.
  homepage: https://github.com/selkies-project/selkies
  license: MPL-2.0
  license_file: LICENSE
  repository: https://github.com/selkies-project/selkies
