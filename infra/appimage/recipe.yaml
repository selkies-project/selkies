#
# rattler-build recipe producing the noarch `selkies` conda package (used both
# for the AppImage environment and as a portable conda distribution artifact).

context:
  name: selkies
  version: ${{ env.get("SELKIES_VERSION", "0.0.0") }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ../..

build:
  number: 0
  noarch: python
  script:
    # Build the web client bundle from source
    - cd addons/selkies-web-core && npm install --no-audit --no-fund && npm run build
    - cd ../selkies-dashboard && cp ../selkies-web-core/dist/selkies-core.js src/ && npm install --no-audit --no-fund && SELKIES_INJECT=1 npm run build
    - mkdir -p addons/selkies-dashboard/dist/src && cp ../selkies-web-core/dist/selkies-core.js addons/selkies-dashboard/dist/src/ && cp ../universal-touch-gamepad/universalTouchGamepad.js addons/selkies-dashboard/dist/src/ && cp -r ../selkies-web-core/dist/jsdb addons/selkies-dashboard/dist/
    - cp -ar addons/selkies-dashboard/dist src/selkies/selkies_web
    - printf '%s' '{"name":"Selkies","short_name":"Selkies","manifest_version":2,"version":"1.0.0","display":"fullscreen","background_color":"#000000","theme_color":"#000000","icons":[{"src":"icon.png","type":"image/png","sizes":"512x512"}],"start_url":"/"}' > src/selkies/selkies_web/manifest.json
    # PWA icon/favicon are vendored in this repository, not downloaded
    - cp docs/assets/logo/icon-512x512.png src/selkies/selkies_web/icon.png
    - cp docs/assets/logo/favicon.ico src/selkies/selkies_web/favicon.ico
    # Install the Python package (web client bundled)
    - python -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python 3.12.*
    - pip
    - nodejs 22.*
  run:
    - python >=3.9

tests:
  - script:
      - selkies --help
      - python -c "import importlib.resources as r; assert (r.files('selkies.selkies_web') / 'index.html').is_file()"

about:
  summary: Low-latency HTML5 remote desktop streaming (WebSocket and WebRTC)
  description: Selkies is an open-source low-latency high-performance Linux-native GPU/CPU-accelerated HTML5 remote desktop streaming platform.
  homepage: https://github.com/selkies-project/selkies
  license: MPL-2.0
  license_file: LICENSE
  repository: https://github.com/selkies-project/selkies
