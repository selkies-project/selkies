#
# rattler-build recipe producing the noarch `selkies` conda package (used both
# for the AppImage environment and as a portable conda distribution artifact).

context:
  name: selkies
  version: ${{ env.get("SELKIES_VERSION", "0.0.0") }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ../..

build:
  number: 0
  noarch: python
  script:
    - ./scripts/ci/build-web.sh
    - python -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python 3.12.*
    - pip
    - setuptools
    - nodejs 22.*
  run:
    - python >=3.9
    # Mirrors [project.dependencies] in pyproject.toml; `pip install --no-deps`
    # above deliberately leaves resolution to conda. pixelflux, pcmflux,
    # xkbcommon, pulsectl-asyncio and aitop have no conda-forge packages and
    # are pip-installed into the environment by scripts/ci/appimage.sh.
    - prometheus_client
    - msgpack-python
    - psutil
    - watchdog
    - pillow
    - xkbcommon
    - pulsectl-asyncio
    - dnspython >=2.0.0
    - ifaddr >=0.2.0
    - av
    - cffi >=1.0.0
    - cryptography >=44.0.0
    - google-crc32c >=1.1
    - pyee >=13.0.0
    - pylibsrtp >=0.10.0
    - pyopenssl >=25.0.0
    - aiohttp >=3.7.0
    - aiofiles >=25.1.0
    - uvloop >=0.19.0
    - nvidia-ml-py

tests:
  - script:
      # The full `selkies --help` smoke test lives in scripts/ci/appimage.sh,
      # where the pip-only dependencies are present too
      - python -c "import importlib.resources as r; assert (r.files('selkies.selkies_web') / 'index.html').is_file()"

about:
  summary: Low-latency HTML5 remote desktop streaming (WebSocket and WebRTC)
  description: Selkies is an open-source low-latency high-performance Linux-native GPU/CPU-accelerated HTML5 remote desktop streaming platform.
  homepage: https://github.com/selkies-project/selkies
  license: MPL-2.0
  license_file: LICENSE
  repository: https://github.com/selkies-project/selkies
