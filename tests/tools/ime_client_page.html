 The real input.ts on a bare page, with hooks that replay IME and
 soft-keyboard event traces against it and decode what it sent. Served from
 the repository root by tests/e2e/ime_composition.spec.ts.
-->
<html><head><meta charset="utf-8"></head><body>
<input id="overlayInput" type="search">
<input id="keyboard-input-assist" style="display:none">
<script type="module">
window.__sent = [];
window.__errs = [];
try {
  const mod = await import('/web/selkies-web-core/lib/input.ts');
  const el = document.getElementById('overlayInput');
  const send = (m) => window.__sent.push(m);
  window.__input = new mod.Input(el, send, false, null, false);
  window.__input.attach();
  el.focus();
  window.__ready = true;
} catch (e) { window.__errs.push(e.message + ' ' + (e.stack || '').slice(0, 300)); }
window.__dispatch = (kind, data) => {
  const el = document.getElementById('overlayInput');
  let ev;
  if (kind.startsWith('composition')) {
    ev = new CompositionEvent(kind, { data });
  } else if (kind === 'textInput') {
    ev = document.createEvent('TextEvent');
    ev.initTextEvent('textInput', true, true, window, data, 0, '');
  } else {
    return;
  }
  el.dispatchEvent(ev);
};
window.__replay = (groups) => {
  for (const g of groups) {
    window.__dispatch('compositionstart', '');
    for (const [kind, data] of g) window.__dispatch(kind, data);
  }
};
// Same replay, but the wire text is captured after step index `probeIdx` of
// each group (indexing matches the trace arrays): asserts the preedit rolled
// forward mid-syllable instead of only checking end-state text.
window.__replayWithProbe = (groups, probeIdx) => {
  window.__mid = [];
  for (const g of groups) {
    window.__dispatch('compositionstart', '');
    for (let i = 0; i < g.length; i++) {
      window.__dispatch(g[i][0], g[i][1]);
      if (i === probeIdx) window.__mid.push(window.__decodeWire());
    }
  }
};
// A dashboard soft Control (a constructed keydown on window, in synth mode as
// the dashboards set it) held over one soft-keyboard tap of `c`, in the
// anatomy `platform` reports: Android Chromium's keyCode 229 keydown with the
// letter only in the assist text, or iOS's named keydown plus text echo.
window.__softChord = (platform) => {
  const assist = document.getElementById('keyboard-input-assist');
  const key = (type, init) => new KeyboardEvent(type, { bubbles: true, cancelable: true, ...init });
  const tap = platform === 'android'
    ? { key: 'Unidentified', keyCode: 229 }
    : { key: 'c', keyCode: 67 };
  window.__input.setSynth(true);
  window.dispatchEvent(key('keydown', { key: 'Control', code: 'ControlLeft', ctrlKey: true }));
  assist.dispatchEvent(key('keydown', tap));
  assist.value = 'c';
  assist.dispatchEvent(new Event('input', { bubbles: true }));
  assist.dispatchEvent(key('keyup', tap));
  window.dispatchEvent(key('keyup', { key: 'Control', code: 'ControlLeft' }));
  window.__input.setSynth(false);
  return window.__sent.filter((m) => !m.startsWith('kh,'));
};
// Replays a captured soft-keyboard trace on the assist field: each step is
// [kind, data, value, inputType]; an input step sets the field's value first,
// as the engine has by the time the event fires.
window.__assistReplay = (steps) => {
  const assist = document.getElementById('keyboard-input-assist');
  assist.dispatchEvent(new FocusEvent('focus'));
  for (const [kind, data, value, inputType] of steps) {
    let ev;
    if (kind === 'keydown' || kind === 'keyup') {
      ev = new KeyboardEvent(kind, { key: data, keyCode: 229, bubbles: true, cancelable: true });
    } else if (kind.startsWith('composition')) {
      ev = new CompositionEvent(kind, { data, bubbles: true });
    } else if (kind === 'textInput') {
      ev = document.createEvent('TextEvent');
      ev.initTextEvent('textInput', true, true, window, data, 0, '');
    } else {
      assist.value = value;
      ev = new InputEvent('input', { data, inputType, bubbles: true });
    }
    assist.dispatchEvent(ev);
  }
};
window.__assistValue = () => document.getElementById('keyboard-input-assist').value;
window.__decodeWire = () => {
  let txt = '';
  for (const m of window.__sent) {
    if (m.startsWith('kd,')) {
      const ks = parseInt(m.slice(3), 10);
      if (ks === 65288) txt = txt.slice(0, -1);
      else if (ks >= 0x01000000) txt += String.fromCodePoint(ks - 0x01000000);
      else if (ks >= 0x20 && ks < 0x100) txt += String.fromCharCode(ks);
    } else if (m.startsWith('co,end,')) {
      txt += m.slice(7);
    }
  }
  return txt;
};
</script></body></html>
