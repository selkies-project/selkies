name: Clean disk space
description: >-
  Free disk space on GitHub-hosted runners (widely used cleanup: removes the
  preinstalled .NET, Android SDK, GHC, CodeQL caches and prunes Docker images)
runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        sudo docker image prune --all --force || true
        sudo apt-get clean || true
        df -h
