# Every ecosystem is grouped into a single weekly pull request: this repository
# carries five of them across a dozen manifests, and one pull request per
# dependency would bury everything else.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # No pip entry: every Python dependency here is a lower bound with no upper
  # cap, so pip already installs the newest compatible release and a bump would
  # only raise the floor. Worse, the updater ignores `requires-python`, so those
  # bumps land on releases that no longer support the 3.9 this package supports.

  # Web client: core, dashboard, and the Wish dashboard
  - package-ecosystem: npm
    directories: ["/addons/selkies-web-core", "/addons/selkies-dashboard", "/addons/selkies-dashboard-wish"]
    schedule:
      interval: weekly
    groups:
      web-client:
        patterns: ["*"]
    ignore:
      # eslint-plugin-react peers at eslint ^9.7 in its newest release, so an
      # eslint major cannot resolve until upstream ships support for it
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  # Base images of the wheel builder, the devcontainer, and the published images
  - package-ecosystem: docker
    directories: ["/", "/.devcontainer", "/addons/coturn", "/addons/example", "/addons/turn-rest"]
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Node majors follow the LTS cadence, not whatever tag is newest: the
      # odd-numbered releases reach end of life within months of shipping
      - dependency-name: "*node"
        update-types: ["version-update:semver-major"]

  # The devcontainers updater discovers `.devcontainer/**/devcontainer.json`
  # itself; naming the per-image directories makes it report them as not found
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    groups:
      devcontainer-features:
        patterns: ["*"]
