name: Release published

# The Release workflow assembles a draft, and GitHub decides the "Latest" badge
# when a maintainer publishes it, from the publisher's checkbox rather than
# from anything the draft carried. A run that held its release back from
# `latest` left a marker in the draft's notes; this applies that mark once the
# release is public, so the badge stays on the release it was on.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  latest:
    name: Apply the release's latest designation
    runs-on: ubuntu-latest
    steps:
      - name: Hold a release marked as not the latest off the badge
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          set -e
          case "${BODY}" in
            *'<!-- selkies-release: latest=false -->'*)
              gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --latest=false
              echo "${TAG} is held off the latest badge" ;;
            *)
              echo "${TAG} keeps the badge GitHub gave it" ;;
          esac
