name: Release published

# The Release workflow assembles a draft, and GitHub decides the "Latest" badge
# when a maintainer publishes it, from the publisher's checkbox rather than
# from anything the draft carried. The run's `latest` decision rides in the
# draft's notes as a marker; this applies it once the release is public, then
# rebuilds the docs site, which lists the release and aliases `latest` to the
# release holding the badge. The run's `pypi` decision rides beside it, and
# publishes the wheel and the sdist the release carries through the trusted
# publisher registered on PyPI for this workflow file and the `pypi`
# environment.

on:
  release:
    types: [published]

permissions:
  contents: write
  actions: write

jobs:
  latest:
    name: Apply the release's latest designation
    runs-on: ubuntu-latest
    steps:
      - name: Put the badge where the run decided
        # A pre-release holds no badge, whatever its notes say
        if: ${{ !github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          set -e
          case "${BODY}" in
            *'<!-- selkies-release: latest=true -->'*) latest=true ;;
            *'<!-- selkies-release: latest=false -->'*) latest=false ;;
            *) echo "${TAG} keeps the badge GitHub gave it"; exit 0 ;;
          esac
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --latest="${latest}"
          echo "${TAG}: latest=${latest}"
      - name: Rebuild the docs site around the published release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yaml --repo "${GITHUB_REPOSITORY}" --ref "${{ github.event.repository.default_branch }}"

  pypi:
    name: Publish the wheel to PyPI
    if: >-
      ${{ contains(github.event.release.body, '<!-- selkies-release: pypi=true -->') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/selkies/${{ github.event.release.tag_name }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Take the wheel and the sdist off the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir dist --pattern "selkies-${TAG}-py3-none-any.whl" --pattern "selkies-${TAG}.tar.gz"
      - name: Publish them to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
