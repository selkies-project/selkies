# Fuzzes the parsers of what a peer sends in selkies-rtc (rtp, sctp, sdp,
# stun), pixelflux (sps), and pcmflux (red) with ClusterFuzzLite: changed code
# for five minutes on a pull request, and every fuzzer for an hour a day,
# whose corpus is then pruned. Corpora and crashes are kept as artifacts.
name: Fuzz

on:
  pull_request:
    paths:
      - "crates/selkies-rtc/Cargo.toml"
      - "crates/selkies-rtc/src/**"
      - "crates/selkies-rtc/vendor/**"
      - "crates/selkies-rtc/fuzz/**"
      - "crates/pixelflux/src/encoders/bits.rs"
      - "crates/pixelflux/src/encoders/codec.rs"
      - "crates/pixelflux/src/encoders/sps.rs"
      - "crates/pixelflux/fuzz/**"
      - "crates/pcmflux/src/red.rs"
      - "crates/pcmflux/fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzz.yaml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    if: github.event_name != 'schedule' || github.repository == 'selkies-project/selkies'
    runs-on: ubuntu-latest
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 300 || 3600 }}
      - if: ${{ github.event_name != 'pull_request' }}
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
          mode: prune
