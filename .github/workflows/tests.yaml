name: Tests

# The suites in tests/. The integration tier runs on every push and pull
# request; the browser tier is long enough to run nightly and on request, and
# the perf and soak tiers only on request.
#
# tests/README.md documents what each tier needs and how to run it locally.

on:
  workflow_dispatch:
    inputs:
      tiers:
        description: 'Marker expression, e.g. "e2e" or "integration or e2e"'
        type: string
        default: integration or e2e
      suites:
        description: 'Suite name expression (pytest -k), e.g. "portal or codecs"; empty runs every suite of the tiers'
        type: string
        default: ''
      runner:
        description: 'Runner image of the suites, e.g. "ubuntu-26.04" ahead of ubuntu-latest'
        type: string
        default: ubuntu-latest
  workflow_call:
    inputs:
      tiers:
        description: Marker expression selecting the tiers to run
        type: string
        default: integration
      wheels_ready:
        description: The caller already built the pixelflux and pcmflux wheels in this run
        type: boolean
        default: false
  schedule:
    # Nightly full browser matrix
    - cron: "0 4 * * *"

# `github.workflow` resolves to the CALLING workflow inside a `workflow_call`,
# so deriving the group from it would produce ci.yaml's own group and deadlock
# every run that calls this one. The literal name keeps standalone runs
# deduplicated, the event keeps the nightly browser matrix from being
# canceled by a push to the same ref, and the selection keeps a dispatch of
# some tiers, suites, or runner from canceling one of others.
concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}-${{ inputs.tiers }}-${{ inputs.suites }}-${{ inputs.runner }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "26"
  E2E_DISPLAY: ":99"
  # Drive the release Chrome and Firefox builds rather than Playwright's own
  E2E_CHROME: /usr/bin/google-chrome
  E2E_FIREFOX: /usr/bin/firefox

jobs:
  unit:
    name: Unit suites (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The uinput ABI is computed in pure Python, so every interpreter the
        # package claims support for checks it against the kernel headers
        python-version: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          # The newest interpreter is taken from its release candidates until
          # its final release
          allow-prereleases: true
      # The dashboard translation audit is JavaScript, and reports itself
      # skipped rather than passing when it cannot run
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build the test tools
        run: make -C tests/tools
      # Without it the shell suite still passes, having run only bash -n: the
      # lint half reports itself skipped inside a suite that exits zero, so
      # nothing else notices it never ran.
      - name: Install shellcheck
        run: scripts/ci/install-shellcheck.sh
      - name: Run the unit tier
        run: |
          # The suites import the source tree, so every module-level import
          # under selkies has to resolve: the runtime dependencies from
          # pyproject.toml minus the capture stack, which the suites stub.
          python scripts/ci/unit-deps.py > "${RUNNER_TEMP}/unit-requirements.txt"
          python -m pip install pytest -r "${RUNNER_TEMP}/unit-requirements.txt"
          python -m pytest tests -m unit -v --junitxml=unit-report.xml
      - name: Fail if any suite skipped
        if: ${{ !cancelled() }}
        run: python tests/tools/assert_no_skips.py unit-report.xml

  # pixelflux and pcmflux ship as wheels this run has in hand rather than from
  # an index, which carries neither pre-release. The caller passes them in as
  # artifacts when it has already resolved them; a standalone run resolves them
  # here, downloading each project's per-commit pre-release or building what
  # has none yet.
  wheels:
    name: Capture stack (main HEAD)
    if: ${{ !inputs.wheels_ready }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-pixelflux-pcmflux-wheels.yaml

  # Three shards, each the third of the selected cases tests/conftest.py deals
  # it by budget, so a shard stays inside the job's two hours.
  suites:
    name: Suites (${{ inputs.tiers || 'integration or e2e' }}, ${{ matrix.shard }}/3)
    needs: [wheels]
    if: ${{ always() && (needs.wheels.result == 'success' || needs.wheels.result == 'skipped') }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_packages: azure-cli google-cloud-cli microsoft-edge-stable postgresql* temurin-* mysql* mongodb*
          remove_packages_one_command: true
          remove_folders: /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/local/share/vcpkg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            addons/selkies-web-core/package.json
            addons/selkies-dashboard/package.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install the display server, audio, and GPU userspace
        run: |
          sudo apt-get update
          # Ubuntu 26.04 names libxml2's package by its soname
          libxml2=libxml2
          if apt-cache show libxml2-16 > /dev/null 2>&1; then libxml2="libxml2-16"; fi
          sudo apt-get install --no-install-recommends -y \
            xvfb x11-xserver-utils x11-utils xauth xcvt wmctrl \
            wl-clipboard libsdl2-2.0-0 openbox kwin-x11 kwin-wayland kwin-common \
            pulseaudio pulseaudio-utils \
            dbus pipewire wireplumber xdg-desktop-portal xdg-desktop-portal-kde qtwayland5 qt6-wayland \
            mutter python3-gi \
            libxcb-shm0 libxcb-xfixes0 libxcb-randr0 libxcb-dri3-0 \
            libxkbcommon0 libxdamage1 libxfixes3 libxtst6 \
            libgl1 libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1 libdrm2 libva2 libva-drm2 mesa-va-drivers \
            coturn cups-daemon cups-client cups-filters \
            xwayland libinput10 libseat1 librsvg2-2 liblcms2-2 "$libxml2" libvulkan1 \
            libpixman-1-0 libwayland-server0 libwayland-cursor0 libwayland-egl1 \
            libgles2 libxcb-composite0 libxcb-ewmh2 libxcb-icccm4 \
            libxcb-render-util0 libxcb-res0 libxcb-xinput0
      # KWin 6 casts the screen only while it composites with OpenGL, which its
      # virtual backend does on a render node alone: vgem gives the runner a
      # software one, which Mesa's llvmpipe draws on. KWin 5 composites on
      # Mesa's surfaceless platform and needs none.
      - name: Give KWin 6 a render node
        run: |
          if dpkg --compare-versions "$(dpkg-query -W -f='${Version}' kwin-wayland)" ge 4:6; then
            sudo modprobe vgem || {
              sudo apt-get install --no-install-recommends -y "linux-modules-extra-$(uname -r)"
              sudo modprobe vgem
            }
            # udev sets the new nodes' modes once it gets to them
            sudo udevadm settle
            sudo chmod a+rw /dev/dri/*
            ls -l /dev/dri
          fi
      # The compositor the Wayland suites drive is the one the images ship:
      # the pinned wlroots and the patched labwc, built by the same script as
      # the base image's labwc stage (the distribution's labwc has neither the
      # control socket nor the seam patch, and the no-skip gate would trip on
      # the suites that need them). The pins are read from the Dockerfile so
      # this job can never drift from the image.
      - name: Resolve the patched labwc pins
        id: labwc
        run: |
          eval "$(grep -E '^ARG (WLROOTS|LABWC)_VERSION=' addons/base/Dockerfile | sed 's/^ARG //')"
          {
            echo "wlroots=${WLROOTS_VERSION}"
            echo "labwc=${LABWC_VERSION}"
            echo "image=$(. /etc/os-release && echo "${ID}${VERSION_ID}")"
          } >> "$GITHUB_OUTPUT"
      - name: Cache the patched labwc
        id: labwc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/labwc
          key: labwc-${{ steps.labwc.outputs.image }}-${{ steps.labwc.outputs.wlroots }}-${{ steps.labwc.outputs.labwc }}-${{ hashFiles('addons/base/patches/labwc-*.patch', 'addons/base/build-labwc.sh', 'scripts/ci/runtime-packages.sh') }}
      - name: Build the patched labwc
        if: steps.labwc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install --no-install-recommends -y \
            build-essential gettext git glslang-tools hwdata meson ninja-build pkg-config \
            libcairo2-dev libdisplay-info-dev libdrm-dev libgbm-dev libglib2.0-dev \
            libglvnd-dev libinput-dev liblcms2-dev libliftoff-dev libpango1.0-dev \
            libpixman-1-dev libpng-dev librsvg2-dev libseat-dev libudev-dev libvulkan-dev \
            libffi-dev libexpat1-dev libxml2-dev \
            libwayland-dev libxcb1-dev libxcb-composite0-dev libxcb-dri3-dev libxcb-ewmh-dev \
            libxcb-icccm4-dev libxcb-present-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-render-util0-dev libxcb-res0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinput-dev libxkbcommon-dev \
            wayland-protocols
          WLROOTS_VERSION="${{ steps.labwc.outputs.wlroots }}" \
            LABWC_VERSION="${{ steps.labwc.outputs.labwc }}" \
            PREFIX="$HOME/.local/labwc" addons/base/build-labwc.sh
          scripts/ci/runtime-packages.sh record "$HOME/.local/labwc"
      # A cache hit skips the build step and with it the build's apt closure;
      # the build recorded the packages its libraries come from, which depend
      # on what it found on this release (26.04's libliftoff, which 24.04's is
      # too old for).
      - name: Install the patched labwc's runtime libraries
        if: steps.labwc-cache.outputs.cache-hit == 'true'
        run: scripts/ci/runtime-packages.sh install "$HOME/.local/labwc"
      - name: Put the patched labwc on the session path
        run: echo "$HOME/.local/labwc/bin" >> "$GITHUB_PATH"
      # A runtime library the record misses would otherwise surface as every
      # nested suite timing out; a loader error here names it instead.
      # Runs bare on purpose: the build's own rpath has to resolve its
      # libraries, since an exported LD_LIBRARY_PATH would leak into every
      # server and browser the suites start.
      - name: Verify the patched labwc
        run: labwc --version
      # Likewise the X server: the images build XLibre's Xvfb with the Selkies
      # patches, and the X11 layout the suites see depends on what the server
      # offers (an output per display against logical monitors), so the suites
      # drive that server. The pin and its checksum are read from the
      # Dockerfile as well.
      - name: Resolve the patched Xvfb pin
        id: xvfb
        run: |
          eval "$(grep -E '^ARG XLIBRE_(TAG|SHA256)=' addons/base/Dockerfile | sed 's/^ARG //')"
          {
            echo "tag=${XLIBRE_TAG}"
            echo "sha256=${XLIBRE_SHA256}"
            echo "image=$(. /etc/os-release && echo "${ID}${VERSION_ID}")"
          } >> "$GITHUB_OUTPUT"
      - name: Cache the patched Xvfb
        id: xvfb-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/xvfb
          key: xvfb-${{ steps.xvfb.outputs.image }}-${{ steps.xvfb.outputs.tag }}-${{ hashFiles('addons/base/patches/xvfb-*.patch', 'addons/base/build-xvfb.sh', 'scripts/ci/runtime-packages.sh') }}
      - name: Build the patched Xvfb
        if: steps.xvfb-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install --no-install-recommends -y \
            build-essential git meson ninja-build pkg-config \
            libaudit-dev libbsd-dev libdrm-dev libepoxy-dev libfontenc-dev libgbm-dev \
            libglvnd-dev libpixman-1-dev libselinux1-dev libssl-dev libx11-dev libxau-dev \
            libxcvt-dev libxdmcp-dev libxext-dev libxfont-dev libxkbfile-dev \
            libxshmfence-dev mesa-common-dev x11proto-dev xtrans-dev
          XLIBRE_TAG="${{ steps.xvfb.outputs.tag }}" XLIBRE_SHA256="${{ steps.xvfb.outputs.sha256 }}" \
            PREFIX="$HOME/.local/xvfb" addons/base/build-xvfb.sh
          scripts/ci/runtime-packages.sh record "$HOME/.local/xvfb"
      - name: Install the patched Xvfb's runtime libraries
        if: steps.xvfb-cache.outputs.cache-hit == 'true'
        run: scripts/ci/runtime-packages.sh install "$HOME/.local/xvfb"
      - name: Put the patched Xvfb on the session path
        run: echo "$HOME/.local/xvfb/bin" >> "$GITHUB_PATH"
      - name: Verify the patched Xvfb
        run: |
          Xvfb -help 2>&1 | grep -q -- 'CRTCs per screen (default: 4)'
      # The suites have to exercise the pixelflux and pcmflux that the images,
      # packages, and AppImages ship, which come from main HEAD rather than any
      # released version. Whichever job resolved them left them here.
      - name: Download the pixelflux wheels (main HEAD)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: pixelflux-wheels-*
          path: main-wheels/
          merge-multiple: true
      - name: Download the pcmflux wheels (main HEAD)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: pcmflux-wheels-*
          path: main-wheels/
          merge-multiple: true
      - name: Install selkies and the test dependencies
        run: |
          python -m pip install --upgrade pip
          # Built once and installed from the wheel, rather than installed from
          # the source tree: dist/ is where the packaging suite looks, so it
          # packages the very artifact these suites ran against instead of
          # spending another build on a second copy of it.
          python -m pip wheel --no-deps -w dist .
          # The pinned pixelflux/pcmflux are a pre-release no index carries:
          # resolve them from the main-HEAD wheels downloaded above. The test extras
          # (pytest, playwright, ...) come from the wheel's own [test] group.
          mkdir -p main-wheels
          wheel="$(ls dist/selkies-*.whl)"
          python -m pip install --find-links "$PWD/main-wheels" "${wheel}[test]"
          ABI="cp$(python -c 'import sys; print(f"{sys.version_info.major}{sys.version_info.minor}")')"
          WHEEL_GLOB="*${ABI}-*manylinux*$(uname -m)*.whl"
          # Fatal rather than a note: a run that quietly took an index's copy
          # tests a capture stack nothing ships, and reports it as a pass.
          for project in pixelflux pcmflux; do
            found="$(find main-wheels -maxdepth 1 -name "${project}-${WHEEL_GLOB}" 2>/dev/null || true)"
            if [ -z "${found}" ]; then
              echo "::error::No main-HEAD ${project} wheel matching ${WHEEL_GLOB}"
              exit 1
            fi
            echo "${found}" | xargs python -m pip install --force-reinstall --no-deps
            echo "${found}" | xargs cp -t dist/
          done
          python -c 'import pixelflux, pcmflux; print("capture stack:", pixelflux.__file__)'
      - name: Build the web client
        env:
          # For the controller database's lookups (gendb.js)
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/build-web.sh
      - name: Build the test tools
        run: make -C tests/tools
      # The same stack a development sandbox starts, on the display the
      # workflow names
      - name: Start the display server and audio
        run: scripts/ci/test-stack.sh
      # The integration tier drives Chromium as well, for the gamepad and
      # WebRTC-transport suites; only the browser matrix needs the other engines
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      # Release Chrome alongside it: its media stack differs from Chromium's,
      # and E2E_CHROME is what points the suites at a system browser. From
      # Google's apt repository, its key checked against the fingerprint Google
      # publishes. The entry a preinstalled Chrome added names the key its
      # package carries, which apt refuses beside one naming another; the
      # defaults file keeps the package from writing it back.
      - name: Install Google Chrome
        run: |
          addons/base/fetch-verified key "https://dl.google.com/linux/linux_signing_key.pub" \
              EB4C1BFD4F042F6DDDCCEC917721F63BD38B4796 /tmp/google-chrome.asc
          sudo install -Dm644 /tmp/google-chrome.asc /etc/apt/keyrings/google-chrome.asc
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          printf 'Types: deb\nURIs: https://dl.google.com/linux/chrome/deb/\nSuites: stable\nComponents: main\nSigned-By: /etc/apt/keyrings/google-chrome.asc\n' \
              | sudo tee /etc/apt/sources.list.d/google-linux.sources > /dev/null
          printf 'repo_add_once="false"\nrepo_reenable_on_distupgrade="false"\n' | sudo tee /etc/default/google-chrome > /dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y google-chrome-stable
      - name: Install WebKit
        if: contains(inputs.tiers || 'integration or e2e', 'e2e')
        run: python -m playwright install --with-deps webkit
      # Release Firefox, which the suites drive over WebDriver BiDi as they do
      # locally: Playwright's own Firefox build holds a large WebSocket send in
      # its automation layer when the cores are busy, and a camera on the JPEG
      # rung stops. From Mozilla's apt repository, its key checked against the
      # fingerprint Mozilla publishes, pinned above Ubuntu's snap package.
      - name: Install Firefox
        if: contains(inputs.tiers || 'integration or e2e', 'e2e')
        run: |
          addons/base/fetch-verified key "https://packages.mozilla.org/apt/repo-signing-key.gpg" \
              35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3 /tmp/packages.mozilla.org.asc
          sudo install -Dm644 /tmp/packages.mozilla.org.asc /etc/apt/keyrings/packages.mozilla.org.asc
          printf 'Types: deb\nURIs: https://packages.mozilla.org/apt\nSuites: mozilla\nComponents: main\nSigned-By: /etc/apt/keyrings/packages.mozilla.org.asc\n' \
              | sudo tee /etc/apt/sources.list.d/mozilla.sources > /dev/null
          printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' \
              | sudo tee /etc/apt/preferences.d/mozilla > /dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y --allow-downgrades firefox
          "$E2E_FIREFOX" --version
      # WebKit paints every <video> through its GL sink, which needs GStreamer's
      # opengl plugin; without it a silent software fallback is what the suites
      # would measure, so the plugin is named and checked here rather than left
      # to Playwright's dependency list (the harness refuses WebKit without it).
      - name: Install the GStreamer plugin WebKit's video sink needs
        if: contains(inputs.tiers || 'integration or e2e', 'e2e')
        run: |
          sudo apt-get install --no-install-recommends -y gstreamer1.0-gl gstreamer1.0-tools
          gst-inspect-1.0 opengl > /dev/null
      # A page that stops answering gets every WebKit thread's stack printed
      # (tests/helpers.py), which takes gdb, run as root to attach under Yama.
      - name: Install gdb for the stall reports
        if: contains(inputs.tiers || 'integration or e2e', 'e2e')
        run: sudo apt-get install --no-install-recommends -y gdb
      # Firefox negotiates H.264 only with the OpenH264 GMP, which a fresh
      # profile never carries; without this the whole firefox-wr block skips.
      - name: Install the OpenH264 plugin for Firefox
        if: contains(inputs.tiers || 'integration or e2e', 'e2e')
        run: sh tests/tools/fetch-openh264.sh
      # The suites' own output goes into the report, so the no-skip gate below
      # can list the checks a suite recorded as unobserved.
      - name: Run the suites
        env:
          TIERS: ${{ inputs.tiers || 'integration or e2e' }}
          SUITES: ${{ inputs.suites || '' }}
          SELKIES_SUITE_SHARD: ${{ matrix.shard }}/3
        # A narrow selection can leave a shard nothing: pytest's 5, not a failure.
        run: python -m pytest tests -m "${TIERS}" -k "${SUITES}" -v --junitxml=suites-report.xml -o junit_logging=system-out || [ $? = 5 ]
      - name: Fail if any suite skipped
        if: ${{ !cancelled() }}
        run: python tests/tools/assert_no_skips.py suites-report.xml
      - name: Collect the server logs
        if: always()
        run: |
          # The last suite's logs, and the copy the runner kept of every suite's
          mkdir -p suite-logs
          cp -r /tmp/selkies-tests/*.log suite-logs/ 2>/dev/null || true
          cp -r /tmp/selkies-tests/suite-logs/. suite-logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: suite-logs-${{ matrix.shard }}
          path: suite-logs/
          if-no-files-found: ignore
          retention-days: 7
