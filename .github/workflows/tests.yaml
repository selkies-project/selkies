name: Tests

# The suites in tests/. The integration tier and a smoke selection of the
# browser tier run on every push and pull request (ci.yaml); the whole browser
# tier is long enough to run nightly and on request, and the perf and soak
# tiers only on request.
#
# tests/README.md documents what each tier needs and how to run it locally.

on:
  workflow_dispatch:
    inputs:
      tiers:
        description: 'Marker expression, e.g. "e2e" or "integration or e2e"'
        type: string
        default: integration or e2e
      suites:
        description: 'Case expression (cargo xtask suites --match), e.g. "portal or codecs"; empty runs every suite of the tiers'
        type: string
        default: ''
      runner:
        description: 'Runner image of the suites, e.g. "ubuntu-26.04" ahead of ubuntu-latest'
        type: string
        default: ubuntu-latest
  workflow_call:
    inputs:
      tiers:
        description: Marker expression selecting the tiers to run
        type: string
        default: integration
      wheels_ready:
        description: The caller already built the selkies wheel in this run, and the pixelflux and pcmflux wheels where the soak tier runs
        type: boolean
        default: false
      suites:
        description: Case expression (cargo xtask suites --match) within the tiers; a call that names its suites runs them alone, without the unit jobs
        type: string
        default: ''
      shards:
        description: JSON list of the shards to deal the selected suites into, e.g. "[1]" for one job
        type: string
        default: '[1, 2, 3]'
  schedule:
    # Nightly full browser matrix
    - cron: "0 4 * * *"

# `github.workflow` resolves to the CALLING workflow inside a `workflow_call`,
# so deriving the group from it would produce ci.yaml's own group and deadlock
# every run that calls this one. The literal name keeps standalone runs
# deduplicated, the event keeps the nightly browser matrix from being
# canceled by a push to the same ref, and the selection keeps a dispatch of
# some tiers, suites, or runner from canceling one of others.
concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}-${{ inputs.tiers }}-${{ inputs.suites }}-${{ inputs.runner }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "26"
  E2E_DISPLAY: ":99"
  # Drive the release Chrome and Firefox builds rather than Playwright's own
  E2E_CHROME: /usr/bin/google-chrome
  E2E_FIREFOX: /usr/bin/firefox

jobs:
  unit:
    name: Unit suites
    needs: [wheel]
    if: >-
      ${{ always() && !inputs.suites && contains(fromJSON('["success", "skipped"]'), needs.wheel.result)
          && (github.event_name != 'schedule' || github.repository == 'selkies-project/selkies') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The unit tier is Node's: the audits of the web client and the scripts
      # (tests/tools/*_audit.ts), which import the source tree directly
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build the test tools
        run: make -C tests/tools
      # The command-dispatch audit drives the current build's real server, not
      # whichever selkies happens to be installed on the runner: the one this
      # run's bundle carries.
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-glibc-x86_64
          path: ${{ runner.temp }}/bundle-archive
      - name: Unpack the server under test
        run: |
          mkdir -p "${RUNNER_TEMP}/bundle"
          tar -C "${RUNNER_TEMP}/bundle" -xzf "${RUNNER_TEMP}"/bundle-archive/selkies-*.tar.gz
          server="$(echo "${RUNNER_TEMP}"/bundle/selkies-*/bin/selkies)"
          "${server}" --version
          "${server}" --help > /dev/null
          echo "SELKIES_TEST_SERVER=${server}" >> "$GITHUB_ENV"
      # The driver (crates/xtask), on the toolchain the server is built with
      - name: Install the pinned Rust toolchain
        run: |
          pin="$(sed -n 's/^PIN="\(.*\)"$/\1/p' infra/packaging/rust.sh)"
          scripts/ci/retry.sh 5 60 rustup toolchain install "${pin}" --profile minimal
          rustup default "${pin}"
      # The driver fails the run on a suite that skips as a whole
      - name: Run the unit tier
        run: cargo xtask suites --tier unit --junit unit-report.xml

  # The server's own unit tier, which runs wherever the suites' does
  server-unit:
    name: Unit tests (server)
    if: ${{ !inputs.suites && (github.event_name != 'schedule' || github.repository == 'selkies-project/selkies') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/selkies-web-core/package-lock.json
            web/selkies-dashboard/package-lock.json
      # The server's build embeds the bundle in dist/web, which its tests check
      - name: Build the web client
        env:
          # For the controller database's lookups (gendb.ts)
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/build-web.sh
      - name: Install the server's toolchain and libraries
        run: scripts/ci/server-build-deps.sh
      # The audio tests drive a real sound server, the one the suites stream
      # from, whose null sink stays the default while they load and unload
      # sinks beside it
      - name: Start the display server and audio
        run: |
          sudo apt-get install --no-install-recommends -y xvfb pulseaudio pulseaudio-utils
          scripts/ci/test-stack.sh
          echo "PULSE_SERVER=unix:$(pactl info | sed -n 's/^Server String: //p')" >> "$GITHUB_ENV"
      # For the wheel selector's suite (crates/selkies-suites/tests/wheel_selection.rs):
      # the selector reads wheel tags with packaging, under the runner's python3
      - name: Install packaging for the wheel selector
        run: sudo apt-get install --no-install-recommends -y python3-packaging
      # For the shell suite (crates/selkies-suites/tests/session_scripts.rs).
      # Without it the suite still passes, having run only bash -n: the lint
      # half reports itself skipped inside a test that passes, so nothing else
      # notices it never ran.
      - name: Install shellcheck
        run: scripts/ci/install-shellcheck.sh
      - name: cargo test
        run: cargo test --locked --workspace
      - name: cargo test (vendored rtc crates)
        run: scripts/ci/test-vendored.sh
      # The virtual webcam below the transports (crates/selkies/tests/webcam_device.rs): read
      # through the interposer by its probe, ffmpeg and v4l2-ctl, and from the camera's PipeWire
      # node, which a session daemon with its session manager links; every check has to run
      - name: The virtual webcam through the interposer
        run: |
          sudo apt-get install --no-install-recommends -y ffmpeg v4l-utils dbus pipewire pipewire-bin wireplumber libpipewire-0.3-dev
          if ! pw-cli info 0 > /dev/null 2>&1; then
            dbus-run-session -- /usr/bin/pipewire > /tmp/selkies-pipewire.log 2>&1 &
            timeout 60 sh -c 'until pw-cli info 0 > /dev/null 2>&1; do sleep 0.5; done'
            dbus-run-session -- /usr/bin/wireplumber > /tmp/selkies-wireplumber.log 2>&1 &
          fi
          set -o pipefail
          cargo test --locked -p selkies --test webcam_device -- --include-ignored --nocapture 2>&1 | tee webcam-device.log
          if grep '^SKIP' webcam-device.log; then
            echo "::error::the webcam suite left checks unrun"
            exit 1
          fi

  # The server the suites drive is the one this run's selkies wheel carries.
  # The soak tier drives pixelflux's and pcmflux's Python APIs as well, through
  # wheels this run has in hand rather than an index, which only it installs.
  # The caller passes them in as artifacts when it has already built them; a
  # standalone run builds them here.
  wheel:
    name: Build wheel
    if: ${{ !inputs.wheels_ready && (github.event_name != 'schedule' || github.repository == 'selkies-project/selkies') }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-wheel.yaml

  wheels:
    name: pixelflux and pcmflux wheels
    if: ${{ !inputs.wheels_ready && contains(inputs.tiers || '', 'soak') && (github.event_name != 'schedule' || github.repository == 'selkies-project/selkies') }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-pixelflux-pcmflux-wheels.yaml
    with:
      package_version: 0.0.0.dev0

  # The suites' stand-in camera, pixelflux's virtual_camera example, built
  # where the server's libraries are, since the suites job compiles none of
  # pixelflux; the distribution packages it loads ride along with it
  # (scripts/ci/runtime-packages.sh)
  camera:
    name: Stand-in camera
    if: ${{ github.event_name != 'schedule' || github.repository == 'selkies-project/selkies' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the server's toolchain and libraries
        run: scripts/ci/server-build-deps.sh
      - name: Build the stand-in camera
        run: |
          cargo build --locked -p pixelflux --example virtual_camera
          mkdir -p camera/bin
          cp target/debug/examples/virtual_camera camera/bin/
          strip camera/bin/virtual_camera
          scripts/ci/runtime-packages.sh record camera
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suites-camera
          path: camera/
          if-no-files-found: error
          retention-days: 1

  # Three shards unless the caller names others, each the share of the
  # selected cases the driver (cargo xtask suites) deals it by budget, so a shard stays
  # inside the job's two hours.
  suites:
    name: Suites (${{ inputs.tiers || 'integration or e2e' }}, ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [wheel, wheels, camera]
    if: >-
      ${{ always() && contains(fromJSON('["success", "skipped"]'), needs.wheel.result)
          && contains(fromJSON('["success", "skipped"]'), needs.wheels.result)
          && needs.camera.result == 'success'
          && (github.event_name != 'schedule' || github.repository == 'selkies-project/selkies') }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards || '[1, 2, 3]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_packages: azure-cli google-cloud-cli microsoft-edge-stable postgresql* temurin-* mysql* mongodb*
          remove_packages_one_command: true
          remove_folders: /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/local/share/vcpkg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/selkies-web-core/package.json
            web/selkies-dashboard/package.json
            tests/package-lock.json
      # Python only where a tool is Python's: Jupyter, which the e2e tier's
      # Jupyter suite serves the desktop through, and the soak tier, which
      # drives pixelflux's and pcmflux's Python bindings.
      - name: Set up Python
        id: python-first
        if: contains(inputs.tiers || 'integration or e2e', 'e2e') || contains(inputs.tiers || '', 'soak')
        # A download GitHub fails is tried again after a wait, twice.
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Wait out a download outage
        if: steps.python-first.outcome == 'failure'
        run: sleep 120
      - name: Set up Python, again
        id: python-again
        if: steps.python-first.outcome == 'failure'
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Wait out a longer download outage
        if: steps.python-again.outcome == 'failure'
        run: sleep 300
      - name: Set up Python, a third time
        id: python-third
        if: steps.python-again.outcome == 'failure'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the display server, audio, and GPU userspace
        run: |
          sudo apt-get update
          # Ubuntu 26.04 names libxml2's package by its soname
          libxml2=libxml2
          if apt-cache show libxml2-16 > /dev/null 2>&1; then libxml2="libxml2-16"; fi
          sudo apt-get install --no-install-recommends -y \
            xvfb x11-xserver-utils x11-utils xauth wmctrl \
            wl-clipboard libsdl2-2.0-0 openbox kwin-x11 kwin-wayland kwin-common \
            pulseaudio pulseaudio-utils \
            dbus pipewire pipewire-pulse wireplumber xdg-desktop-portal xdg-desktop-portal-kde qtwayland5 qt6-wayland \
            mutter libgtk-3-dev libxrandr-dev \
            pkg-config libx11-dev libxkbcommon-dev x11-xkb-utils \
            libudev-dev libpipewire-0.3-dev ffmpeg v4l-utils \
            libxcb-shm0 libxcb-xfixes0 libxcb-randr0 libxcb-dri3-0 \
            libxkbcommon0 libxdamage1 libxfixes3 libxtst6 \
            libgl1 libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1 libdrm2 libva2 libva-drm2 mesa-va-drivers \
            coturn cups-daemon cups-client cups-filters \
            xwayland libinput10 libseat1 librsvg2-2 liblcms2-2 "$libxml2" libvulkan1 \
            libpixman-1-0 libwayland-server0 libwayland-cursor0 libwayland-egl1 \
            libgles2 libxcb-composite0 libxcb-ewmh2 libxcb-icccm4 \
            libxcb-render-util0 libxcb-res0 libxcb-xinput0
      # KWin 6 casts the screen only while it composites with OpenGL, which its
      # virtual backend does on a render node alone: vgem gives the runner a
      # software one, which Mesa's llvmpipe draws on. KWin 5 composites on
      # Mesa's surfaceless platform and needs none.
      - name: Give KWin 6 a render node
        run: |
          if dpkg --compare-versions "$(dpkg-query -W -f='${Version}' kwin-wayland)" ge 4:6; then
            sudo modprobe vgem || {
              sudo apt-get install --no-install-recommends -y "linux-modules-extra-$(uname -r)"
              sudo modprobe vgem
            }
            # udev sets the new nodes' modes once it gets to them
            sudo udevadm settle
            sudo chmod a+rw /dev/dri/*
            ls -l /dev/dri
          fi
      # The nested compositor the Wayland suites drive: the pinned wlroots and
      # the patched labwc (the distribution's labwc has neither the control
      # socket nor the seam patch, and the no-skip gate would trip on the
      # suites that need them). The pins are the script's own.
      - name: Resolve the patched labwc pins
        id: labwc
        run: |
          eval "$(grep -E '^(WLROOTS|LABWC)_VERSION=' scripts/ci/build-labwc.sh)"
          {
            echo "wlroots=${WLROOTS_VERSION}"
            echo "labwc=${LABWC_VERSION}"
            echo "image=$(. /etc/os-release && echo "${ID}${VERSION_ID}")"
          } >> "$GITHUB_OUTPUT"
      - name: Cache the patched labwc
        id: labwc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/labwc
          key: labwc-${{ steps.labwc.outputs.image }}-${{ steps.labwc.outputs.wlroots }}-${{ steps.labwc.outputs.labwc }}-${{ hashFiles('scripts/ci/patches/labwc-*.patch', 'scripts/ci/build-labwc.sh', 'scripts/ci/runtime-packages.sh') }}
      - name: Build the patched labwc
        if: steps.labwc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install --no-install-recommends -y \
            build-essential gettext git glslang-tools hwdata meson ninja-build pkg-config \
            libcairo2-dev libdisplay-info-dev libdrm-dev libgbm-dev libglib2.0-dev \
            libglvnd-dev libinput-dev liblcms2-dev libliftoff-dev libpango1.0-dev \
            libpixman-1-dev libpng-dev librsvg2-dev libseat-dev libudev-dev libvulkan-dev \
            libffi-dev libexpat1-dev libxml2-dev \
            libwayland-dev libxcb1-dev libxcb-composite0-dev libxcb-dri3-dev libxcb-ewmh-dev \
            libxcb-icccm4-dev libxcb-present-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-render-util0-dev libxcb-res0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinput-dev libxkbcommon-dev \
            wayland-protocols
          WLROOTS_VERSION="${{ steps.labwc.outputs.wlroots }}" \
            LABWC_VERSION="${{ steps.labwc.outputs.labwc }}" \
            PREFIX="$HOME/.local/labwc" scripts/ci/build-labwc.sh
          scripts/ci/runtime-packages.sh record "$HOME/.local/labwc"
      # A cache hit skips the build step and with it the build's apt closure;
      # the build recorded the packages its libraries come from, which depend
      # on what it found on this release (26.04's libliftoff, which 24.04's is
      # too old for).
      - name: Install the patched labwc's runtime libraries
        if: steps.labwc-cache.outputs.cache-hit == 'true'
        run: scripts/ci/runtime-packages.sh install "$HOME/.local/labwc"
      - name: Put the patched labwc on the session path
        run: echo "$HOME/.local/labwc/bin" >> "$GITHUB_PATH"
      # A runtime library the record misses would otherwise surface as every
      # nested suite timing out; a loader error here names it instead.
      # Runs bare on purpose: the build's own rpath has to resolve its
      # libraries, since an exported LD_LIBRARY_PATH would leak into every
      # server and browser the suites start.
      - name: Verify the patched labwc
        run: labwc --version
      # Whichever jobs built them left the bundle, and for the soak tier both
      # native wheels, from this checkout here.
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-glibc-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: ${{ runner.temp }}/bundle-archive
      - name: Download the stand-in camera
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: suites-camera
          path: ${{ runner.temp }}/camera
      - name: Install the stand-in camera
        run: |
          chmod +x "${RUNNER_TEMP}/camera/bin/virtual_camera"
          scripts/ci/runtime-packages.sh install "${RUNNER_TEMP}/camera"
          "${RUNNER_TEMP}/camera/bin/virtual_camera" --bogus 2>&1 | grep -q "unknown option"
          echo "SELKIES_TEST_CAMERA=${RUNNER_TEMP}/camera/bin/virtual_camera" >> "$GITHUB_ENV"
      - name: Download the pixelflux wheels (local crates)
        if: contains(inputs.tiers || '', 'soak')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: pixelflux-wheels-*
          path: pixelflux-pcmflux-wheels/
          merge-multiple: true
      - name: Download the pcmflux wheels (local crates)
        if: contains(inputs.tiers || '', 'soak')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: pcmflux-wheels-*
          path: pixelflux-pcmflux-wheels/
          merge-multiple: true
      # The server under test is the one the bundle carries, run from where it
      # unpacks, as a user of the tarball runs it.
      - name: Unpack the server under test
        run: |
          mkdir -p "${RUNNER_TEMP}/bundle"
          tar -C "${RUNNER_TEMP}/bundle" -xzf "${RUNNER_TEMP}"/bundle-archive/selkies-*.tar.gz
          server="$(echo "${RUNNER_TEMP}"/bundle/selkies-*/bin/selkies)"
          "${server}" --version
          echo "SELKIES_TEST_SERVER=${server}" >> "$GITHUB_ENV"
      - name: Install Jupyter for the Jupyter suite
        if: contains(inputs.tiers || 'integration or e2e', 'e2e')
        run: scripts/ci/retry.sh 5 60 python -m pip install jupyter-server jupyter-server-proxy
      - name: Install the pixelflux and pcmflux wheels the soak tier drives
        if: contains(inputs.tiers || '', 'soak')
        run: |
          # The exact local native wheels downloaded above
          mkdir -p pixelflux-pcmflux-wheels
          SELECTOR="${GITHUB_WORKSPACE}/.devcontainer/features/desktop-selkies/src/select-compatible-wheels.py"
          # Fatal rather than a note: a run that quietly took an index's copy
          # tests a pixelflux and pcmflux the server does not link, and reports it as a pass.
          for project in pixelflux pcmflux; do
            mapfile -t found < <(find pixelflux-pcmflux-wheels -maxdepth 1 -name "${project}-*.whl" -print \
              | python "${SELECTOR}" "${project}")
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::Expected one compatible local ${project} wheel, found ${#found[@]}"
              exit 1
            fi
            python -m pip install --force-reinstall --no-deps "${found[0]}"
          done
          python -c 'import pixelflux, pcmflux; print("pixelflux and pcmflux:", pixelflux.__file__)'
      # Likewise the X server: the X11 layout the suites see depends on what the
      # server offers (an output per display against logical monitors), so the
      # suites drive the one the images ship, XLibre's Xvfb with the Selkies
      # patches, which the bundle carries. Only it joins the session path; it
      # finds its keymaps and libraries relative to itself.
      - name: Put the bundle's Xvfb on the session path
        run: |
          xvfb="$(echo "${RUNNER_TEMP}"/bundle/selkies-*/libexec/selkies/Xvfb)"
          mkdir -p "$HOME/.local/xvfb/bin"
          ln -sf "${xvfb}" "$HOME/.local/xvfb/bin/Xvfb"
          echo "$HOME/.local/xvfb/bin" >> "$GITHUB_PATH"
          "$HOME/.local/xvfb/bin/Xvfb" -help 2>&1 | grep -q -- 'CRTCs per screen (default: 4)'
      - name: Build the web client
        env:
          # For the controller database's lookups (gendb.ts)
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/build-web.sh
      - name: Build the test tools
        run: make -C tests/tools
      # The browser suites on Playwright Test (tests/*/*.spec.ts) run from the
      # tests package; they drive the system Chrome E2E_CHROME names, whose
      # libraries the Chromium install below brings.
      - name: Install the browser suites' packages
        working-directory: tests
        run: ../scripts/ci/retry.sh 5 60 npm ci --no-audit --no-fund
      # The Rust suites (crates/selkies-suites), and suites-host, the program of
      # that crate the Playwright suites start their servers through, depend on
      # no crate of the workspace, so they build here without the server's
      # libraries, on the toolchain the server is built with
      # (infra/packaging/rust.sh, the pin scripts/ci/server-build-deps.sh reads
      # too). Built ahead of the run, so no
      # suite's budget pays for the compile, and kept between runs, so a run
      # whose lockfile and suites are unchanged pays for neither the crates nor
      # the build.
      - name: Resolve the Rust toolchain pin
        id: rust
        run: |
          {
            echo "toolchain=$(sed -n 's/^PIN="\(.*\)"$/\1/p' infra/packaging/rust.sh)"
            echo "image=$(. /etc/os-release && echo "${ID}${VERSION_ID}")"
          } >> "$GITHUB_OUTPUT"
      - name: Cache the Rust suites' build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: suites-${{ steps.rust.outputs.image }}-${{ runner.arch }}-${{ steps.rust.outputs.toolchain }}-${{ hashFiles('Cargo.lock', 'crates/selkies-suites/**') }}
          # A changed suite rebuilds the suites' crate alone, on the crates the
          # last build of this image and toolchain left.
          restore-keys: |
            suites-${{ steps.rust.outputs.image }}-${{ runner.arch }}-${{ steps.rust.outputs.toolchain }}-
      - name: Build the Rust suites
        run: |
          scripts/ci/retry.sh 5 60 rustup toolchain install "${{ steps.rust.outputs.toolchain }}" --profile minimal
          rustup default "${{ steps.rust.outputs.toolchain }}"
          scripts/ci/retry.sh 5 60 cargo test --locked --package selkies-suites --no-run
          # And the driver, which runs every tier's cases
          scripts/ci/retry.sh 5 60 cargo build --locked --package xtask
          # Built now, so no Playwright suite pays for cargo's look at it either
          echo "SELKIES_SUITES_HOST=${PWD}/target/debug/suites-host" >> "$GITHUB_ENV"
      # The same stack a development sandbox starts, on the display the
      # workflow names. VirtualCamera publishes a PipeWire node as well as
      # listening on its socket, so the webcam suite needs a reachable daemon.
      - name: Start the display server and audio
        run: |
          scripts/ci/test-stack.sh
          if ! pw-cli info 0 > /dev/null 2>&1; then
            dbus-run-session -- /usr/bin/pipewire > /tmp/selkies-pipewire.log 2>&1 &
            until pw-cli info 0 > /dev/null 2>&1; do sleep 0.5; done
            # AUTOCONNECT resolves the virtual camera's named target through
            # the session manager; a bare core publishes but cannot link it.
            dbus-run-session -- /usr/bin/wireplumber > /tmp/selkies-wireplumber.log 2>&1 &
          fi
      # The integration tier drives Chromium as well, for the gamepad and
      # WebRTC-transport suites; only the browser matrix needs the other engines
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      # Release Chrome alongside it: its media stack differs from Chromium's,
      # and E2E_CHROME is what points the suites at a system browser. From
      # Google's apt repository, its key checked against the fingerprint Google
      # publishes. The entry a preinstalled Chrome added names the key its
      # package carries, which apt refuses beside one naming another; the
      # defaults file keeps the package from writing it back.
      - name: Install Google Chrome
        run: |
          addons/base/fetch-verified key "https://dl.google.com/linux/linux_signing_key.pub" \
              EB4C1BFD4F042F6DDDCCEC917721F63BD38B4796 /tmp/google-chrome.asc
          sudo install -Dm644 /tmp/google-chrome.asc /etc/apt/keyrings/google-chrome.asc
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          printf 'Types: deb\nURIs: https://dl.google.com/linux/chrome/deb/\nSuites: stable\nComponents: main\nSigned-By: /etc/apt/keyrings/google-chrome.asc\n' \
              | sudo tee /etc/apt/sources.list.d/google-linux.sources > /dev/null
          printf 'repo_add_once="false"\nrepo_reenable_on_distupgrade="false"\n' | sudo tee /etc/default/google-chrome > /dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y google-chrome-stable
      - name: Install WebKit
        if: contains(inputs.tiers || 'integration or e2e', 'e2e')
        working-directory: tests
        run: npx playwright install --with-deps webkit
      # Release Firefox, which the suites drive over WebDriver BiDi as they do
      # locally: Playwright's own Firefox build holds a large WebSocket send in
      # its automation layer when the cores are busy, and a camera on the JPEG
      # rung stops. From Mozilla's apt repository, its key checked against the
      # fingerprint Mozilla publishes, pinned above Ubuntu's snap package.
      - name: Install Firefox
        if: contains(inputs.tiers || 'integration or e2e', 'e2e')
        run: |
          addons/base/fetch-verified key "https://packages.mozilla.org/apt/repo-signing-key.gpg" \
              35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3 /tmp/packages.mozilla.org.asc
          sudo install -Dm644 /tmp/packages.mozilla.org.asc /etc/apt/keyrings/packages.mozilla.org.asc
          printf 'Types: deb\nURIs: https://packages.mozilla.org/apt\nSuites: mozilla\nComponents: main\nSigned-By: /etc/apt/keyrings/packages.mozilla.org.asc\n' \
              | sudo tee /etc/apt/sources.list.d/mozilla.sources > /dev/null
          printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' \
              | sudo tee /etc/apt/preferences.d/mozilla > /dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y --allow-downgrades firefox
          "$E2E_FIREFOX" --version
      # WebKit paints every <video> through its GL sink, which needs GStreamer's
      # opengl plugin; without it a silent software fallback is what the suites
      # would measure, so the plugin is named and checked here rather than left
      # to Playwright's dependency list (the harness refuses WebKit without it).
      - name: Install the GStreamer plugin WebKit's video sink needs
        if: contains(inputs.tiers || 'integration or e2e', 'e2e')
        run: |
          sudo apt-get install --no-install-recommends -y gstreamer1.0-gl gstreamer1.0-tools
          gst-inspect-1.0 opengl > /dev/null
      # A page that stops answering gets every WebKit thread's stack printed
      # (tests/lib/stall.ts), and a stalled Wayland session the server's
      # (wayland_layout_churn.spec.ts), which takes gdb, run as root to attach
      # under Yama.
      - name: Install gdb for the stall reports
        if: contains(inputs.tiers || 'integration or e2e', 'e2e')
        run: sudo apt-get install --no-install-recommends -y gdb
      # Firefox negotiates H.264 only with the OpenH264 GMP, which a fresh
      # profile never carries; without this the whole firefox-wr block skips.
      - name: Install the OpenH264 plugin for Firefox
        if: contains(inputs.tiers || 'integration or e2e', 'e2e')
        run: sh tests/tools/fetch-openh264.sh
      # The driver deals this shard its share of the cases by budget, fails the
      # run on a suite that skips as a whole, and lists the checks a suite
      # recorded as unobserved; a shard a narrow selection leaves nothing passes.
      - name: Run the suites
        env:
          TIERS: ${{ inputs.tiers || 'integration or e2e' }}
          SUITES: ${{ inputs.suites || '' }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          args=(--tier "${TIERS}" --shard "${SHARD}" --junit suites-report.xml)
          if [ -n "${SUITES}" ]; then args+=(--match "${SUITES}"); fi
          cargo xtask suites "${args[@]}"
      - name: Collect the server logs
        if: always()
        run: |
          # The last suite's logs, and the copy the runner kept of every suite's
          mkdir -p suite-logs
          cp -r /tmp/selkies-tests/*.log suite-logs/ 2>/dev/null || true
          cp -r /tmp/selkies-tests/suite-logs/. suite-logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # A second call in the same run (ci.yaml's smoke) keeps logs of its own
          name: suite-logs-${{ inputs.suites && 'selected-' || '' }}${{ matrix.shard }}
          path: suite-logs/
          if-no-files-found: ignore
          retention-days: 7
