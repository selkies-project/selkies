name: CodeQL

# Advanced setup rather than the repository's default setup, which builds C and
# C++ with `autobuild` and finds no build system at the root: the interposers
# and the test tools each carry their own makefile. Every language here is
# extracted without a build, so nothing is compiled and nothing is installed.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        id: codeql-first
        # The CodeQL bundle comes from GitHub's release downloads, which answer 5xx for
        # minutes at a time: a failed download is tried again after a wait, twice.
        continue-on-error: true
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Wait out a download outage
        if: steps.codeql-first.outcome == 'failure'
        run: sleep 120
      - name: Initialize CodeQL, again
        id: codeql-again
        if: steps.codeql-first.outcome == 'failure'
        continue-on-error: true
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Wait out a longer download outage
        if: steps.codeql-again.outcome == 'failure'
        run: sleep 300
      - name: Initialize CodeQL, a third time
        if: steps.codeql-again.outcome == 'failure'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
