name: Capture stack wheels

# Puts pixelflux and pcmflux into this run's artifacts, so container images,
# native packages, AppImages, and the suites ride wheels this run holds rather
# than an index. `pinned` says which build: the main branch (HEAD) of
# selkies-project/pixelflux and selkies-project/pcmflux, which is what the
# builds ahead of a release carry, or the versions this repository pins, which
# is what a release ships. Both projects attach the wheels their own CI built to
# every release they cut, per commit and per version alike, so naming one
# fetches exactly what shipped. A main HEAD whose pre-release its project's CI
# is still building is waited for, which takes less than building it again
# here; a build here is only for what no release covers nor will. That build is
# the project's own wheel workflow, called at the commit pinned below (moved by
# hand when that workflow changes): the native libraries built once per platform
# into an image the Actions cache keeps, the interpreters dealt into parallel
# jobs, as each project's pre-release builds them.

on:
  workflow_dispatch:
    inputs:
      pinned:
        description: Take the versions this repository pins, from each project's release, rather than their main HEAD
        type: boolean
        default: false
  workflow_call:
    inputs:
      pinned:
        description: Take the versions this repository pins, from each project's release, rather than their main HEAD
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  locate:
    name: Capture stack (locate)
    runs-on: ubuntu-latest
    # Covers the wait for a pre-release in the making
    timeout-minutes: 90
    outputs:
      fetch: ${{ steps.probe.outputs.fetch }}
      pixelflux: ${{ steps.probe.outputs.pixelflux }}
      pcmflux: ${{ steps.probe.outputs.pcmflux }}
      pixelflux_ref: ${{ steps.probe.outputs.pixelflux_ref }}
      pcmflux_ref: ${{ steps.probe.outputs.pcmflux_ref }}
      pixelflux_version: ${{ steps.probe.outputs.pixelflux_version }}
      pcmflux_version: ${{ steps.probe.outputs.pcmflux_version }}
    steps:
      # The pins a pinned run reads live in this repository's pyproject.toml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PINNED: ${{ inputs.pinned }}
          # How long a pre-release in the making is waited for, and how long
          # after a push its run may take to show up
          WAIT_S: "4500"
          SHOW_UP_S: "600"
          POLL_S: "30"
        run: |
          fetch="[]"
          for project in pixelflux pcmflux; do
            repo="${OWNER}/${project}"
            tag=""
            version=""
            if [ "${PINNED}" = "true" ]; then
              want="$(sed -n "s/^ *\"${project}[~=<>!]*\([0-9][^\"]*\)\".*/\1/p" pyproject.toml)"
              if [ -z "${want}" ]; then
                echo "::error::pyproject.toml pins no ${project} version"
                exit 1
              fi
              # Built, where it has to be, as its release is: the tag's commit
              # with the crate versioned as the tag
              ref=""
              version="${want}"
              # The release that version was cut as, taken only when it carries
              # wheels of that version rather than of whatever the tag moved to
              assets="$(gh release view "${want}" --repo "${repo}" --json assets \
                        --jq '.assets[].name' 2>/dev/null || true)"
              case "${assets}" in *"${project}-${want}-"*) tag="${want}" ;; esac
            else
              # The commit itself, so a push while this runs changes nothing
              sha="$(gh api "repos/${repo}/commits/main" --jq .sha 2>/dev/null || true)"
              ref="${sha:-main}"
              deadline=$((SECONDS + WAIT_S))
              while [ -n "${sha}" ]; do
                # Pre-releases are tagged with an abbreviated SHA, so match by prefix
                tags="$(gh release list --repo "${repo}" --limit 30 --json tagName \
                        --jq '.[].tagName' 2>/dev/null || true)"
                for candidate in ${tags}; do
                  case "${sha}" in "${candidate}"*) tag="${candidate}"; break ;; esac
                done
                [ -n "${tag}" ] && break
                # Waited for while its project's pre-release run is in flight,
                # or the commit is too fresh for that run to have shown up
                runs="$(gh run list --repo "${repo}" --workflow pre-release.yml --commit "${sha}" \
                        --json status --jq '[.[].status] | join(" ")' 2>/dev/null || true)"
                pushed="$(gh api "repos/${repo}/commits/${sha}" --jq .commit.committer.date 2>/dev/null || true)"
                pushed_s="$(date -d "${pushed:-@0}" +%s 2>/dev/null || echo 0)"
                age=$(( $(date +%s) - pushed_s ))
                case " ${runs} " in
                  *" queued "*|*" in_progress "*|*" waiting "*|*" pending "*|*" requested "*) ;;
                  *) [ -z "${runs}" ] && [ "${age}" -lt "${SHOW_UP_S}" ] || break ;;
                esac
                if [ "${SECONDS}" -ge "${deadline}" ]; then
                  echo "${project}: its pre-release of ${sha} is still building; building it here"
                  break
                fi
                echo "${project}: waiting for the pre-release of ${sha} (runs: ${runs:-none yet})"
                sleep "${POLL_S}"
              done
            fi
            echo "${project}_ref=${ref}" >> "$GITHUB_OUTPUT"
            echo "${project}_version=${version}" >> "$GITHUB_OUTPUT"
            echo "${project}=${tag}" >> "$GITHUB_OUTPUT"
            if [ -n "${tag}" ]; then
              echo "${project}: release ${tag}"
              fetch="$(jq -c --arg p "${project}" --arg t "${tag}" \
                '. + [["manylinux", "musllinux"][] as $l | ["x86_64", "aarch64"][] as $a
                      | {project: $p, tag: $t, platform: $l, arch: $a}]' <<< "${fetch}")"
            else
              echo "${project}: nothing released for ${ref:-${version}}; building it"
            fi
          done
          echo "fetch=${fetch}" >> "$GITHUB_OUTPUT"

  fetch:
    name: ${{ matrix.project }} ${{ matrix.tag }} (${{ matrix.arch }}, ${{ matrix.platform }})
    needs: [locate]
    if: ${{ needs.locate.outputs.fetch != '[]' && needs.locate.outputs.fetch != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One job per platform of each released project, its artifact named as
      # the build's are, `<project>-wheels-` and then the platform last
      matrix:
        include: ${{ fromJSON(needs.locate.outputs.fetch) }}
    steps:
      - name: Download the ${{ matrix.platform }}_${{ matrix.arch }} wheels
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ matrix.project }}
          TAG: ${{ matrix.tag }}
          SLICE: "*${{ matrix.platform }}*${{ matrix.arch }}*.whl"
        run: |
          gh release download "${TAG}" \
            --repo "${{ github.repository_owner }}/${PROJECT}" \
            --pattern "${SLICE}" --dir wheelhouse
          ls -la wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.project }}-wheels-${{ matrix.platform }}_${{ matrix.arch }}
          path: wheelhouse/*.whl
          # An empty one is what the callers cannot recover from, so it fails
          # here rather than in the middle of an image build
          if-no-files-found: error
          retention-days: 14
          # A wheel is a deflated zip already
          compression-level: 0

  # Only what no release covers, and everything when the probe could not
  # answer, since what ships has to be the capture stack that was asked for.
  # A pinned run is the exception: without the probe there is no version to
  # build, and building main would ship a different one.
  pixelflux:
    name: pixelflux
    needs: [locate]
    if: >-
      ${{ always() && (needs.locate.result == 'success' && needs.locate.outputs.pixelflux == ''
                       || needs.locate.result != 'success' && !inputs.pinned) }}
    permissions:
      contents: read
      # Its plan lists the images this repository's Actions cache holds
      actions: read
    uses: selkies-project/pixelflux/.github/workflows/wheels.yml@36ddac23dab70c53182fd648784a9739bbf6684b # 36ddac2
    with:
      repository: selkies-project/pixelflux
      # main where the probe could not say which commit
      ref: ${{ needs.locate.outputs.pixelflux_version == '' && (needs.locate.outputs.pixelflux_ref || 'main') || '' }}
      tag: ${{ needs.locate.outputs.pixelflux_version }}
      artifact: pixelflux-wheels

  pcmflux:
    name: pcmflux
    needs: [locate]
    if: >-
      ${{ always() && (needs.locate.result == 'success' && needs.locate.outputs.pcmflux == ''
                       || needs.locate.result != 'success' && !inputs.pinned) }}
    permissions:
      contents: read
      actions: read
    uses: selkies-project/pcmflux/.github/workflows/wheels.yml@6c4759bef0081accfaa44aeb856d3600b1b546de # 6c4759b
    with:
      repository: selkies-project/pcmflux
      # main where the probe could not say which commit
      ref: ${{ needs.locate.outputs.pcmflux_version == '' && (needs.locate.outputs.pcmflux_ref || 'main') || '' }}
      tag: ${{ needs.locate.outputs.pcmflux_version }}
      artifact: pcmflux-wheels
