name: pixelflux and pcmflux wheels

# Build pixelflux and pcmflux from this checkout, so their Python modules and
# the server's direct Rust linkage always come from the same native sources.
# Each platform's native libraries are built once into an image handed to the
# interpreter jobs as an artifact of this run. Artifact names are consumed by
# tests.yaml and the release workflows.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      package_version:
        description: Version to stamp into both native crates (a release's, or 0.0.0.dev0 for a build of main, as the server's wheel takes); empty builds the checkout unchanged
        type: string
        default: ''
      checkout_repository:
        description: Repository to build; empty builds the caller repository
        type: string
        default: ''
      checkout_ref:
        description: Exact commit to build; empty builds the caller commit
        type: string
        default: ''
    outputs:
      checkout_commit:
        description: Exact commit checked out by every wheel build job
        value: ${{ jobs.plan.outputs.checkout_commit }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
      images: ${{ steps.plan.outputs.images }}
      checkout_commit: ${{ steps.identity.outputs.checkout_commit }}
    steps:
      - name: Validate the requested source
        env:
          CHECKOUT_REPOSITORY: ${{ inputs.checkout_repository || github.repository }}
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: |
          set -euo pipefail
          case "${CHECKOUT_REPOSITORY}" in
            "${GITHUB_REPOSITORY}"|selkies-project/pixelflux|selkies-project/pcmflux) ;;
            *) echo "::error::unsupported wheel checkout repository"; exit 1 ;;
          esac
          if [ -n "${CHECKOUT_REF}" ] && ! [[ "${CHECKOUT_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::wheel checkout ref must be an exact commit"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Record the source commit
        id: identity
        run: echo "checkout_commit=$(git rev-parse 'HEAD^{commit}')" >> "${GITHUB_OUTPUT}"
      - name: Plan the images and the wheels
        id: plan
        run: |
          set -e
          version="$(sed -n 's|.*uses: pypa/cibuildwheel@[0-9a-f]* # v\([0-9.]*\)$|\1|p' \
                     .github/workflows/build-pixelflux-pcmflux-wheels.yaml | head -n 1)"
          if [ -z "${version}" ]; then
            echo "::error::this workflow pins no cibuildwheel release"
            exit 1
          fi
          python3 -m venv "${RUNNER_TEMP}/cibuildwheel"
          "${RUNNER_TEMP}/cibuildwheel/bin/pip" install "cibuildwheel==${version}"
          groups="[]"
          images="[]"
          for project in pixelflux pcmflux; do
            case "${project}" in
              pixelflux) image=pixelflux-wheel-deps; jobs="manylinux=2 musllinux=4" ;;
              pcmflux) image=pcmflux-wheel-deps; jobs="manylinux=1 musllinux=1" ;;
            esac
            plan="$(cd "crates/${project}" && "${RUNNER_TEMP}/cibuildwheel/bin/python" \
                    scripts/wheel-plan.py matrix "${image}" "${jobs}")"
            echo "${plan}"
            recipe="$(cd "crates/${project}" && "${RUNNER_TEMP}/cibuildwheel/bin/python" \
                      scripts/wheel-plan.py recipe)"
            stamp() {
              jq -c --arg project "${project}" --arg image "${image}" \
                '[.[] | . + {project: $project, image: $image}]'
            }
            groups="$(jq -c -n --argjson a "${groups}" \
                      --argjson b "$(sed -n 's/^groups=//p' <<< "${plan}" | stamp)" '$a + $b')"
            images="$(jq -c -n --argjson a "${images}" \
                      --argjson b "$(sed -n 's/^images=//p' <<< "${plan}" | stamp)" \
                      --arg recipe "${recipe}" '$a + [$b[] | . + {recipe: $recipe}]')"
          done
          echo "groups=${groups}" >> "$GITHUB_OUTPUT"
          echo "images=${images}" >> "$GITHUB_OUTPUT"

  image:
    name: ${{ matrix.image.project }} image (${{ matrix.image.platform }})
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    runs-on: ${{ matrix.image.runner }}
    steps:
      # The recipe reads files of its crate, such as pixelflux's x264 patches
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ needs.plan.outputs.checkout_commit }}
          persist-credentials: false
      - name: Verify the source commit
        run: test "$(git rev-parse HEAD)" = '${{ needs.plan.outputs.checkout_commit }}'
      - name: Build the image
        env:
          BASE: ${{ matrix.image.base }}
          IMAGE: ${{ matrix.image.image }}
          PLATFORM: ${{ matrix.image.platform }}
          PROJECT: ${{ matrix.image.project }}
          RECIPE: ${{ matrix.image.recipe }}
        run: |
          printf '%s\n' "${RECIPE}" > "${RUNNER_TEMP}/recipe.sh"
          scripts/ci/retry.sh 5 60 docker pull "${BASE}"
          # The sources and build trees the recipe leaves are no part of the image
          docker run --name deps --env PIXELFLUX_ENABLE_GPL --workdir /tmp \
            --volume "${RUNNER_TEMP}/recipe.sh:/recipe.sh:ro" \
            --volume "${PWD}/crates/${PROJECT}:/package:ro" "${BASE}" \
            bash -c 'bash /recipe.sh && rm -rf /tmp/* /root/.cache && { ! command -v dnf || dnf clean all; }'
          docker commit deps "${IMAGE}:${PLATFORM}"
          docker save "${IMAGE}:${PLATFORM}" | zstd -T0 > "${RUNNER_TEMP}/image.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.image.project }}-deps-${{ matrix.image.platform }}
          path: ${{ runner.temp }}/image.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build:
    name: ${{ matrix.group.project }} ${{ matrix.group.name }}
    needs: [plan, image]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.image.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    runs-on: ${{ matrix.group.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ needs.plan.outputs.checkout_commit }}
          persist-credentials: false
      - name: Verify the source commit
        run: test "$(git rev-parse HEAD)" = '${{ needs.plan.outputs.checkout_commit }}'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.group.project }}-deps-${{ matrix.group.platform }}
          path: ${{ runner.temp }}
      - name: Load the image
        env:
          IMAGE: ${{ matrix.group.image }}
          PLATFORM: ${{ matrix.group.platform }}
        run: |
          zstd -dc "${RUNNER_TEMP}/image.tar.zst" | docker load
          # The loaded image has run before-all already
          {
            echo "CIBW_BEFORE_ALL="
            for name in MANYLINUX_X86_64 MANYLINUX_AARCH64 MUSLLINUX_X86_64 MUSLLINUX_AARCH64; do
              echo "CIBW_${name}_IMAGE=${IMAGE}:${PLATFORM}"
            done
          } >> "$GITHUB_ENV"
      - name: Version the native crates
        if: inputs.package_version != ''
        env:
          RELEASE_TAG: ${{ inputs.package_version }}
          PROJECT: ${{ matrix.group.project }}
        run: |
          set -e
          crate="$(echo "${RELEASE_TAG}" | sed -E 's/rc([0-9]+)$/-rc.\1/; s/a([0-9]+)$/-alpha.\1/; s/b([0-9]+)$/-beta.\1/; s/\.post([0-9]+)$/-post.\1/; s/\.dev([0-9]+)$/-dev.\1/')"
          sed -i "1,/^version = /s|^version = .*|version = \"${crate}\"|" "crates/${PROJECT}/Cargo.toml"
          sed -i "/^name = \"${PROJECT}\"$/{n;s|^version = .*|version = \"${crate}\"|}" "crates/${PROJECT}/Cargo.lock"
          sed -i "/^name = \"${PROJECT}\"$/{n;s|^version = .*|version = \"${crate}\"|}" Cargo.lock
          grep -q "^version = \"${crate}\"$" "crates/${PROJECT}/Cargo.toml"
          grep -A1 "^name = \"${PROJECT}\"$" "crates/${PROJECT}/Cargo.lock" | grep -q "^version = \"${crate}\"$"
          grep -A1 "^name = \"${PROJECT}\"$" Cargo.lock | grep -q "^version = \"${crate}\"$"
      - name: Build the wheels
        id: wheels-first
        # cibuildwheel downloads virtualenv for its audit without a retry, so a
        # GitHub 5xx there fails a build that succeeded; the step after runs it again.
        continue-on-error: true
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: crates/${{ matrix.group.project }}
          # The action's output-dir is relative to the checkout, not to package-dir
          output-dir: crates/${{ matrix.group.project }}/wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.group.build }}
      - name: Wait out a download outage
        if: steps.wheels-first.outcome == 'failure'
        run: sleep 120
      - name: Build the wheels, again
        if: steps.wheels-first.outcome == 'failure'
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: crates/${{ matrix.group.project }}
          output-dir: crates/${{ matrix.group.project }}/wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.group.build }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.group.project }}-wheels-${{ matrix.group.name }}
          path: crates/${{ matrix.group.project }}/wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
