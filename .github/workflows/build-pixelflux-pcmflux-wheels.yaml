name: Build pixelflux and pcmflux wheels

# Builds pixelflux and pcmflux from the master branch (HEAD) of
# linuxserver/pixelflux and linuxserver/pcmflux, so that container images,
# native packages, and AppImages ride the latest code instead of the last
# PyPI release. Mirrors the two projects' own release workflows: a single
# pypa/cibuildwheel invocation per (arch, libc), with each repository's own
# pyproject.toml [tool.cibuildwheel] section driving the cp39-cp314 build
# matrix and the native dependency setup.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.project }} (${{ matrix.arch.name }}, ${{ matrix.arch.platform }})
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        project: [pixelflux, pcmflux]
        arch:
          - name: x86_64
            runner: ubuntu-latest
            platform: manylinux
            build: >-
              cp39-manylinux_x86_64
              cp310-manylinux_x86_64
              cp311-manylinux_x86_64
              cp312-manylinux_x86_64
              cp313-manylinux_x86_64
              cp314-manylinux_x86_64
          - name: x86_64
            runner: ubuntu-latest
            platform: musllinux
            build: >-
              cp39-musllinux_x86_64
              cp310-musllinux_x86_64
              cp311-musllinux_x86_64
              cp312-musllinux_x86_64
              cp313-musllinux_x86_64
              cp314-musllinux_x86_64
          - name: aarch64
            runner: ubuntu-24.04-arm
            platform: manylinux
            build: >-
              cp39-manylinux_aarch64
              cp310-manylinux_aarch64
              cp311-manylinux_aarch64
              cp312-manylinux_aarch64
              cp313-manylinux_aarch64
              cp314-manylinux_aarch64
          - name: aarch64
            runner: ubuntu-24.04-arm
            platform: musllinux
            build: >-
              cp39-musllinux_aarch64
              cp310-musllinux_aarch64
              cp311-musllinux_aarch64
              cp312-musllinux_aarch64
              cp313-musllinux_aarch64
              cp314-musllinux_aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          repository: linuxserver/${{ matrix.project }}
          ref: master
      - name: Build wheels (${{ matrix.arch.build }})
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.arch.build }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}-wheels-${{ matrix.arch.name }}-${{ matrix.arch.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
