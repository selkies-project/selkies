name: Build pixelflux and pcmflux wheels

# Builds pixelflux and pcmflux from the main branch (HEAD) of
# selkies-project/pixelflux and selkies-project/pcmflux, so that container images,
# native packages, and AppImages ride the latest code instead of the last
# PyPI release. Mirrors the two projects' own release workflows: a single
# pypa/cibuildwheel invocation per (arch, libc), with each repository's own
# pyproject.toml [tool.cibuildwheel] section driving the cp39-cp314 build
# matrix and the native dependency setup.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.project }} ${{ matrix.python }} (${{ matrix.arch.name }}, ${{ matrix.arch.platform }})
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      # One job per interpreter rather than one per (arch, libc) building the
      # whole cp39-cp314 ladder in sequence: the ladder is what set the wall
      # clock, and the interpreters share nothing but the container image.
      matrix:
        project: [pixelflux, pcmflux]
        python: [cp39, cp310, cp311, cp312, cp313, cp314]
        arch:
          - name: x86_64
            runner: ubuntu-latest
            platform: manylinux
          - name: x86_64
            runner: ubuntu-latest
            platform: musllinux
          - name: aarch64
            runner: ubuntu-24.04-arm
            platform: manylinux
          - name: aarch64
            runner: ubuntu-24.04-arm
            platform: musllinux
    steps:
      - uses: actions/checkout@v7
        with:
          repository: selkies-project/${{ matrix.project }}
          ref: main
      - name: Build the wheel (${{ matrix.python }}-${{ matrix.arch.platform }}_${{ matrix.arch.name }})
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.arch.platform }}_${{ matrix.arch.name }}
      - uses: actions/upload-artifact@v7
        with:
          # Every consumer takes these by pattern (`<project>-wheels-*`, or the
          # x86_64 manylinux set the wheel smoke test installs), so the
          # interpreter belongs at the end of the name.
          name: ${{ matrix.project }}-wheels-${{ matrix.arch.name }}-${{ matrix.arch.platform }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
          # A wheel is a deflated zip already, so the archive this is wrapped in
          # cannot compress it further: levelling off spends no CPU re-deflating
          # it for a size that does not move.
          compression-level: 0
