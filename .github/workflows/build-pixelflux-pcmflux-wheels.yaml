name: Build pixelflux and pcmflux wheels

# Builds pixelflux and pcmflux from the main branch (HEAD) of
# selkies-project/pixelflux and selkies-project/pcmflux, so that container images,
# native packages, and AppImages ride the latest code instead of the last
# PyPI release. Mirrors the two projects' own release workflows: a single
# pypa/cibuildwheel invocation per (arch, libc), with each repository's own
# pyproject.toml [tool.cibuildwheel] section driving the native dependency
# setup and its python_requires the interpreters built.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.project }} (${{ matrix.target.arch }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      # One job per (project, arch, libc): an extra interpreter rebuilds only
      # the PyO3 layer and the extension, so splitting them would duplicate
      # before-all for far less than it costs.
      matrix:
        project: [pixelflux, pcmflux]
        platform: [manylinux, musllinux]
        target:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          repository: selkies-project/${{ matrix.project }}
          ref: main
      - name: Build wheels (${{ matrix.platform }}_${{ matrix.target.arch }})
        uses: pypa/cibuildwheel@v4.2.0
        env:
          # Every interpreter cibuildwheel offers, floored by python_requires.
          CIBW_BUILD: "*-${{ matrix.platform }}_${{ matrix.target.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}-wheels-${{ matrix.target.arch }}-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
          # A wheel is a deflated zip already, so the archive this is wrapped in
          # cannot compress it further: levelling off spends no CPU re-deflating
          # it for a size that does not move.
          compression-level: 0
