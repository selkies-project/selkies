name: Capture stack wheels

# Puts pixelflux and pcmflux into this run's artifacts, so container images,
# native packages, AppImages and the suites ride wheels this run holds rather
# than an index. `pinned` says which build: the main branch (HEAD) of
# selkies-project/pixelflux and selkies-project/pcmflux, which is what the
# builds ahead of a release carry, or the versions this repository pins, which
# is what a release ships. Both projects attach the wheels their own CI built to
# every release they cut, per commit and per version alike, so naming one
# fetches exactly what shipped and a build here is only needed where no release
# covers what was asked for. That build mirrors the two projects' own release
# workflows: a single pypa/cibuildwheel invocation per (arch, libc), with each
# repository's own pyproject.toml [tool.cibuildwheel] section driving the native
# dependency setup and its python_requires the interpreters built.

on:
  workflow_dispatch:
    inputs:
      pinned:
        description: Take the versions this repository pins, from each project's release, rather than their main HEAD
        type: boolean
        default: false
  workflow_call:
    inputs:
      pinned:
        description: Take the versions this repository pins, from each project's release, rather than their main HEAD
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  locate:
    name: Capture stack (locate)
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.probe.outputs.build }}
      pixelflux: ${{ steps.probe.outputs.pixelflux }}
      pcmflux: ${{ steps.probe.outputs.pcmflux }}
      pixelflux_ref: ${{ steps.probe.outputs.pixelflux_ref }}
      pcmflux_ref: ${{ steps.probe.outputs.pcmflux_ref }}
    steps:
      # The pins a pinned run reads live in this repository's pyproject.toml
      - uses: actions/checkout@v7
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ inputs.pinned }}
        run: |
          build=false
          for project in pixelflux pcmflux; do
            repo="${{ github.repository_owner }}/${project}"
            tag=""
            if [ "${PINNED}" = "true" ]; then
              want="$(sed -n "s/^ *\"${project}[~=<>!]*\([0-9][^\"]*\)\".*/\1/p" pyproject.toml)"
              if [ -z "${want}" ]; then
                echo "::error::pyproject.toml pins no ${project} version"
                exit 1
              fi
              ref="refs/tags/${want}"
              # The release that version was cut as, taken only when it carries
              # wheels of that version rather than of whatever the tag moved to
              assets="$(gh release view "${want}" --repo "${repo}" --json assets \
                        --jq '.assets[].name' 2>/dev/null || true)"
              case "${assets}" in *"${project}-${want}-"*) tag="${want}" ;; esac
            else
              ref=main
              sha="$(gh api "repos/${repo}/commits/main" --jq .sha 2>/dev/null || true)"
              # Pre-releases are tagged with an abbreviated SHA, so match by prefix
              tags="$(gh release list --repo "${repo}" --limit 30 --json tagName \
                      --jq '.[].tagName' 2>/dev/null || true)"
              for candidate in ${tags}; do
                case "${sha:-none}" in "${candidate}"*) tag="${candidate}"; break ;; esac
              done
            fi
            echo "${project}_ref=${ref}" >> "$GITHUB_OUTPUT"
            if [ -n "${tag}" ]; then
              echo "${project}=${tag}" >> "$GITHUB_OUTPUT"
              echo "${project}: release ${tag}"
            else
              echo "${project}=" >> "$GITHUB_OUTPUT"
              echo "${project}: nothing released for ${ref}; building it"
              build=true
            fi
          done
          echo "build=${build}" >> "$GITHUB_OUTPUT"

  fetch:
    name: ${{ matrix.project }} ${{ needs.locate.outputs[matrix.project] }} (${{ matrix.target.arch }}, ${{ matrix.platform }})
    needs: [locate]
    if: ${{ needs.locate.outputs.build == 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One job per artifact the build below would have produced, carrying the
      # same wheels under the same name, so nothing downstream can tell which
      # of the two put them there.
      matrix:
        project: [pixelflux, pcmflux]
        platform: [manylinux, musllinux]
        target:
          - arch: x86_64
          - arch: aarch64
    steps:
      - name: Download the ${{ matrix.platform }}_${{ matrix.target.arch }} wheels
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ matrix.project }}
          TAG: ${{ needs.locate.outputs[matrix.project] }}
          SLICE: "*${{ matrix.platform }}*${{ matrix.target.arch }}*.whl"
        run: |
          gh release download "${TAG}" \
            --repo "${{ github.repository_owner }}/${PROJECT}" \
            --pattern "${SLICE}" --dir wheelhouse
          ls -la wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}-wheels-${{ matrix.target.arch }}-${{ matrix.platform }}
          path: wheelhouse/*.whl
          # An empty one is what the callers cannot recover from, so it fails
          # here rather than in the middle of an image build
          if-no-files-found: error
          retention-days: 14
          # A wheel is a deflated zip already
          compression-level: 0

  build:
    name: ${{ matrix.project }} (${{ matrix.target.arch }}, ${{ matrix.platform }})
    needs: [locate]
    # Only what no release covers, and everything when the probe could not
    # answer, since what ships has to be the capture stack that was asked for.
    # A pinned run is the exception: without the probe there is no version to
    # build, and building main would ship a different one.
    if: >-
      ${{ always() && needs.locate.outputs.build != 'false'
                   && (needs.locate.result == 'success' || !inputs.pinned) }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      # One job per (project, arch, libc): an extra interpreter rebuilds only
      # the PyO3 layer and the extension, so splitting them would duplicate
      # before-all for far less than it costs.
      matrix:
        project: [pixelflux, pcmflux]
        platform: [manylinux, musllinux]
        target:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.project }}
          ref: ${{ needs.locate.outputs[format('{0}_ref', matrix.project)] || 'main' }}
      - name: Build wheels (${{ matrix.platform }}_${{ matrix.target.arch }})
        uses: pypa/cibuildwheel@v4.2.1
        env:
          # Every interpreter cibuildwheel offers, floored by python_requires.
          CIBW_BUILD: "*-${{ matrix.platform }}_${{ matrix.target.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}-wheels-${{ matrix.target.arch }}-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
          # A wheel is a deflated zip already, so the archive this is wrapped in
          # cannot compress it further: levelling off spends no CPU re-deflating
          # it for a size that does not move.
          compression-level: 0
