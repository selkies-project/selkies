name: CI

# Single orchestrator for pushes to main: lint, build the wheel once, then
# fan out to the image and native-package builds, which consume the wheel
# artifact instead of rebuilding it. Pushes that only touch docs or
# devcontainer files skip CI (their own workflows cover them).

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - website/**
      - .devcontainer/**
      - .github/workflows/docs.yaml
      - .github/workflows/devcontainer-feature.yaml
      - README.md
      - LICENSE
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "26"
  # Linters are pinned to a minor line so a new rule in a released version
  # cannot turn a green branch red without a deliberate bump here
  PRE_COMMIT_VERSION: "4.4.*"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Run the Python pre-commit hooks
        # The same config contributors install locally, so a green commit hook
        # and a green CI lint cannot diverge. Tool revisions live in
        # .pre-commit-config.yaml. The web hook runs in its own job, which is
        # what keeps the slow npm install off this one.
        run: |
          python3 -m pip install "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit run --all-files --show-diff-on-failure ruff-check
          pre-commit run --all-files --show-diff-on-failure codespell
          pre-commit run --all-files --show-diff-on-failure settings-doc
      - name: Install shellcheck
        # actionlint runs shellcheck over every `run:` block, and the same
        # pinned build the shell suite gates on decides what it reports
        run: scripts/ci/install-shellcheck.sh
      - name: Lint the workflow files
        # actionlint validates the expression syntax and shellchecks every
        # `run:` block
        run: |
          scripts/ci/fetch.sh "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  web-lint:
    name: Lint web client
    # Its own job rather than a step of Lint: the npm install is the slow part
    # and there is no reason for it to sit in front of the Python linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # Lockfiles are gitignored here, so the cache is keyed on the manifests
          cache-dependency-path: |
            addons/selkies-dashboard/package.json
            addons/selkies-dashboard-wish/package.json
      - name: ESLint and TypeScript
        # Through pre-commit so the hook definition is the single source of truth
        run: |
          python3 -m pip install "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit run --all-files --show-diff-on-failure web-lint

  python-compat:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile every module
        # pyproject.toml claims 3.9 through 3.14; this catches syntax that only
        # the newer interpreters accept
        run: python -m compileall -q src/selkies

  tests:
    name: Test suites
    # The wheels are a dependency, not just an ordering constraint: the suites
    # run against the same main-HEAD capture stack the artifacts ship
    needs: [python-compat, pixelflux-pcmflux]
    # The wheels are built on pushes only, and a skip carries down the whole
    # chain from wherever it starts, so the suites are allowed to run either way
    # and resolve the capture stack themselves.
    if: >-
      ${{ !cancelled()
          && needs.python-compat.result == 'success'
          && contains(fromJSON('["success", "skipped"]'), needs['pixelflux-pcmflux'].result) }}
    # The browser tier runs nightly from tests.yaml; this keeps the push and
    # pull-request path at the suites that need no browser install
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yaml
    with:
      tiers: unit or integration
      # Read from the job that produces them rather than asserted: on a pull
      # request it did not run, and claiming otherwise is what would leave the
      # suites on the PyPI capture stack with nothing saying so.
      wheels_ready: ${{ needs['pixelflux-pcmflux'].result == 'success' }}

  wheel:
    name: Build wheel
    # Only the smoke test needs the capture stack, so the wheel is built while
    # those wheels still are: it depends on nothing but the interpreters.
    needs: [python-compat]
    permissions:
      contents: read
    uses: ./.github/workflows/build-wheel.yaml

  wheel-smoke:
    name: Smoke test the wheel
    # Installs the built wheel against the capture stack this run produced,
    # rather than the pinned pre-release PyPI does not have. On a pull request
    # that job runs only when no pre-release is there to download, so this
    # waits for a build exactly when one is needed.
    needs: [wheel, pixelflux-pcmflux]
    if: ${{ always() && needs.wheel.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs['pixelflux-pcmflux'].result) }}
    permissions:
      contents: read
    uses: ./.github/workflows/smoke-wheel.yaml
    with:
      wheels_ready: ${{ needs['pixelflux-pcmflux'].result == 'success' }}

  capture-stack:
    name: Capture stack (locate)
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.probe.outputs.build }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=false
          for project in pixelflux pcmflux; do
            sha="$(gh api "repos/${{ github.repository_owner }}/${project}/commits/main" \
                   --jq .sha 2>/dev/null || true)"
            if [ -n "${sha}" ] && gh release view "${sha}" \
                 --repo "${{ github.repository_owner }}/${project}" >/dev/null 2>&1; then
              echo "${project}: pre-release ${sha}"
            else
              echo "${project}: no pre-release for main (${sha:-unknown})"
              build=true
            fi
          done
          echo "build=${build}" >> "$GITHUB_OUTPUT"

  pixelflux-pcmflux:
    name: Build pixelflux and pcmflux wheels (main HEAD)
    needs: [capture-stack]
    # A push builds them because the images and packages ship these artifacts.
    # A pull request builds them only when the sibling has published no
    # pre-release for its current main HEAD, which is the one case where the
    # pinned version exists nowhere else -- and building it here rather than
    # inside each caller keeps it to one build for the wheel and the suites.
    if: ${{ always() && (github.event_name == 'push' || needs.capture-stack.outputs.build == 'true') }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-pixelflux-pcmflux-wheels.yaml

  images:
    name: Multi-arch images
    needs: [wheel, wheel-smoke, pixelflux-pcmflux]
    if: github.event_name == 'push'
    # A called workflow can only narrow the caller's token, so the GHCR push
    # scope has to be granted here
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yaml
    with:
      tag_prefix: main
      wheel_artifact: selkies-wheel

  packages:
    name: Native packages
    needs: [wheel, wheel-smoke, pixelflux-pcmflux]
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yaml
    with:
      wheel_artifact: selkies-wheel
