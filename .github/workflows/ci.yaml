name: CI

# Single orchestrator for pushes to main: lint, build the wheel once for its
# smoke test and the suites, then fan out to the image and native-package
# builds, which build the server from source, and publish what the run built
# as the commit's pre-release. Pushes that only touch docs or devcontainer
# files skip CI (their own workflows cover them).

on:
  # Manual as well as automatic: a push whose run GitHub does not create leaves
  # no other way to get one, and a branch can be put through the same pipeline
  # without opening a pull request.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - website/**
      - .devcontainer/**
      - .github/workflows/docs.yaml
      - .github/workflows/devcontainer-feature.yaml
      - README.md
      - LICENSE
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "26"
  # Linters are pinned to a minor line so a new rule in a released version
  # cannot turn a green branch red without a deliberate bump here
  PRE_COMMIT_VERSION: "4.6.*"
  ACTIONLINT_VERSION: "1.7.12"
  # Its linux_amd64 tarball's line of the release's checksums file
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        id: python-first
        # A download GitHub fails is tried again after a wait, twice.
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Wait out a download outage
        if: steps.python-first.outcome == 'failure'
        run: sleep 120
      - name: Set up Python, again
        id: python-again
        if: steps.python-first.outcome == 'failure'
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Wait out a longer download outage
        if: steps.python-again.outcome == 'failure'
        run: sleep 300
      - name: Set up Python, a third time
        id: python-third
        if: steps.python-again.outcome == 'failure'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Run the Python pre-commit hooks
        # The same config contributors install locally, so a green commit hook
        # and a green CI lint cannot diverge. Tool revisions live in
        # .pre-commit-config.yaml. The web hook runs in its own job, which is
        # what keeps the slow npm install off this one.
        run: |
          scripts/ci/retry.sh 5 60 python3 -m pip install "pre-commit==${PRE_COMMIT_VERSION}"
          # ruff's and codespell's hooks are cloned from GitHub, with retries
          scripts/ci/retry.sh 5 60 pre-commit install-hooks
          pre-commit run --all-files --show-diff-on-failure ruff-check
          pre-commit run --all-files --show-diff-on-failure codespell
          pre-commit run --all-files --show-diff-on-failure settings-doc
          pre-commit run --all-files --show-diff-on-failure file-index
      - name: Install shellcheck
        # actionlint runs shellcheck over every `run:` block, and the same
        # pinned build the shell suite gates on decides what it reports
        run: scripts/ci/install-shellcheck.sh
      - name: Lint the workflow files
        # actionlint validates the expression syntax and shellchecks every
        # `run:` block
        run: |
          scripts/ci/fetch.sh "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint.tar.gz "${ACTIONLINT_SHA256}"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  web-lint:
    name: Lint web client
    # Its own job rather than a step of Lint: the npm install is the slow part
    # and there is no reason for it to sit in front of the Python linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/selkies-dashboard/package-lock.json
      - name: ESLint and TypeScript
        # Through pre-commit so the hook definition is the single source of truth
        run: |
          scripts/ci/retry.sh 5 60 python3 -m pip install "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit run --all-files --show-diff-on-failure web-lint

  rust-lint:
    name: Lint server
    # Its own job rather than a step of Lint, as the web client's is: clippy
    # builds the workspace, which is the slow part
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the server's toolchain and libraries
        run: |
          scripts/ci/server-build-deps.sh
          sudo apt-get install -y --no-install-recommends python3-dev
      - name: rustfmt and clippy
        # Through pre-commit so the hook definitions are the single source of truth
        run: |
          scripts/ci/retry.sh 5 60 python3 -m pip install "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit run --all-files --show-diff-on-failure rustfmt
          pre-commit run --all-files --show-diff-on-failure clippy
          pre-commit run --all-files --show-diff-on-failure clippy-pixelflux-python
          pre-commit run --all-files --show-diff-on-failure clippy-pcmflux-python

  native-tests:
    name: Native capture tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the native toolchain and libraries
        # kvazaar, the non-GPL build's HEVC encoder, is built at the release the
        # wheel recipe pins where the distribution does not carry it
        run: |
          scripts/ci/server-build-deps.sh
          sudo apt-get install -y --no-install-recommends python3-dev
          # The non-GPL tests need the same rate-control ABI as the wheels.
          # Use a carrying distribution package when available; otherwise build
          # the exact release-pinned commit, rather than just its tag.
          candidate="$(apt-cache policy libkvazaar-dev | sed -n 's/^[[:space:]]*Candidate: //p')"
          if dpkg --compare-versions "${candidate:-0}" ge "2.3.2"; then
            sudo apt-get install -y --no-install-recommends libkvazaar-dev
          else
            sudo sh crates/pixelflux/scripts/build-kvazaar.sh /usr/local
          fi
          sudo ldconfig
      - name: Test the Rust and Python bridge configurations
        # GPU, render-node, encoder-device, and sound-server tests remain
        # explicitly ignored on runners without those devices.
        run: |
          cargo test --locked -p pixelflux --lib
          cargo test --locked -p pixelflux --lib --features python
          cargo test --locked -p pcmflux --lib
          cargo test --locked -p pcmflux --lib --features python
      - name: Test the non-GPL pixelflux configuration
        run: cargo test --locked -p pixelflux --lib --no-default-features --features openh264

  python-compat:
    name: Python ${{ matrix.python-version }}
    # GitHub builds no Python 3.9 for Ubuntu 26.04
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        id: python-matrix-first
        # A download GitHub fails is tried again after a wait, twice.
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          # The newest interpreter is taken from its release candidates until
          # its final release
          allow-prereleases: true
      - name: Wait out a download outage
        if: steps.python-matrix-first.outcome == 'failure'
        run: sleep 120
      - name: Set up Python, again
        id: python-matrix-again
        if: steps.python-matrix-first.outcome == 'failure'
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          # The newest interpreter is taken from its release candidates until
          # its final release
          allow-prereleases: true
      - name: Wait out a longer download outage
        if: steps.python-matrix-again.outcome == 'failure'
        run: sleep 300
      - name: Set up Python, a third time
        id: python-matrix-third
        if: steps.python-matrix-again.outcome == 'failure'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          # The newest interpreter is taken from its release candidates until
          # its final release
          allow-prereleases: true
      - name: Byte-compile every module
        # The wheel's one Python module, the Jupyter entry point, on the
        # interpreters a Jupyter server runs on; this catches syntax that only
        # the newer ones accept
        run: python -m compileall -q infra/wheel/selkies

  tests:
    name: Test suites
    # The wheels are a dependency, not just an ordering constraint: the suites
    # run the server this run's wheel carries, and drive the pixelflux and pcmflux it
    # links through that stack's own wheels
    needs: [python-compat, wheel, pixelflux-pcmflux]
    # The browser tier runs nightly from tests.yaml; this keeps the push and
    # pull-request path at the suites that need no browser install
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yaml
    with:
      tiers: unit or integration
      # The jobs above put them in this run's artifacts
      wheels_ready: true

  wheel:
    name: Build wheel
    # Built while the pixelflux and pcmflux wheels still are: it depends on nothing
    # but the interpreters.
    needs: [python-compat]
    permissions:
      contents: read
    uses: ./.github/workflows/build-wheel.yaml

  wheel-smoke:
    name: Smoke test the wheel
    needs: [wheel]
    permissions:
      contents: read
    uses: ./.github/workflows/smoke-wheel.yaml

  pixelflux-pcmflux:
    name: pixelflux and pcmflux wheels
    # Both optional Python bridges build from the crates the server links.
    # Their wheels land in this run's artifacts, where the suites read them,
    # and in main's pre-release, at the development version the server's
    # wheel carries.
    permissions:
      contents: read
    uses: ./.github/workflows/build-pixelflux-pcmflux-wheels.yaml
    with:
      package_version: 0.0.0.dev0

  images:
    name: Multi-arch images
    needs: [wheel, wheel-smoke]
    if: github.repository == 'selkies-project/selkies' && github.event_name == 'push'
    # A called workflow can only narrow the caller's token, so the GHCR push
    # scope has to be granted here
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yaml
    with:
      tag_prefix: main

  packages:
    name: Native packages
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yaml

  pre-release:
    name: Pre-release
    # Every commit to main that passes its suites is published as a pre-release
    # tagged with its short SHA, as pixelflux's and pcmflux's are, carrying the
    # media a release carries: the wheels, the native packages, and the
    # AppImages. A pre-release is never the latest release, so the badge, the
    # `latest` images, and PyPI stay with tagged releases.
    needs: [native-tests, tests, wheel, wheel-smoke, packages]
    if: github.repository == 'selkies-project/selkies' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The files' build provenance, attested through the run's OIDC token
      id-token: write
      attestations: write
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selkies-wheel
          path: pre-release-artifacts/
      - name: Download the native capture wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{pixelflux,pcmflux}-wheels-*"
          path: pre-release-artifacts/
          merge-multiple: true
      - name: Download the native packages and AppImages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{deb,rpm,apk,arch,appimage}-*"
          path: pre-release-artifacts/
          merge-multiple: true
      - name: Collect the pre-release files
        run: |
          set -e
          mkdir -p pre-release
          # The conda package the AppImage is assembled from stays an artifact
          # of the run, as it does for a release
          find pre-release-artifacts -type f -name '*.conda' -delete
          find pre-release-artifacts -type f -exec mv {} pre-release/ \;
          # Every kind of media, so a pattern that matched nothing fails here
          # rather than publishing a pre-release without it
          for want in '*.whl' '*.deb' '*.rpm' '*.apk' '*.pkg.tar.zst' '*.AppImage'; do
            # shellcheck disable=SC2086  # want is the media glob expanded above
            ls pre-release/$want > /dev/null 2>&1 || { echo "::error::no ${want} in the run's artifacts"; exit 1; }
          done
          (cd pre-release && sha256sum -- * > SHA256SUMS)
          ls -la pre-release/
      - name: Attest the pre-release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pre-release/*
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Create the pre-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.sha.outputs.short }}
          name: ${{ steps.sha.outputs.short }}
          # A new tag at this commit rather than at the branch's head by the
          # time the media have built
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          make_latest: false
          files: pre-release/*
