name: CI

# Single orchestrator for pushes to main: lint, build the wheel once, then
# fan out to the image and native-package builds, which consume the wheel
# artifact instead of rebuilding it. Pushes that only touch docs or
# devcontainer files skip CI (their own workflows cover them).

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - .devcontainer/**
      - .github/workflows/docs.yaml
      - .github/workflows/devcontainer-feature.yaml
      - README.md
      - LICENSE
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check spelling
        uses: codespell-project/actions-codespell@v2
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Ruff
        run: |
          python3 -m pip install --upgrade ruff
          ruff check src/selkies || true
      - name: Validate workflow YAML
        run: |
          python3 -m pip install --upgrade pyyaml
          python3 -c "import glob, yaml; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yaml') + glob.glob('.github/actions/*/action.yaml')]; print('YAML OK')"

  wheel:
    name: Build wheel
    uses: ./.github/workflows/build-wheel.yaml

  pixelflux-pcmflux:
    name: Build pixelflux and pcmflux wheels (master HEAD)
    if: github.event_name == 'push'
    uses: ./.github/workflows/build-pixelflux-pcmflux-wheels.yaml

  images:
    name: Multi-arch images
    needs: [wheel, pixelflux-pcmflux]
    if: github.event_name == 'push'
    uses: ./.github/workflows/images.yaml
    with:
      tag_prefix: main
      wheel_artifact: selkies-wheel

  packages:
    name: Native packages
    needs: [wheel, pixelflux-pcmflux]
    if: github.event_name == 'push'
    uses: ./.github/workflows/packages.yaml
    with:
      wheel_artifact: selkies-wheel
