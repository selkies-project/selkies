name: Images

# Multi-architecture (x86_64 + aarch64) container images, published to ghcr.io.
# Follows the llama.cpp docker build procedure: each architecture builds on a
# native runner (no QEMU), pushes by digest, and a merge job assembles the
# multi-arch manifest.

# Triggered by ci.yaml on pushes to main and by release.yaml for releases;
# can also be run standalone via the Actions tab, in which case it builds
# the wheel itself unless `wheel_artifact` names an existing artifact.

on:
  workflow_dispatch:
    inputs:
      tag_prefix:
        description: Tag prefix for the images
        type: string
        default: main
      floating_tags:
        description: Also move the floating `latest` tags onto this build
        type: boolean
        default: true
      wheel_artifact:
        description: Artifact name of a prebuilt wheel (skips the wheel build when set)
        type: string
        default: ""
  workflow_call:
    inputs:
      tag_prefix:
        description: Tag prefix for the images (e.g. v1.2.3 or latest)
        type: string
        default: main
      floating_tags:
        description: Also move the floating `latest` tags onto this build
        type: boolean
        default: true
      wheel_artifact:
        description: Artifact name of a prebuilt wheel (skips the wheel build when set)
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY_NAMESPACE: ghcr.io/selkies-project/selkies
  IMAGE_NAME: ghcr.io/selkies-project/selkies/example
  # ghcr answers a secondary rate limit with 403 on the push itself. buildx
  # reports that as a build failure rather than a response this can read a
  # Retry-After from, so the pause is the minute GitHub asks for when it names
  # no delay of its own.
  PUSH_RETRY_DELAY: "60"

jobs:
  wheel:
    name: Build wheel for the images
    if: ${{ inputs.wheel_artifact == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-wheel.yaml

  build:
    name: ${{ matrix.flavor.name }} (${{ matrix.arch.name }})
    needs: wheel
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.wheel.result) }}
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - name: ubuntu26.04
            image: ubuntu
            release: "26.04"
          - name: trixie
            image: debian
            release: trixie
        arch:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        # The tool cache is kept: setup-python and setup-node resolve from it
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_packages: azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* mongodb*
          remove_packages_one_command: true
          remove_folders: /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/local/share/vcpkg
      - name: Download the wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.wheel_artifact || 'selkies-wheel' }}
          path: dist/
      # Fresh pixelflux/pcmflux wheels, built from the main HEAD of the
      # selkies-project/* repos by the orchestrating run; absence is tolerated
      # (standalone dispatch) and the Dockerfile falls back to PyPI
      - name: Download pixelflux wheels (main HEAD)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: pixelflux-wheels-*
          path: dist/
          merge-multiple: true
      - name: Download pcmflux wheels (main HEAD)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: pcmflux-wheels-*
          path: dist/
          merge-multiple: true
      - name: Report the capture stack this build carries
        run: |
          for project in pixelflux pcmflux; do
            if ls "dist/${project}"-*.whl > /dev/null 2>&1; then
              echo "${project}: main-HEAD wheel from this run"
            else
              # Not fatal: a standalone dispatch has none to inherit. Said out
              # loud because what ships is then whatever PyPI resolves, which is
              # not the build the suites ran against.
              echo "::warning::No ${project} wheel in dist/; this build resolves it from PyPI instead of the main-HEAD wheel the suites tested"
            fi
          done
      - name: Prepare wheels directory
        run: |
          set -e
          # .gitignore keeps addons/example/wheels/*.whl out of git
          cp dist/*.whl addons/example/wheels/
          ls -la addons/example/wheels/
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: ./.github/actions/build-push
        with:
          context: .
          file: addons/example/Dockerfile
          platforms: ${{ matrix.arch.platform }}
          build-args: |
            DISTRIB_IMAGE=${{ matrix.flavor.image }}
            DISTRIB_RELEASE=${{ matrix.flavor.release }}
          outputs: type=image,"name=${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
          cache-scope: example-${{ matrix.flavor.name }}-${{ matrix.arch.name }}
          retry-delay: ${{ env.PUSH_RETRY_DELAY }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.flavor.name }}-${{ matrix.arch.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifests (${{ matrix.flavor }})
    needs: build
    # Stated rather than left to the default: `wheel` is skipped whenever the
    # caller supplies the artifact, and the images stay untagged if that skip
    # carries down the chain past `build`.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [ubuntu26.04, trixie]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download digests for this flavor
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.flavor }}-*
          path: /tmp/digests
          merge-multiple: true
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          FLOATING_TAGS: ${{ inputs.floating_tags }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -e
          IMGTAGS=("-t" "${IMAGE_NAME}:${TAG_PREFIX}-${FLAVOR}")
          if [ "${TAG_PREFIX}" != "main" ] && [ "${FLOATING_TAGS}" = "true" ]; then
            # Release builds also carry the floating `latest-*` tags, unless
            # the caller holds them back
            IMGTAGS+=("-t" "${IMAGE_NAME}:latest-${FLAVOR}")
          fi
          # One empty file per pushed digest, named after it
          SOURCES=()
          for digest in *; do SOURCES+=("${IMAGE_NAME}@sha256:${digest}"); done
          "${GITHUB_WORKSPACE}/scripts/ci/retry.sh" 3 "${PUSH_RETRY_DELAY}" \
            docker buildx imagetools create "${IMGTAGS[@]}" "${SOURCES[@]}"
          echo "pushed: ${IMGTAGS[*]}"

  addons:
    name: ${{ matrix.addon }} (${{ matrix.arch.name }})
    # The TURN server and the TURN REST credential service documented in
    # docs/component.md; independent of the wheel
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        addon: [coturn, turn-rest]
        arch:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: ./.github/actions/build-push
        with:
          context: addons/${{ matrix.addon }}
          platforms: ${{ matrix.arch.platform }}
          outputs: type=image,"name=${{ env.REGISTRY_NAMESPACE }}/${{ matrix.addon }}",push-by-digest=true,name-canonical=true,push=true
          cache-scope: ${{ matrix.addon }}-${{ matrix.arch.name }}
          retry-delay: ${{ env.PUSH_RETRY_DELAY }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.addon }}-${{ matrix.arch.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  addons-merge:
    name: Merge multi-arch manifests (${{ matrix.addon }})
    needs: addons
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: [coturn, turn-rest]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download digests for this addon
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.addon }}-*
          path: /tmp/digests
          merge-multiple: true
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          FLOATING_TAGS: ${{ inputs.floating_tags }}
          ADDON: ${{ matrix.addon }}
        run: |
          set -e
          IMAGE="${REGISTRY_NAMESPACE}/${ADDON}"
          IMGTAGS=("-t" "${IMAGE}:${TAG_PREFIX}")
          if [ "${TAG_PREFIX}" != "main" ] && [ "${FLOATING_TAGS}" = "true" ]; then
            # Release builds also carry the floating `latest` tag, unless the
            # caller holds it back
            IMGTAGS+=("-t" "${IMAGE}:latest")
          fi
          # One empty file per pushed digest, named after it
          SOURCES=()
          for digest in *; do SOURCES+=("${IMAGE}@sha256:${digest}"); done
          "${GITHUB_WORKSPACE}/scripts/ci/retry.sh" 3 "${PUSH_RETRY_DELAY}" \
            docker buildx imagetools create "${IMGTAGS[@]}" "${SOURCES[@]}"
          echo "pushed: ${IMGTAGS[*]}"
