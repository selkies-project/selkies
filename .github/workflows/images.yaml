name: Images

# Multi-architecture (x86_64 + aarch64) container images, published to ghcr.io.
# Follows the llama.cpp docker build procedure: each architecture builds on a
# native runner (no QEMU), pushes by digest, and a merge job assembles the
# multi-arch manifest.

# Triggered by ci.yaml on pushes to main and by release.yaml for releases;
# can also be run standalone via the Actions tab, in which case it builds
# the wheel itself unless `wheel_artifact` names an existing artifact.

on:
  workflow_dispatch:
    inputs:
      tag_prefix:
        description: Tag prefix for the images
        type: string
        default: main
      wheel_artifact:
        description: Artifact name of a prebuilt wheel (skips the wheel build when set)
        type: string
        default: ""
  workflow_call:
    inputs:
      tag_prefix:
        description: Tag prefix for the images (e.g. v1.2.3 or latest)
        type: string
        default: main
      wheel_artifact:
        description: Artifact name of a prebuilt wheel (skips the wheel build when set)
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/selkies-project/selkies/py-example

jobs:
  wheel:
    name: Build wheel for the images
    if: ${{ inputs.wheel_artifact == '' }}
    uses: ./.github/workflows/build-wheel.yaml

  build:
    name: ${{ matrix.flavor.name }} (${{ matrix.arch.name }})
    needs: wheel
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.wheel.result) }}
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - name: ubuntu24.04
            image: ubuntu
            release: "24.04"
          - name: ubuntu26.04
            image: ubuntu
            release: "26.04"
          - name: bookworm
            image: debian
            release: bookworm
          - name: trixie
            image: debian
            release: trixie
        arch:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        uses: ./.github/actions/clean-disk
      - name: Download the wheel
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.wheel_artifact || 'selkies-wheel' }}
          path: dist/
      # Fresh pixelflux/pcmflux wheels, built from the master HEAD of the
      # linuxserver/* repos by the orchestrating run; absence is tolerated
      # (standalone dispatch) and the Dockerfile falls back to PyPI
      - name: Download pixelflux wheels (master HEAD)
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: pixelflux-wheels-*
          path: dist/
          merge-multiple: true
      - name: Download pcmflux wheels (master HEAD)
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: pcmflux-wheels-*
          path: dist/
          merge-multiple: true
      - name: Prepare wheels directory
        run: |
          set -e
          # .gitignore keeps addons/example/wheels/*.whl out of git
          cp dist/*.whl addons/example/wheels/
          ls -la addons/example/wheels/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: addons/example/Dockerfile
          platforms: ${{ matrix.arch.platform }}
          build-args: |
            DISTRIB_IMAGE=${{ matrix.flavor.image }}
            DISTRIB_RELEASE=${{ matrix.flavor.release }}
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=example-${{ matrix.flavor.name }}-${{ matrix.arch.name }}
          cache-to: type=gha,mode=max,scope=example-${{ matrix.flavor.name }}-${{ matrix.arch.name }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v5
        with:
          name: digest-${{ matrix.flavor.name }}-${{ matrix.arch.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifests
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [ubuntu24.04, ubuntu26.04, bookworm, trixie]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download digests for this flavor
        uses: actions/download-artifact@v5
        with:
          pattern: digest-${{ matrix.flavor }}-*
          path: /tmp/digests
          merge-multiple: true
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -e
          TAG_PREFIX="${{ github.event.inputs.tag_prefix || inputs.tag_prefix || 'main' }}"
          IMGTAGS=("-t" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG_PREFIX}-${{ matrix.flavor }}")
          if [ "${TAG_PREFIX}" != "main" ]; then
            # Release builds also carry the floating `latest-*` tags
            IMGTAGS+=("-t" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ matrix.flavor }}")
          fi
          docker buildx imagetools create "${IMGTAGS[@]}" $(printf "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s " *)
          echo "pushed: ${IMGTAGS[@]}"
