name: Images

# Multi-architecture (x86_64 + aarch64) container images, published to ghcr.io.
# Follows the llama.cpp docker build procedure: each architecture builds on a
# native runner (no QEMU), pushes by digest, and a merge job assembles the
# multi-arch manifest.

# Triggered by ci.yaml on pushes to main and by release.yaml for releases;
# can also be run standalone via the Actions tab, from main alone since the
# images leave the run.

on:
  workflow_dispatch:
    inputs:
      tag_prefix:
        description: Tag prefix for the images
        type: string
        default: main
      floating_tags:
        description: Also move the floating `latest` tags onto this build
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag_prefix:
        description: Tag prefix for the images (e.g. 1.2.3 or latest)
        type: string
        default: main
      floating_tags:
        description: Also move the floating `latest` tags onto this build
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY_NAMESPACE: ghcr.io/selkies-project/selkies
  BASE_IMAGE_NAME: ghcr.io/selkies-project/selkies/base
  IMAGE_NAME: ghcr.io/selkies-project/selkies/desktop
  # ghcr answers a secondary rate limit with 403 on the push itself. buildx
  # reports that as a build failure rather than a response this can read a
  # Retry-After from, so the pause is the minute GitHub asks for when it names
  # no delay of its own.
  PUSH_RETRY_DELAY: "60"

jobs:
  build:
    name: ${{ matrix.flavor.name }} (${{ matrix.arch.name }})
    if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_call' && startsWith(github.ref, 'refs/tags/') && inputs.tag_prefix == github.ref_name) }}
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - name: ubuntu26.04
            image: ubuntu
            release: "26.04"
          - name: debiantrixie
            image: debian
            release: trixie
        arch:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        # The tool cache is kept: setup-python and setup-node resolve from it
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_packages: azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* mongodb*
          remove_packages_one_command: true
          remove_folders: /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/local/share/vcpkg
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The session without a desktop, which the desktop image is then built
      # on. Both are built in this one job so the desktop image can name the base it was
      # just given by digest: an exact, single-architecture reference, months
      # before any manifest for it exists.
      - name: Build and push the base by digest
        id: base
        uses: ./.github/actions/build-push
        with:
          context: .
          file: addons/base/Dockerfile
          platforms: ${{ matrix.arch.platform }}
          build-args: |
            DISTRIB_IMAGE=${{ matrix.flavor.image }}
            DISTRIB_RELEASE=${{ matrix.flavor.release }}
          outputs: type=image,"name=${{ env.BASE_IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
          cache-scope: base-${{ matrix.flavor.name }}-${{ matrix.arch.name }}
          retry-delay: ${{ env.PUSH_RETRY_DELAY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the desktop image by digest
        id: build
        uses: ./.github/actions/build-push
        with:
          context: .
          file: addons/desktop/Dockerfile
          platforms: ${{ matrix.arch.platform }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE_NAME }}@${{ steps.base.outputs.digest }}
          outputs: type=image,"name=${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
          cache-scope: desktop-${{ matrix.flavor.name }}-${{ matrix.arch.name }}
          retry-delay: ${{ env.PUSH_RETRY_DELAY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Export digests
        env:
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests/base /tmp/digests/desktop
          touch "/tmp/digests/base/${BASE_DIGEST#sha256:}"
          touch "/tmp/digests/desktop/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-base-${{ matrix.flavor.name }}-${{ matrix.arch.name }}
          path: /tmp/digests/base/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.flavor.name }}-${{ matrix.arch.name }}
          path: /tmp/digests/desktop/*
          if-no-files-found: error
          retention-days: 1
      # What the images were built from and hold, kept with the run.
      # The distribution image is a moving tag, so its digest is read from the
      # provenance the push attached; each package list is read out of the
      # builder's cache rather than a pull of the image it describes.
      - name: Record what the images were built from
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          FLAVOR: ${{ matrix.flavor.name }}
          ARCH: ${{ matrix.arch.name }}
          PLATFORM: ${{ matrix.arch.platform }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -e
          out="selkies-${TAG_PREFIX}-images-${FLAVOR}-${ARCH}.txt"
          {
            echo "# selkies ${TAG_PREFIX} ${FLAVOR} ${PLATFORM}: the images this build pushed, what they were built from, and the packages each holds"
            echo "base ${BASE_IMAGE_NAME}@${BASE_DIGEST}"
            echo "desktop ${IMAGE_NAME}@${DIGEST}"
            docker buildx imagetools inspect "${BASE_IMAGE_NAME}@${BASE_DIGEST}" --format '{{json .Provenance}}' \
              | jq -r '.. | objects | select(has("buildDefinition")) | .buildDefinition.resolvedDependencies[] | select(.uri | startswith("pkg:docker/")) | "distribution " + (.uri | capture("^pkg:docker/(?<name>[^@?]+)@(?<tag>[^?]+)") | "\(.name):\(.tag)") + "@sha256:" + .digest.sha256' \
              | sort -u | grep .
          } > "${out}"
          mkdir -p /tmp/empty
          for image in base desktop; do
            case "${image}" in
              base) ref="${BASE_IMAGE_NAME}@${BASE_DIGEST}" ;;
              desktop) ref="${IMAGE_NAME}@${DIGEST}" ;;
            esac
            printf 'FROM %s\nFROM scratch\nCOPY --from=0 /var/lib/dpkg/status /status\n' "${ref}" \
              | docker buildx build --platform "${PLATFORM}" --output "type=local,dest=/tmp/dpkg-${image}" -f - /tmp/empty
            { echo; echo "# ${image} packages"; dpkg-query --admindir="/tmp/dpkg-${image}" -W -f '${binary:Package}=${Version}\n'; } >> "${out}"
          done
          wc -l "${out}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ matrix.flavor.name }}-${{ matrix.arch.name }}
          path: selkies-*-images-*.txt
          if-no-files-found: error

  merge:
    name: Merge base and desktop manifests (${{ matrix.flavor }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [ubuntu26.04, debiantrixie]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the base digests for this flavor
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-base-${{ matrix.flavor }}-*
          path: /tmp/digests/base
          merge-multiple: true
      - name: Download the desktop digests for this flavor
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.flavor }}-*
          path: /tmp/digests/desktop
          merge-multiple: true
      - name: Create and push the multi-arch manifests
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          FLOATING_TAGS: ${{ inputs.floating_tags }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -e
          # One manifest per image, from the one empty file per pushed digest
          # each build job left behind, named after that digest
          publish() {
            local image="$1" dir="$2"
            local tags=("-t" "${image}:${TAG_PREFIX}-${FLAVOR}")
            if [ "${TAG_PREFIX}" != "main" ] && [ "${FLOATING_TAGS}" = "true" ]; then
              # Release builds also carry the floating `latest-*` tags, unless
              # the caller holds them back
              tags+=("-t" "${image}:latest-${FLAVOR}")
            fi
            local sources=()
            for digest in "${dir}"/*; do sources+=("${image}@sha256:$(basename "${digest}")"); done
            "${GITHUB_WORKSPACE}/scripts/ci/retry.sh" 3 "${PUSH_RETRY_DELAY}" \
              docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            echo "pushed: ${tags[*]}"
          }
          publish "${BASE_IMAGE_NAME}" /tmp/digests/base
          publish "${IMAGE_NAME}" /tmp/digests/desktop

  addons:
    if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_call' && startsWith(github.ref, 'refs/tags/') && inputs.tag_prefix == github.ref_name) }}
    name: ${{ matrix.addon }} (${{ matrix.arch.name }})
    # The TURN server and the TURN REST credential service documented in
    # docs/components/index.md; independent of the wheel
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        addon: [coturn, turn-rest]
        arch:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: ./.github/actions/build-push
        with:
          context: addons/${{ matrix.addon }}
          platforms: ${{ matrix.arch.platform }}
          outputs: type=image,"name=${{ env.REGISTRY_NAMESPACE }}/${{ matrix.addon }}",push-by-digest=true,name-canonical=true,push=true
          cache-scope: ${{ matrix.addon }}-${{ matrix.arch.name }}
          retry-delay: ${{ env.PUSH_RETRY_DELAY }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.addon }}-${{ matrix.arch.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  addons-merge:
    name: Merge multi-arch manifests (${{ matrix.addon }})
    needs: addons
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: [coturn, turn-rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download digests for this addon
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.addon }}-*
          path: /tmp/digests
          merge-multiple: true
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          FLOATING_TAGS: ${{ inputs.floating_tags }}
          ADDON: ${{ matrix.addon }}
        run: |
          set -e
          IMAGE="${REGISTRY_NAMESPACE}/${ADDON}"
          IMGTAGS=("-t" "${IMAGE}:${TAG_PREFIX}")
          if [ "${TAG_PREFIX}" != "main" ] && [ "${FLOATING_TAGS}" = "true" ]; then
            # Release builds also carry the floating `latest` tag, unless the
            # caller holds it back
            IMGTAGS+=("-t" "${IMAGE}:latest")
          fi
          # One empty file per pushed digest, named after it
          SOURCES=()
          for digest in *; do SOURCES+=("${IMAGE}@sha256:${digest}"); done
          "${GITHUB_WORKSPACE}/scripts/ci/retry.sh" 3 "${PUSH_RETRY_DELAY}" \
            docker buildx imagetools create "${IMGTAGS[@]}" "${SOURCES[@]}"
          echo "pushed: ${IMGTAGS[*]}"

  cleanup:
    name: Prune untagged images
    needs: [merge, addons-merge]
    # Each push moves the `main-*` tags onto new manifests, and the ones they
    # pointed at before stay in the registry untagged, platform and attestation
    # children included. Nothing else ever removes them.
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
    runs-on: ubuntu-latest
    # The action is not safe to run against a package twice at once, and a
    # release build can overlap a push build
    concurrency:
      group: cleanup-images
    # A prune that hits a rate limit must not fail the publish
    continue-on-error: true
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: selkies/base,selkies/desktop,selkies/coturn,selkies/turn-rest
          delete-untagged: true
          # A build in flight has its platform images untagged until its
          # manifest lands, so the window stays well clear of a publish
          older-than: 1 day
