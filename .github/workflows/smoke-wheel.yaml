name: Smoke test the wheel

# Installs the built wheels into clean virtualenvs and proves they run: the
# executable answers, the web client is installed beside it, and the Jupyter
# entry point reads the executable's configuration. Split from the build so a
# caller can gate this alone on it.

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: Artifact name of prebuilt wheels (builds them when empty)
        type: string
        default: ""
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name of the wheels to test
        type: string
        default: selkies-wheel

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Only a standalone dispatch reaches this: a caller has already built the
  # wheels and names their artifact.
  wheel:
    name: Build wheel for the smoke test
    if: ${{ inputs.artifact_name == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-wheel.yaml

  smoke:
    name: Install and run the wheel (${{ matrix.target.arch }})
    needs: [wheel]
    if: ${{ always() && contains(fromJSON('["success", "skipped"]'), needs.wheel.result) }}
    strategy:
      # Both architectures the wheels are built for, each on a runner of its
      # own: the manylinux wheel in virtualenvs there, the musllinux one on Alpine
      fail-fast: false
      matrix:
        target:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        id: python-first
        # A download GitHub fails is tried again after a wait, twice.
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Wait out a download outage
        if: steps.python-first.outcome == 'failure'
        run: sleep 120
      - name: Set up Python, again
        id: python-again
        if: steps.python-first.outcome == 'failure'
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Wait out a longer download outage
        if: steps.python-again.outcome == 'failure'
        run: sleep 300
      - name: Set up Python, a third time
        id: python-third
        if: steps.python-again.outcome == 'failure'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Download the wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name || 'selkies-wheel' }}
          path: dist/
      - name: Install smoke-test system packages
        # The libraries the server links that pixelflux's wheels leave to the
        # host as well
        run: sudo apt-get update && sudo apt-get install -y libgbm1 libpixman-1-0
      - name: Install smoke test
        # The wheel has no dependencies, and pip picks this platform's out of dist/
        run: |
          python3 -m venv /tmp/selkies-venv
          /tmp/selkies-venv/bin/pip install --no-index --find-links "$PWD/dist" --only-binary=:all: selkies
          /tmp/selkies-venv/bin/selkies --version
          /tmp/selkies-venv/bin/selkies --help >/dev/null && echo "selkies --help OK"
          test -f /tmp/selkies-venv/share/selkies/web/index.html && echo "bundled web client OK"
          /tmp/selkies-venv/bin/python -c "from selkies.session import jupyter; assert jupyter()['command'][0] == '/tmp/selkies-venv/bin/selkies'; print('Jupyter entry point OK')"
      - name: Set up the oldest Python CI checks
        id: oldest-python-first
        # A download GitHub fails is tried again after a wait, twice.
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
          update-environment: false
      - name: Wait out a download outage
        if: steps.oldest-python-first.outcome == 'failure'
        run: sleep 120
      - name: Set up the oldest Python CI checks, again
        id: oldest-python-again
        if: steps.oldest-python-first.outcome == 'failure'
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
          update-environment: false
      - name: Wait out a longer download outage
        if: steps.oldest-python-again.outcome == 'failure'
        run: sleep 300
      - name: Set up the oldest Python CI checks, a third time
        id: oldest-python-third
        if: steps.oldest-python-again.outcome == 'failure'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
          update-environment: false
      - name: Install smoke test (oldest Python CI checks)
        # The same checks on the oldest interpreter CI keeps; the wheel itself
        # names no floor
        run: |
          "${{ steps.oldest-python-first.outputs.python-path || steps.oldest-python-again.outputs.python-path || steps.oldest-python-third.outputs.python-path }}" -m venv /tmp/selkies-venv-oldest
          /tmp/selkies-venv-oldest/bin/pip install --no-index --find-links "$PWD/dist" --only-binary=:all: selkies
          /tmp/selkies-venv-oldest/bin/selkies --help >/dev/null && echo "selkies --help OK"
          test -f /tmp/selkies-venv-oldest/share/selkies/web/index.html && echo "bundled web client OK"
          /tmp/selkies-venv-oldest/bin/python -c "from selkies.session import jupyter; assert jupyter()['command'][0] == '/tmp/selkies-venv-oldest/bin/selkies'; print('Jupyter entry point OK')"
      - name: Install smoke test (musllinux, on Alpine)
        # libxcb is what the bundled libpulse leaves to the host, as pcmflux's does
        run: |
          scripts/ci/retry.sh 5 60 docker pull python:3-alpine
          docker run --rm -v "$PWD/dist:/dist:ro" python:3-alpine sh -euxc '
            apk add --no-cache mesa-gbm pixman libxcb
            python3 -m venv /tmp/selkies-venv
            /tmp/selkies-venv/bin/pip install --no-index --find-links /dist --only-binary=:all: selkies
            /tmp/selkies-venv/bin/selkies --version
            test -f /tmp/selkies-venv/share/selkies/web/index.html'
