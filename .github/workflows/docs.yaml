name: Docs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "26"
  # Pages serves a project site under a path named after the repository, and
  # every URL the export emits has to carry it
  NEXT_PUBLIC_BASE_PATH: /selkies

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build the static site
        working-directory: website
        # Lockfiles are gitignored in this repository, so `npm ci` has nothing
        # to install from
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Check every link and anchor in the built site
        working-directory: website
        run: npm run check-links

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/out
          retention-days: 1

  publish:
    name: Publish documentation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # deploy-pages resolves the artifact through the Actions API
      actions: read
      pages: write
      id-token: write
    if: ${{ github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
