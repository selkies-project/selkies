name: Docs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python for MkDocs
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Generate MkDocs static files
        # Pinned to the 9.x line: MkDocs 2.0 removes the plugin and theming
        # systems this site depends on
        run: |
          pip install --no-cache-dir "mkdocs-material~=9.7"
          mkdocs build --strict --verbose --site-dir "${RUNNER_TEMP}/mkdocs"

      - name: Upload MkDocs artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/mkdocs
          retention-days: 1

  publish:
    name: Publish documentation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # deploy-pages resolves the artifact through the Actions API
      actions: read
      pages: write
      id-token: write
    if: ${{ github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
