name: Docs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer push to the same ref supersedes its build; the one Pages site takes deployments
# in turn, in the publish job, so a pull request's build never displaces main's.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Every release tag that carries the site is built beside main.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build the static site, one version per release and main
        working-directory: website
        env:
          # The build asks GitHub which release is the latest, authenticated so
          # the runner's shared address never trips the unauthenticated limit
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --no-audit --no-fund
          npm run build:versions

      - name: Check every link and anchor in the built site
        working-directory: website
        run: npm run check-links

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/out
          retention-days: 1

  publish:
    name: Publish documentation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # deploy-pages resolves the artifact through the Actions API
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    if: ${{ github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
