name: Build wheel
# The selkies wheels, one per bundle: each of the four bundles (glibc and musl,
# x86_64 and aarch64) bundle.yaml builds is repackaged as the wheel of its
# platform (infra/wheel/build.py), manylinux_2_28 or musllinux_1_2, so the
# executable a wheel installs is the one every other channel carries, with its
# payload beside it. Nothing is compiled here. The sdist is written beside them
# for an index that wants one; it builds the server alone. The bundles stay in
# the run as bundle-<libc>-<arch> for packages.yaml to repackage too.
on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Version written into the wheel metadata
        type: string
        default: 0.0.0.dev0
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name for the built wheels
        type: string
        default: selkies-wheel
      package_version:
        description: Version written into the wheel metadata
        type: string
        default: 0.0.0.dev0

permissions:
  contents: read

jobs:
  bundle:
    name: Bundles
    uses: ./.github/workflows/bundle.yaml
    with:
      package_version: ${{ inputs.package_version }}

  wheel:
    name: Repackage the bundles as wheels
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*-*
          path: bundles
          merge-multiple: true
      - name: Download the web client
        # The sdist carries it, for a build from source to embed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-web-client
      - name: Repackage each bundle and write the sdist
        env:
          SELKIES_VERSION: ${{ inputs.package_version }}
        run: |
          set -e
          mkdir -p dist wheelhouse
          tar -C dist -xf selkies-web-client.tar && rm selkies-web-client.tar
          for bundle in bundles/selkies-*-linux-*.tar.gz; do
            python3 infra/wheel/build.py "${bundle}" wheelhouse
          done
          test "$(ls wheelhouse/*.whl | wc -l)" -eq 4
          # The checkout is this job's own, so it is stamped in place
          sh infra/packaging/stamp-version.sh . "${SELKIES_VERSION}"
          sed -i "s|^version =.*|version = \"${SELKIES_VERSION}\"|" pyproject.toml
          python3 -m pip install --quiet "maturin>=1.9,<2"
          maturin sdist --out wheelhouse
          ls -la wheelhouse/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name || 'selkies-wheel' }}
          path: wheelhouse/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
