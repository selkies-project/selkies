name: Build wheel

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Version written into the wheel metadata
        type: string
        default: 0.0.0.dev0
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name for the built wheels
        type: string
        default: selkies-wheel
      package_version:
        description: Version written into the wheel metadata
        type: string
        default: 0.0.0.dev0

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  wheel:
    name: Build wheel (${{ matrix.target.platform }}_${{ matrix.target.arch }}, with bundled web client)
    # One wheel per platform pixelflux and pcmflux publish theirs for, each built
    # in the image theirs are built in (infra/wheel/build.sh), on a native runner
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: x86_64
            runner: ubuntu-latest
            platform: manylinux2014
            # The sdist is the same file from any job, so one writes it
            sdist: "1"
          - arch: aarch64
            runner: ubuntu-26.04-arm
            platform: manylinux_2_28
          - arch: x86_64
            runner: ubuntu-latest
            platform: musllinux_1_2
          - arch: aarch64
            runner: ubuntu-26.04-arm
            platform: musllinux_1_2
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        # The tool cache is kept: setup-node resolves from it
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_packages: azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* mongodb*
          remove_packages_one_command: true
          remove_folders: /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/local/share/vcpkg
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/selkies-web-core/package-lock.json
            web/selkies-dashboard/package-lock.json
      - name: Build the web client bundle
        env:
          # For the controller database's lookups (gendb.js)
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/build-web.sh
      - name: Build the wheel
        env:
          SELKIES_VERSION: ${{ inputs.package_version }}
          SELKIES_SDIST: ${{ matrix.target.sdist }}
          IMAGE: quay.io/pypa/${{ matrix.target.platform }}_${{ matrix.target.arch }}
        run: |
          mkdir -p wheelhouse
          # The registry answers 5xx for minutes at a time, so the image is pulled with retries
          scripts/ci/retry.sh 5 60 docker pull "${IMAGE}"
          docker run --rm -v "${PWD}:/repo:ro" -v "${PWD}/wheelhouse:/out" \
            -e SELKIES_VERSION -e SELKIES_SDIST "${IMAGE}" sh /repo/infra/wheel/build.sh /out
          ls -la wheelhouse/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name || 'selkies-wheel' }}-${{ matrix.target.platform }}_${{ matrix.target.arch }}
          path: wheelhouse/*
          # Already-compressed payloads: the artifact is a zip either way, and
          # re-deflating them spends CPU for a size that does not move.
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # Every platform's wheel, and the sdist, as the one artifact callers name
  merge:
    name: Collect the wheels
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name || 'selkies-wheel' }}
          pattern: ${{ inputs.artifact_name || 'selkies-wheel' }}-*
          compression-level: 0
          retention-days: 14
          delete-merged: true
