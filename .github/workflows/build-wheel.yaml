name: Build wheel

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name for the built wheel
        type: string
        default: selkies-wheel
      package_version:
        description: Version written into the wheel metadata
        type: string
        default: 0.0.0.dev0

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  wheel:
    name: Build wheel (with bundled web client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        uses: ./.github/actions/clean-disk
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Build the web client bundle
        run: |
          set -e
          cd addons/selkies-web-core && npm install --no-audit --no-fund && npm run build && cd ../..
          cd addons/selkies-dashboard && cp ../selkies-web-core/dist/selkies-core.js src/ && npm install --no-audit --no-fund && SELKIES_INJECT=1 npm run build && cd ../..
          mkdir -p addons/selkies-dashboard/dist/src
          cp addons/selkies-web-core/dist/selkies-core.js addons/selkies-dashboard/dist/src/
          cp addons/universal-touch-gamepad/universalTouchGamepad.js addons/selkies-dashboard/dist/src/
          cp -r addons/selkies-web-core/dist/jsdb addons/selkies-dashboard/dist/
          # .gitignore keeps src/selkies/selkies_web out of git; the wheel is the only consumer of this stage
          cp -ar addons/selkies-dashboard/dist src/selkies/selkies_web
          printf '%s' '{"name":"Selkies","short_name":"Selkies","manifest_version":2,"version":"1.0.0","display":"fullscreen","background_color":"#000000","theme_color":"#000000","icons":[{"src":"icon.png","type":"image/png","sizes":"512x512"}],"start_url":"/"}' > src/selkies/selkies_web/manifest.json
          # PWA icon/favicon are vendored in this repository, not downloaded
          cp docs/assets/logo/icon-512x512.png src/selkies/selkies_web/icon.png
          cp docs/assets/logo/favicon.ico src/selkies/selkies_web/favicon.ico
      - name: Build the wheel
        run: |
          python3 -m pip install --upgrade build
          sed -i "s|^version =.*|version = \"${{ inputs.package_version }}\"|" pyproject.toml
          python3 -m build && ls -la dist/
      - name: Install smoke test
        run: |
          python3 -m venv /tmp/selkies-venv
          /tmp/selkies-venv/bin/pip install dist/selkies-*.whl
          /tmp/selkies-venv/bin/selkies --help >/dev/null && echo "selkies --help OK"
          /tmp/selkies-venv/bin/python -c "import importlib.resources as r; c = r.files('selkies.selkies_web'); assert (c / 'index.html').is_file(), 'web client missing from wheel'; print('bundled web client OK')"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/*
          retention-days: 14
