name: Build wheel

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Version written into the wheel metadata
        type: string
        default: 0.0.0.dev0
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name for the built wheel
        type: string
        default: selkies-wheel
      package_version:
        description: Version written into the wheel metadata
        type: string
        default: 0.0.0.dev0
      wheels_ready:
        description: The pixelflux/pcmflux wheels for this run are available as artifacts
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: "26"
  PYTHON_VERSION: "3.12"

jobs:
  # The pinned pixelflux/pcmflux are a coordinated pre-release, published per
  # commit rather than to PyPI, so the smoke test can only install them from a
  # wheel this run has in hand. A caller that already built them says so with
  # wheels_ready; otherwise they come from the sibling's pre-release for its
  # current main HEAD, and when that has not been published yet they are built
  # here. The test suites run under the same contract.
  capture-stack:
    name: Capture stack (locate)
    if: ${{ !inputs.wheels_ready }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.probe.outputs.build }}
      pixelflux: ${{ steps.probe.outputs.pixelflux }}
      pcmflux: ${{ steps.probe.outputs.pcmflux }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=false
          for project in pixelflux pcmflux; do
            sha="$(gh api "repos/${{ github.repository_owner }}/${project}/commits/main" \
                   --jq .sha 2>/dev/null || true)"
            if [ -n "${sha}" ] && gh release view "${sha}" \
                 --repo "${{ github.repository_owner }}/${project}" >/dev/null 2>&1; then
              echo "${project}=${sha}" >> "$GITHUB_OUTPUT"
              echo "${project}: pre-release ${sha}"
            else
              echo "${project}=" >> "$GITHUB_OUTPUT"
              echo "${project}: no pre-release for main (${sha:-unknown}); building from source"
              build=true
            fi
          done
          echo "build=${build}" >> "$GITHUB_OUTPUT"

  wheels:
    name: Capture stack (main HEAD)
    needs: [capture-stack]
    if: ${{ !inputs.wheels_ready && needs.capture-stack.outputs.build == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-pixelflux-pcmflux-wheels.yaml

  wheel:
    name: Build wheel (with bundled web client)
    needs: [capture-stack, wheels]
    if: ${{ always() && contains(fromJSON('["success", "skipped"]'), needs.wheels.result) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        # The tool cache is kept: setup-python and setup-node resolve from it
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_packages: azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* mongodb*
          remove_packages_one_command: true
          remove_folders: /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/local/share/vcpkg
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # Lockfiles are gitignored here, so the cache is keyed on the manifests
          cache-dependency-path: |
            addons/selkies-web-core/package.json
            addons/selkies-dashboard/package.json
            addons/selkies-dashboard-wish/package.json
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Build the web client bundle
        run: ./scripts/ci/build-web.sh
      - name: Build the wheel
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          python3 -m pip install --upgrade build
          sed -i "s|^version =.*|version = \"${PACKAGE_VERSION}\"|" pyproject.toml
          python3 -m build && ls -la dist/
      - name: Install smoke-test system packages
        # Loaded with ctypes for keymap handling, so the smoke test covers that
        # import path rather than its fallback
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon0
      # The pinned pixelflux/pcmflux are a coordinated pre-release: not on PyPI
      # yet, so the smoke test resolves them from local wheels. From this run's
      # artifacts when the capture-stack job built them, else from each project's
      # main-HEAD pre-release. The download is attempted either way: a caller
      # that built them without saying so still gets the wheels it built, and a
      # missing artifact leaves the release path below to answer for it.
      - name: Fetch the capture-stack wheels (this run)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: "*-wheels-x86_64-manylinux"
          path: sibling-wheels
          merge-multiple: true
      - name: Fetch the capture-stack wheels (main-HEAD pre-release)
        if: ${{ needs.capture-stack.outputs.build == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sibling-wheels
          for project in pixelflux pcmflux; do
            sha="${{ needs.capture-stack.outputs.pixelflux }}"
            [ "${project}" = "pcmflux" ] && sha="${{ needs.capture-stack.outputs.pcmflux }}"
            gh release download "${sha}" --repo "${{ github.repository_owner }}/${project}" \
              --pattern "*manylinux*x86_64*.whl" --dir sibling-wheels --skip-existing
            echo "${project}: ${sha}"
          done
      - name: Check the capture-stack wheels
        run: |
          mkdir -p sibling-wheels && ls -la sibling-wheels
          for project in pixelflux pcmflux; do
            # Fatal rather than a note: without a local wheel the install below
            # resolves the pinned pre-release from PyPI, where that version does
            # not exist, and the run then fails inside pip's resolver instead of
            # naming the wheel that never arrived.
            if ! ls "sibling-wheels/${project}"-*.whl > /dev/null 2>&1; then
              echo "::error::No ${project} wheel for the smoke test; the pinned pre-release cannot resolve from PyPI"
              exit 1
            fi
          done
      - name: Install smoke test
        run: |
          python3 -m venv /tmp/selkies-venv
          # Every dependency must resolve to a wheel: the images and packages
          # install this same set without a compiler
          /tmp/selkies-venv/bin/pip install --find-links "$PWD/sibling-wheels" --only-binary=:all: dist/selkies-*.whl
          /tmp/selkies-venv/bin/selkies --help >/dev/null && echo "selkies --help OK"
          /tmp/selkies-venv/bin/python -c "import importlib.resources as r; c = r.files('selkies.selkies_web'); assert (c / 'index.html').is_file(), 'web client missing from wheel'; print('bundled web client OK')"
      - name: Set up the oldest supported Python
        id: oldest-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          update-environment: false
      - name: Install smoke test (oldest supported Python)
        # The same checks on the oldest interpreter the wheel claims: its
        # importlib.resources cannot read a namespace package, so a bundle that
        # lost its __init__.py fails here and on no newer interpreter
        run: |
          "${{ steps.oldest-python.outputs.python-path }}" -m venv /tmp/selkies-venv-oldest
          /tmp/selkies-venv-oldest/bin/pip install --find-links "$PWD/sibling-wheels" --only-binary=:all: dist/selkies-*.whl
          /tmp/selkies-venv-oldest/bin/selkies --help >/dev/null && echo "selkies --help OK"
          /tmp/selkies-venv-oldest/bin/python -c "import importlib.resources as r; c = r.files('selkies.selkies_web'); assert (c / 'index.html').is_file(), 'web client missing from wheel'; print('bundled web client OK')"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name || 'selkies-wheel' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
