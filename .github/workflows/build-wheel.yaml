name: Build wheel

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Version written into the wheel metadata
        type: string
        default: 0.0.0.dev0
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name for the built wheel
        type: string
        default: selkies-wheel
      package_version:
        description: Version written into the wheel metadata
        type: string
        default: 0.0.0.dev0

permissions:
  contents: read

env:
  NODE_VERSION: "26"
  PYTHON_VERSION: "3.12"

jobs:
  wheel:
    name: Build wheel (with bundled web client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        # The tool cache is kept: setup-python and setup-node resolve from it
        uses: endersonmenezes/free-disk-space@2a22f8c59cae9cddae7194b33e6b92d023b2b4b8 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_packages: azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* mongodb*
          remove_packages_one_command: true
          remove_folders: /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/local/share/vcpkg
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            addons/selkies-web-core/package-lock.json
            addons/selkies-dashboard/package-lock.json
            addons/selkies-dashboard-wish/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Build the web client bundle
        run: ./scripts/ci/build-web.sh
      - name: Build the wheel
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          python3 -m pip install --upgrade build
          sed -i "s|^version =.*|version = \"${PACKAGE_VERSION}\"|" pyproject.toml
          python3 -m build && ls -la dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name || 'selkies-wheel' }}
          path: dist/*
          # Already-compressed payloads: the artifact is a zip either way, and
          # re-deflating them spends CPU for a size that does not move.
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
