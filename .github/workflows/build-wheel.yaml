name: Build wheel

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Version written into the wheel metadata
        type: string
        default: 0.0.0.dev0
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name for the built wheel
        type: string
        default: selkies-wheel
      package_version:
        description: Version written into the wheel metadata
        type: string
        default: 0.0.0.dev0

permissions:
  contents: read

env:
  NODE_VERSION: "26"
  PYTHON_VERSION: "3.12"

jobs:
  wheel:
    name: Build wheel (with bundled web client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        # The tool cache is kept: setup-python and setup-node resolve from it
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_packages: azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* mongodb*
          remove_packages_one_command: true
          remove_folders: /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/local/share/vcpkg
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # Lockfiles are gitignored here, so the cache is keyed on the manifests
          cache-dependency-path: |
            addons/selkies-web-core/package.json
            addons/selkies-dashboard/package.json
            addons/selkies-dashboard-wish/package.json
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Build the web client bundle
        run: ./scripts/ci/build-web.sh
      - name: Build the wheel
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          python3 -m pip install --upgrade build
          sed -i "s|^version =.*|version = \"${PACKAGE_VERSION}\"|" pyproject.toml
          python3 -m build && ls -la dist/
      - name: Install smoke-test system packages
        # Loaded with ctypes for keymap handling, so the smoke test covers that
        # import path rather than its fallback
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon0
      - name: Install smoke test
        run: |
          python3 -m venv /tmp/selkies-venv
          # Every dependency must resolve to a wheel: the images and packages
          # install this same set without a compiler
          /tmp/selkies-venv/bin/pip install --only-binary=:all: dist/selkies-*.whl
          /tmp/selkies-venv/bin/selkies --help >/dev/null && echo "selkies --help OK"
          /tmp/selkies-venv/bin/python -c "import importlib.resources as r; c = r.files('selkies.selkies_web'); assert (c / 'index.html').is_file(), 'web client missing from wheel'; print('bundled web client OK')"
      - name: Set up the oldest supported Python
        id: oldest-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          update-environment: false
      - name: Install smoke test (oldest supported Python)
        # The same checks on the oldest interpreter the wheel claims: its
        # importlib.resources cannot read a namespace package, so a bundle that
        # lost its __init__.py fails here and on no newer interpreter
        run: |
          "${{ steps.oldest-python.outputs.python-path }}" -m venv /tmp/selkies-venv-oldest
          /tmp/selkies-venv-oldest/bin/pip install --only-binary=:all: dist/selkies-*.whl
          /tmp/selkies-venv-oldest/bin/selkies --help >/dev/null && echo "selkies --help OK"
          /tmp/selkies-venv-oldest/bin/python -c "import importlib.resources as r; c = r.files('selkies.selkies_web'); assert (c / 'index.html').is_file(), 'web client missing from wheel'; print('bundled web client OK')"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name || 'selkies-wheel' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
