name: Packages

# Native packages, .deb, .rpm, .apk, and .pkg.tar.zst, and the AppImage, each
# the bundle of its C library and architecture repackaged: the bundles
# build-wheel.yaml builds through bundle.yaml (bundle-<libc>-<arch> in the same
# run) are unpacked at /opt/selkies by infra/packaging/package.sh inside a
# container of the distribution whose packaging tool the format is, or put
# behind AppImage's runtime by infra/appimage/build.sh. Nothing is compiled
# here, so one package of a format serves every release of every distribution
# that takes it, down to the bundle's C library floor, and runs the binaries
# every other channel runs. Each is then installed into pristine containers of
# the distributions it serves, where it has to bring up a whole session with
# nothing but what it declares (scripts/ci/verify-package.sh,
# scripts/ci/verify-appimage.sh).

# Called by ci.yaml on pushes to main and by release.yaml for releases, after
# build-wheel.yaml, whose bundles it reads.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.kind.name }} (${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            runner: ubuntu-latest
          - name: aarch64
            runner: ubuntu-26.04-arm
        kind:
          - name: deb
            libc: glibc
            image: debian:stable-slim
            hosts: ubuntu:24.04 ubuntu:26.04 debian:bookworm debian:trixie
            install: apt-get update -qq && apt-get install -y -qq /out/*.deb
          - name: rpm
            libc: glibc
            image: fedora:43
            # Fedora's base image carries no su, which the check runs the session with
            hosts: fedora:43 almalinux:9 almalinux:8
            install: dnf install -y -q util-linux /out/*.rpm
          - name: apk
            libc: musl
            image: alpine:latest
            hosts: alpine:latest
            install: apk add --quiet --allow-untrusted /out/*.apk
          - name: arch
            libc: glibc
            image: archlinux:base-devel
            hosts: archlinux:base
            install: pacman -Sy --noconfirm > /dev/null && pacman -U --noconfirm /out/*.pkg.tar.zst
        exclude:
          # Arch Linux publishes an x86_64-only image
          - arch:
              name: aarch64
              runner: ubuntu-26.04-arm
            kind:
              name: arch
              libc: glibc
              image: archlinux:base-devel
              hosts: archlinux:base
              install: pacman -Sy --noconfirm > /dev/null && pacman -U --noconfirm /out/*.pkg.tar.zst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-${{ matrix.kind.libc }}-${{ matrix.arch.name }}
          path: bundle
      - name: Repackage the bundle inside the format's distribution
        env:
          IMAGE: ${{ matrix.kind.image }}
          FORMAT: ${{ matrix.kind.name }}
        run: |
          set -e
          mkdir -p out
          scripts/ci/retry.sh 5 60 docker pull "${IMAGE}"
          bundle="$(echo bundle/selkies-*.tar.gz)"
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" -v "${GITHUB_WORKSPACE}/out:/out" \
            "${IMAGE}" sh /repo/infra/packaging/package.sh "${FORMAT}" "/repo/${bundle}" /out
          ls -la out/
      - name: Install the package in pristine containers of the distributions it serves
        env:
          HOSTS: ${{ matrix.kind.hosts }}
          INSTALL: ${{ matrix.kind.install }}
        run: |
          set -e
          for host in ${HOSTS}; do
            echo "::group::${host}"
            scripts/ci/retry.sh 5 60 docker pull "${host}"
            docker run --rm -v "${GITHUB_WORKSPACE}/out:/out:ro" -e INSTALL \
              -v "${GITHUB_WORKSPACE}/scripts/ci/verify-package.sh:/verify.sh:ro" \
              "${host}" sh /verify.sh
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.kind.name }}-${{ matrix.arch.name }}
          path: out/*
          # Already-compressed payloads: the artifact is a zip either way, and
          # re-deflating them spends CPU for a size that does not move.
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  appimage:
    name: AppImage (${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            runner: ubuntu-latest
          - name: aarch64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the glibc bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-glibc-${{ matrix.arch.name }}
          path: bundle
      - name: Build the AppImage
        env:
          # For the release lookup behind the runtime's check
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools
          ./infra/appimage/build.sh bundle/selkies-*.tar.gz out
      - name: Check the AppImage on a pristine host at its glibc floor
        run: |
          scripts/ci/retry.sh 5 60 docker pull almalinux:8
          docker run --rm -v "${GITHUB_WORKSPACE}/out:/out:ro" \
            -v "${GITHUB_WORKSPACE}/scripts/ci/verify-appimage.sh:/verify.sh:ro" \
            almalinux:8 sh -c 'sh /verify.sh /out/*.AppImage'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-${{ matrix.arch.name }}
          path: out/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
