name: Packages

# Native packages: .deb (Ubuntu/Debian), .rpm (Fedora/EL), .apk (Alpine),
# .pkg.tar.zst (Arch), and .AppImage (x86_64 + aarch64, via rattler-build +
# linuxdeploy-plugin-conda). Each builds the Rust server inside a container of
# the target distribution (the AppImage's inside manylinux_2_28, its glibc
# floor); a native package installs it at /usr/bin/selkies with the web client
# at /usr/share/selkies/web and declares the packages behind the libraries the
# binary links and loads, as that distribution names them, and the AppImage
# carries it in a conda environment of conda-forge's libraries. pixelflux and
# pcmflux come from the workspace's copied path dependencies. Only apt/apt-get, dnf,
# apk, pacman, or micromamba are ever invoked.

# Triggered by ci.yaml on pushes to main and by release.yaml for releases; can
# also be run standalone via the Actions tab.

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Version string stamped into the packages
        type: string
        default: 0.0.0.dev0
  workflow_call:
    inputs:
      package_version:
        description: Version string stamped into the packages
        type: string
        default: 0.0.0.dev0

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  web:
    name: Web client for the packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            addons/selkies-web-core/package-lock.json
            addons/selkies-dashboard/package-lock.json
      - name: Build the web client bundle
        env:
          # For the controller database's lookups (gendb.js)
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/ci/build-web.sh
          tar -C dist -cf selkies-web-client.tar web
      # One bundle for every package and AppImage, so the browser payload is
      # identical in every channel; one file, which the release job leaves out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selkies-web-client
          path: selkies-web-client.tar
          if-no-files-found: error
          retention-days: 1

  package:
    name: ${{ matrix.kind.name }} (${{ matrix.arch.name }})
    needs: web
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: amd64
            runner: ubuntu-latest
          - name: arm64
            runner: ubuntu-24.04-arm
        kind:
          - name: deb-ubuntu24.04
            tag: ubuntu24.04
            image: ubuntu:24.04
            script: infra/packaging/deb.sh
            install: apt-get update -qq && apt-get install -y -qq /out/*.deb
          - name: deb-ubuntu26.04
            tag: ubuntu26.04
            image: ubuntu:26.04
            script: infra/packaging/deb.sh
            install: apt-get update -qq && apt-get install -y -qq /out/*.deb
          - name: deb-debianbookworm
            tag: debianbookworm
            image: debian:bookworm
            script: infra/packaging/deb.sh
            install: apt-get update -qq && apt-get install -y -qq /out/*.deb
          - name: deb-debiantrixie
            tag: debiantrixie
            image: debian:trixie
            script: infra/packaging/deb.sh
            install: apt-get update -qq && apt-get install -y -qq /out/*.deb
          - name: rpm-fedora
            tag: fc
            # The oldest Fedora still supported, not the newest: the sonames
            # the server links are the ones its build found, so building on
            # the oldest is what makes one package cover every release that is
            # maintained. Bumped when Fedora retires it.
            image: fedora:43
            script: infra/packaging/rpm.sh
            install: dnf install -y -q /out/*.rpm
          - name: rpm-el9
            tag: el9
            image: almalinux:9
            script: infra/packaging/rpm.sh
            install: dnf install -y -q /out/*.rpm
          - name: apk
            image: alpine:latest
            script: infra/packaging/apk.sh
            install: apk add --quiet --allow-untrusted /out/*.apk
          - name: arch
            image: archlinux:base-devel
            script: infra/packaging/arch.sh
            install: pacman -Sy --noconfirm > /dev/null && pacman -U --noconfirm /out/*.pkg.tar.zst
        exclude:
          # Arch Linux publishes an x86_64-only image
          - arch:
              name: arm64
              runner: ubuntu-24.04-arm
            kind:
              name: arch
              image: archlinux:base-devel
              script: infra/packaging/arch.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_packages: azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* mongodb*
          remove_packages_one_command: true
          remove_folders: /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/local/share/vcpkg
      - name: Download the web client
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selkies-web-client
      - name: Unpack the web client into dist/web
        run: mkdir -p dist && tar -C dist -xf selkies-web-client.tar && rm selkies-web-client.tar
      - name: Build the package inside the target distro container
        env:
          SELKIES_VERSION: ${{ inputs.package_version }}
          DISTRO_TAG: ${{ matrix.kind.tag }}
          IMAGE: ${{ matrix.kind.image }}
          SCRIPT: ${{ matrix.kind.script }}
        run: |
          set -e
          mkdir -p out
          # /repo is read-only: the scripts build under /build and stage under
          # /pkg-root inside the container and only write their artifacts to /out
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -v "${GITHUB_WORKSPACE}/out:/out" \
            -e SELKIES_VERSION \
            -e DISTRO_TAG \
            "${IMAGE}" \
            sh "/repo/${SCRIPT}"
          ls -la out/
      - name: Install the package in a pristine container of the same distro
        env:
          IMAGE: ${{ matrix.kind.image }}
          INSTALL: ${{ matrix.kind.install }}
        run: |
          set -e
          # Nothing but what the package itself declares: an undeclared
          # runtime library shows up here and nowhere else, because the build
          # container has the whole toolchain installed.
          docker run --rm -v "${GITHUB_WORKSPACE}/out:/out:ro" \
            -e INSTALL \
            -v "${GITHUB_WORKSPACE}/scripts/ci/verify-package.sh:/verify.sh:ro" \
            "${IMAGE}" sh /verify.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.kind.name }}-${{ matrix.arch.name }}
          path: out/*
          # Already-compressed payloads: the artifact is a zip either way, and
          # re-deflating them spends CPU for a size that does not move.
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  appimage:
    name: AppImage (${{ matrix.arch.name }})
    needs: web
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            runner: ubuntu-latest
          - name: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_packages: azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* mongodb*
          remove_packages_one_command: true
          remove_folders: /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/local/share/vcpkg
      - name: Download the web client
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selkies-web-client
      - name: Unpack the web client into dist/web
        run: mkdir -p dist && tar -C dist -xf selkies-web-client.tar && rm selkies-web-client.tar
      - name: Build the AppImage (rattler-build + linuxdeploy-plugin-conda)
        env:
          SELKIES_VERSION: ${{ inputs.package_version }}
          # For the release lookups behind the downloads' checks
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/appimage.sh "${{ matrix.arch.name }}"
      - name: Check the AppImage on a pristine host at its glibc floor
        # The build checked it on this runner, whose own libraries stand in for
        # any the AppImage forgets; here the host has glibc 2.28 and libgbm alone
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}/out:/out:ro" \
            -v "${GITHUB_WORKSPACE}/scripts/ci/verify-appimage.sh:/verify.sh:ro" \
            almalinux:8 sh -c 'dnf install -y -q mesa-libgbm > /dev/null && sh /verify.sh /out/*.AppImage'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-${{ matrix.arch.name }}
          path: out/*
          # Already-compressed payloads: the artifact is a zip either way, and
          # re-deflating them spends CPU for a size that does not move.
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
