name: Packages

# Native packages: .deb (Ubuntu/Debian), .rpm (Fedora/EL), .apk (Alpine),
# .pkg.tar.zst (Arch), and .AppImage (x86_64 + aarch64, via rattler-build +
# linuxdeploy-plugin-conda). Everything is assembled inside a container of the
# target distribution; only apt/apt-get, dnf, apk, or pacman are ever invoked.

# Triggered by ci.yaml on pushes to main and by release.yaml for releases;
# can also be run standalone via the Actions tab, in which case it builds
# the wheel itself unless `wheel_artifact` names an existing artifact.

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Version string stamped into the packages
        type: string
        default: 0.0.0.dev0
      wheel_artifact:
        description: Artifact name of a prebuilt wheel (skips the wheel build when set)
        type: string
        default: ""
  workflow_call:
    inputs:
      package_version:
        description: Version string stamped into the packages
        type: string
        default: 0.0.0.dev0
      wheel_artifact:
        description: Artifact name of a prebuilt wheel (skips the wheel build when set)
        type: string
        default: ""

jobs:
  wheel:
    name: Build wheel for the packages
    if: ${{ inputs.wheel_artifact == '' }}
    uses: ./.github/workflows/build-wheel.yaml

  package:
    name: ${{ matrix.kind.name }} (${{ matrix.arch.name }})
    needs: wheel
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.wheel.result) }}
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: amd64
            runner: ubuntu-latest
          - name: arm64
            runner: ubuntu-24.04-arm
        kind:
          - name: deb-ubuntu24.04
            image: ubuntu:24.04
            script: infra/packaging/deb.sh
          - name: deb-ubuntu26.04
            image: ubuntu:26.04
            script: infra/packaging/deb.sh
          - name: deb-bookworm
            image: debian:bookworm
            script: infra/packaging/deb.sh
          - name: deb-trixie
            image: debian:trixie
            script: infra/packaging/deb.sh
          - name: rpm-fedora
            image: fedora:latest
            script: infra/packaging/rpm.sh
          - name: rpm-el9
            image: almalinux:9
            script: infra/packaging/rpm.sh
          - name: apk
            image: alpine:3
            script: infra/packaging/apk.sh
          - name: arch
            image: archlinux:base-devel
            script: infra/packaging/arch.sh
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        # Actively maintained alternative to the (2023-frozen) jlumbroso
        # action; keep the tool cache, setup-python/setup-node depend on it
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_packages: azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* mongodb*
          remove_packages_one_command: true
          remove_folders: /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/local/share/vcpkg
      - name: Download the wheel
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.wheel_artifact || 'selkies-wheel' }}
          path: dist/
      # Fresh pixelflux/pcmflux wheels from the master HEAD of linuxserver/*;
      # absence is tolerated (standalone dispatch) and mkvenv.sh uses PyPI
      - name: Download pixelflux wheels (master HEAD)
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: pixelflux-wheels-*
          path: dist/
          merge-multiple: true
      - name: Download pcmflux wheels (master HEAD)
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: pcmflux-wheels-*
          path: dist/
          merge-multiple: true
      - name: Build the package inside the target distro container
        env:
          SELKIES_VERSION: ${{ github.event.inputs.package_version || inputs.package_version || '0.0.0.dev0' }}
        run: |
          set -e
          mkdir -p out
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -v "${GITHUB_WORKSPACE}/dist:/dist:ro" \
            -v "${GITHUB_WORKSPACE}/out:/out" \
            -e SELKIES_VERSION \
            "${{ matrix.kind.image }}" \
            sh "/repo/${{ matrix.kind.script }}"
          ls -la out/
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.kind.name }}-${{ matrix.arch.name }}
          path: out/*
          retention-days: 14

  appimage:
    name: AppImage (${{ matrix.arch.name }})
    needs: wheel
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.wheel.result) }}
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            runner: ubuntu-latest
          - name: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        # Actively maintained alternative to the (2023-frozen) jlumbroso
        # action; keep the tool cache, setup-python/setup-node depend on it
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_packages: azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* mongodb*
          remove_packages_one_command: true
          remove_folders: /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/local/share/vcpkg
      # Fresh pixelflux/pcmflux wheels from the master HEAD of linuxserver/*;
      # absence is tolerated (standalone dispatch) and appimage.sh uses PyPI
      - name: Download pixelflux wheels (master HEAD)
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: pixelflux-wheels-*
          path: pixelflux-pcmflux-wheels/
          merge-multiple: true
      - name: Download pcmflux wheels (master HEAD)
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: pcmflux-wheels-*
          path: pixelflux-pcmflux-wheels/
          merge-multiple: true
      - name: Build the AppImage (rattler-build + linuxdeploy-plugin-conda)
        env:
          SELKIES_VERSION: ${{ github.event.inputs.package_version || inputs.package_version || '0.0.0.dev0' }}
          PIXELFLUX_PCMFLUX_WHEELS_DIR: ${{ github.workspace }}/pixelflux-pcmflux-wheels
        run: ./scripts/ci/appimage.sh "${{ matrix.arch.name }}"
      - uses: actions/upload-artifact@v5
        with:
          name: appimage-${{ matrix.arch.name }}
          path: out/*
          retention-days: 14
