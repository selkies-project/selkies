name: Release

# Maintainer-triggered release: builds the wheel ONCE at the release version,
# then builds multi-arch images, native packages and AppImages around it, and
# assembles a DRAFT GitHub release with every build artifact attached. The
# draft is finalized and published manually.
#
# A release is cut after the pinned pixelflux and pcmflux are published, so
# everything here resolves that capture stack from PyPI -- the smoke test, the
# images, the packages and the AppImages alike ship what users install. The
# per-commit main-HEAD wheels the other workflows build are for the builds that
# run ahead of a release, where the pinned version exists nowhere else.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag without the leading v (e.g. 1.2.3 or 2.0.0rc0)
        type: string
        required: true
      latest_tags:
        description: Move the floating `latest` image tags onto this release
        type: choice
        options:
          - auto
          - always
          - never
        default: auto

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      floating_tags: ${{ steps.ver.outputs.floating_tags }}
    steps:
      - id: ver
        env:
          TAG: ${{ inputs.tag }}
          LATEST_TAGS: ${{ inputs.latest_tags }}
        run: |
          set -e
          ver="${TAG#v}"
          # The tag becomes the wheel version, so it is PEP 440: X.Y.Z with an
          # optional pre-release, post-release, or dev suffix
          echo "${ver}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|\.post[0-9]+|\.dev[0-9]+)?$' \
            || { echo "tag must be a PEP 440 version (e.g. 1.2.3 or 2.0.0rc0)" >&2; exit 1; }
          # A pre-release is marked as such on the GitHub release
          case "${ver}" in
            *[ab]*|*rc*|*dev*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          # A release takes the floating `latest` image tags and a pre-release
          # leaves them on the last full release, unless this run says otherwise
          case "${LATEST_TAGS:-auto}" in
            always) floating=true ;;
            never) floating=false ;;
            *) if [ "${prerelease}" = "true" ]; then floating=false; else floating=true; fi ;;
          esac
          {
            echo "version=${ver}"
            echo "prerelease=${prerelease}"
            echo "floating_tags=${floating}"
          } >> "${GITHUB_OUTPUT}"

  wheel:
    name: Build wheel
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/build-wheel.yaml
    with:
      package_version: ${{ needs.validate.outputs.version }}

  wheel-smoke:
    name: Smoke test the wheel
    needs: [validate, wheel]
    permissions:
      contents: read
    uses: ./.github/workflows/smoke-wheel.yaml
    with:
      # A release is cut once the pinned pixelflux and pcmflux are published, so
      # the smoke test resolves them from PyPI: what it proves installable is
      # then the artifact users get, not a main-HEAD build of the capture stack.
      # A pin that is not published yet fails here, which is the release being
      # cut too early.
      capture_stack_published: true

  images:
    name: Build and publish multi-arch images
    needs: [validate, wheel, wheel-smoke]
    # A called workflow can only narrow the caller's token, so the GHCR push
    # scope has to be granted here
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yaml
    with:
      tag_prefix: v${{ needs.validate.outputs.version }}
      floating_tags: ${{ needs.validate.outputs.floating_tags == 'true' }}
      wheel_artifact: selkies-wheel
      capture_stack_published: true

  packages:
    name: Build native packages
    needs: [validate, wheel, wheel-smoke]
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yaml
    with:
      package_version: ${{ needs.validate.outputs.version }}
      wheel_artifact: selkies-wheel
      capture_stack_published: true

  draft-release:
    name: Assemble draft release
    needs: [validate, wheel, wheel-smoke, images, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: release-artifacts/
          merge-multiple: true
      - name: Collect release files
        run: |
          set -e
          mkdir -p release
          # Drop the empty image-digest placeholder files (64-hex filenames);
          # they only exist for the multi-arch manifest merge
          find release-artifacts -type f -regextype posix-extended -regex '.*/[0-9a-f]{64}' -delete
          find release-artifacts -type f -exec mv {} release/ \;
          ls -la release/
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }}
          draft: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release/*
