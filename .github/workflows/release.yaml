name: Release

# A release is cut by running this workflow from the Actions tab with the tag,
# or by pushing the tag. A run releases the commit it started from: a manual
# run creates a new tag on it, cut from main, once the checks pass, and a tag
# that already exists has to be on it, so an earlier commit's tag is released
# by a run started from that tag. The latest input decides the "Latest" badge:
# auto gives it to a release and not to a pre-release, never holds it back for
# a fix to an older series, and always gives it to a pre-release too, which is
# then released as a release since GitHub gives the badge to no pre-release.
#
# The run builds the wheel ONCE at the release version, then builds multi-arch
# images, native packages, and AppImages around it, and assembles a DRAFT
# GitHub release with every build artifact attached. The draft is finalized and
# published manually.
#
# The `latest` input decides whether the release is designated as the latest
# everywhere at once: the floating `latest` image tags and the "Latest" badge of
# the published release. A release is by default, a pre-release is not, and a
# run can force either way. GitHub gives the badge to no release marked as a
# pre-release, so a designated pre-release is marked as a release, and it
# decides the badge when the draft is published, from the publisher's checkbox
# rather than from the draft, so the run's decision is written into the draft's
# notes and release-published.yaml applies it at publication, then rebuilds the
# docs site, whose `latest` follows the badge.
#
# The `pypi` input decides whether the wheel and the sdist go to PyPI once the
# draft is published: auto sends a release designated as the latest and no
# pre-release. The decision rides in the draft's notes beside the latest one,
# and release-published.yaml carries it out from the release's own assets,
# through the trusted publisher registered on PyPI for that workflow file and
# the `pypi` environment. PyPI keeps the first upload of a version, so a
# re-release of one it holds fails there and changes the GitHub release alone.
#
# The pinned pixelflux and pcmflux come from the release each project cut for
# that version: the smoke test, the images, the packages, and the AppImages all
# install the wheels those projects published. `capture_stack: pypi` is the
# explicit choice to resolve them from PyPI instead, for a release made after
# the two were published there; nothing takes that road on its own.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, created on this run's commit when it is new (e.g. 1.2.3 or 2.0.0rc0)
        type: string
        required: true
      latest:
        description: Designate this release as the latest (floating `latest` image tags and the release badge); auto does so for a release and not for a pre-release
        type: choice
        options: [auto, always, never]
        default: auto
      pypi:
        description: Publish the wheel to PyPI once the draft is published; auto does so for a release designated as the latest and not for a pre-release
        type: choice
        options: [auto, always, never]
        default: auto
      capture_stack:
        description: Where the pinned pixelflux and pcmflux come from; pypi only once they are published there
        type: choice
        options: [releases, pypi]
        default: releases

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The tag this run releases: the pushed one, or the one a manual run names
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      latest: ${{ steps.ver.outputs.latest }}
      pypi: ${{ steps.ver.outputs.pypi }}
    steps:
      - id: ver
        name: Check the tag is a version
        # The tag becomes the wheel version, the image tags, and the version of
        # every native package, so it is a PEP 440 version spelled the way pip
        # normalizes it. The run's latest and PyPI decisions are made here too,
        # since the images take the first.
        env:
          TAG: ${{ env.RELEASE_TAG }}
          LATEST: ${{ inputs.latest }}
          PYPI: ${{ inputs.pypi }}
        run: |
          set -e
          ver="${TAG}"
          echo "${ver}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|\.post[0-9]+|\.dev[0-9]+)?$' \
            || { echo "::error::${ver} is not a version (1.2.3, 2.0.0rc0)"; exit 1; }
          is_prerelease() { echo "$1" | grep -qE '((a|b|rc)|\.dev)[0-9]+$'; }
          # A release is designated as the latest and a pre-release is not,
          # unless the run says otherwise; the floating `latest` image tags
          # follow that, and so does the "Latest" badge, which GitHub gives no
          # pre-release, so a designated pre-release is marked as a release
          case "${LATEST:-auto}" in
            always) latest=true ;;
            never) latest=false ;;
            *) if is_prerelease "${ver}"; then latest=false; else latest=true; fi ;;
          esac
          prerelease=false
          if [ "${latest}" = false ] && is_prerelease "${ver}"; then prerelease=true; fi
          # The wheel goes to PyPI for a designated release that is no
          # pre-release, again unless the run says otherwise
          case "${PYPI:-auto}" in
            always) pypi=true ;;
            never) pypi=false ;;
            *) if [ "${latest}" = true ] && ! is_prerelease "${ver}"; then pypi=true; else pypi=false; fi ;;
          esac
          {
            echo "version=${ver}"
            echo "prerelease=${prerelease}"
            echo "latest=${latest}"
            echo "pypi=${pypi}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check the tag is on main
        # A release is cut from main and its tags alone: a commit that is not on
        # main is refused before anything is tagged, built, or released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)"
          case "${status}" in
            identical|behind) ;;
            *) echo "::error::${RELEASE_TAG} is on a commit that is not on main (${status:-unknown})"; exit 1 ;;
          esac

      - name: Tag the commit this run started from
        # The checks above have passed, so a refused run leaves no tag behind. A
        # new tag is cut from main; one that already exists, a pushed one
        # included, has to be on this run's commit, which is what is built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${RELEASE_TAG}" --jq .status)"
            [ "${status}" = identical ] \
              || { echo "::error::${RELEASE_TAG} tags another commit than this run's; start the run from the tag (Use workflow from)"; exit 1; }
            echo "${RELEASE_TAG} tags ${GITHUB_SHA}"
          else
            [ "${GITHUB_REF}" = refs/heads/main ] \
              || { echo "::error::a new tag is cut from main; this run started from ${GITHUB_REF_NAME}"; exit 1; }
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" -f sha="${GITHUB_SHA}" > /dev/null
            echo "${RELEASE_TAG} now tags ${GITHUB_SHA}"
          fi

  wheel:
    name: Build wheel
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/build-wheel.yaml
    with:
      package_version: ${{ needs.check.outputs.version }}

  capture-stack:
    name: Capture stack (pinned releases)
    needs: check
    # The wheels pixelflux and pcmflux released for the pinned versions, which
    # everything below installs. A run resolving them from PyPI skips this.
    if: ${{ inputs.capture_stack != 'pypi' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-pixelflux-pcmflux-wheels.yaml
    with:
      pinned: true

  wheel-smoke:
    name: Smoke test the wheel
    needs: [check, wheel, capture-stack]
    if: >-
      ${{ !cancelled() && needs.wheel.result == 'success'
          && contains(fromJSON('["success", "skipped"]'), needs.capture-stack.result) }}
    permissions:
      contents: read
    uses: ./.github/workflows/smoke-wheel.yaml
    with:
      # What the smoke test proves installable is what the release ships: the
      # capture stack this run fetched, or PyPI's copy of the same versions. A
      # pin that is published in neither place fails here, which is the release
      # being cut too early.
      wheels_ready: ${{ inputs.capture_stack != 'pypi' }}
      capture_stack_published: ${{ inputs.capture_stack == 'pypi' }}

  images:
    name: Build and publish multi-arch images
    needs: [check, wheel, wheel-smoke]
    # A called workflow can only narrow the caller's token, so the GHCR push
    # scope has to be granted here
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yaml
    with:
      tag_prefix: ${{ needs.check.outputs.version }}
      floating_tags: ${{ needs.check.outputs.latest == 'true' }}
      wheel_artifact: selkies-wheel
      capture_stack_published: ${{ inputs.capture_stack == 'pypi' }}

  packages:
    name: Build native packages
    needs: [check, wheel, wheel-smoke]
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yaml
    with:
      package_version: ${{ needs.check.outputs.version }}
      wheel_artifact: selkies-wheel
      capture_stack_published: ${{ inputs.capture_stack == 'pypi' }}

  draft-release:
    name: Assemble draft release
    needs: [check, wheel, wheel-smoke, images, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The release files' build provenance, attested through the run's OIDC
      # token and kept by GitHub
      id-token: write
      attestations: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*"
          path: release-artifacts/
          merge-multiple: true
      - name: Collect release files
        run: |
          set -e
          mkdir -p release
          # Drop the empty image-digest placeholder files (64-hex filenames);
          # they only exist for the multi-arch manifest merge
          find release-artifacts -type f -regextype posix-extended -regex '.*/[0-9a-f]{64}' -delete
          # The capture stack rides inside the images and packages; its wheels
          # stay on the pixelflux and pcmflux releases this run took them from
          find release-artifacts -type f \( -name 'pixelflux-*.whl' -o -name 'pcmflux-*.whl' \) -delete
          # Artifacts of the run rather than of the release: the build record
          # docker/build-push-action uploads per image, the record of what each
          # image was built from, and the conda package the AppImage is
          # assembled from
          find release-artifacts -type f \( -name '*.dockerbuild' -o -name 'selkies-*-images-*.txt' -o -name '*.conda' \) -delete
          find release-artifacts -type f -exec mv {} release/ \;
          (cd release && sha256sum -- * > SHA256SUMS)
          ls -la release/
      # Lets a user check a package against the run that built it
      # (`gh attestation verify FILE --repo selkies-project/selkies`)
      - name: Attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      # The run's latest and PyPI decisions ride ahead of the generated notes
      # as the markers release-published.yaml reads, where they render as
      # nothing
      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.check.outputs.version }}
          name: ${{ needs.check.outputs.version }}
          # The run's commit, which the check job tagged or found tagged
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ needs.check.outputs.prerelease == 'true' }}
          body: "<!-- selkies-release: latest=${{ needs.check.outputs.latest }} --><!-- selkies-release: pypi=${{ needs.check.outputs.pypi }} -->"
          generate_release_notes: true
          files: release/*
