name: Release

# Maintainer-triggered release: builds the wheel ONCE at the release version
# plus fresh pixelflux/pcmflux wheels from the master HEAD of linuxserver/*,
# then builds multi-arch images, native packages, and AppImages around those
# wheels, and assembles a DRAFT GitHub release with every build artifact
# attached. The draft is finalized and published manually.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (semver without the leading v, e.g. 1.2.3)
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          ver="${TAG#v}"
          echo "${ver}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag must be semver (e.g. 1.2.3)" >&2; exit 1; }
          echo "version=${ver}" >> "${GITHUB_OUTPUT}"

  wheel:
    name: Build wheel
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/build-wheel.yaml
    with:
      package_version: ${{ needs.validate.outputs.version }}

  pixelflux-pcmflux:
    name: Build pixelflux and pcmflux wheels (master HEAD)
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/build-pixelflux-pcmflux-wheels.yaml

  images:
    name: Build and publish multi-arch images
    needs: [validate, wheel, pixelflux-pcmflux]
    # A called workflow can only narrow the caller's token, so the GHCR push
    # scope has to be granted here
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yaml
    with:
      tag_prefix: v${{ needs.validate.outputs.version }}
      wheel_artifact: selkies-wheel

  packages:
    name: Build native packages
    needs: [validate, wheel, pixelflux-pcmflux]
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yaml
    with:
      package_version: ${{ needs.validate.outputs.version }}
      wheel_artifact: selkies-wheel

  draft-release:
    name: Assemble draft release
    needs: [validate, wheel, images, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: release-artifacts/
          merge-multiple: true
      - name: Collect release files
        run: |
          set -e
          mkdir -p release
          # Drop the empty image-digest placeholder files (64-hex filenames);
          # they only exist for the multi-arch manifest merge
          find release-artifacts -type f -regextype posix-extended -regex '.*/[0-9a-f]{64}' -delete
          # Drop the pixelflux/pcmflux HEAD wheels: they are CI inputs (baked
          # into the images, packages, and AppImages above), not selkies assets
          find release-artifacts -type f \( -name 'pixelflux-*.whl' -o -name 'pcmflux-*.whl' \) -delete
          find release-artifacts -type f -exec mv {} release/ \;
          ls -la release/
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }}
          draft: true
          generate_release_notes: true
          files: release/*
