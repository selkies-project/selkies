name: Legacy component snapshot

# A component's default branch calls this workflow on a schedule. The sync and
# release steps run in this same run because a GITHUB_TOKEN push does not start
# another workflow. The nested wheel workflow also runs against the exact new
# mirror commit rather than waiting for an event on the snapshot branch.
on:
  workflow_call:
    inputs:
      component:
        description: Component repository to synchronize; pixelflux or pcmflux
        type: string
        required: true
      retry_release:
        description: Build and release the current snapshot even when its canonical tree is unchanged
        type: boolean
        default: false

permissions:
  contents: read

env:
  CANONICAL_REF: monorepo-import

jobs:
  sync:
    name: Synchronize ${{ inputs.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      mirror_commit: ${{ steps.snapshot.outputs.mirror_commit }}
      source_commit: ${{ steps.snapshot.outputs.source_commit }}
      source_tree: ${{ steps.snapshot.outputs.source_tree }}
      changed: ${{ steps.snapshot.outputs.changed }}
      build_required: ${{ steps.snapshot.outputs.build_required }}
    steps:
      - name: Check the trusted caller
        env:
          EXPECTED_REPOSITORY: selkies-project/${{ inputs.component }}
        run: |
          set -euo pipefail
          [ "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}" ] || {
            echo "::error::this workflow only runs for ${EXPECTED_REPOSITORY}"
            exit 1
          }
          [ "${GITHUB_EVENT_NAME}" = schedule ] || [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] || {
            echo "::error::snapshot synchronization requires a schedule or manual dispatch"
            exit 1
          }

      - name: Check out the component default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: component
          ref: main
          fetch-depth: 0

      - name: Check out canonical Selkies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selkies-project/selkies
          ref: ${{ env.CANONICAL_REF }}
          path: canonical
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the source and fetch the existing snapshot
        env:
          EXPECTED_REPOSITORY: selkies-project/${{ inputs.component }}
          CANONICAL_URL: https://github.com/selkies-project/selkies.git
        run: |
          set -euo pipefail
          [ "$(git -C component remote get-url origin)" = "https://github.com/${EXPECTED_REPOSITORY}" ]
          [ "$(git -C canonical remote get-url origin)" = 'https://github.com/selkies-project/selkies' ]
          read -r remote_source _ < <(git ls-remote --exit-code "${CANONICAL_URL}" "refs/heads/${CANONICAL_REF}")
          [ "$(git -C canonical rev-parse HEAD)" = "${remote_source}" ]
          if git -C component ls-remote --exit-code --heads origin refs/heads/monorepo-import >/dev/null; then
            git -C component fetch --no-tags origin refs/heads/monorepo-import:refs/remotes/origin/monorepo-import
          fi

      - name: Create the fast-forward snapshot
        id: snapshot
        env:
          COMPONENT: ${{ inputs.component }}
          TARGET_REPOSITORY: selkies-project/${{ inputs.component }}
        run: |
          set -euo pipefail
          git -C component config user.name 'github-actions[bot]'
          git -C component config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          canonical/.github/scripts/sync-component-snapshot.sh \
            --component "${COMPONENT}" \
            --source-dir canonical \
            --source-repository selkies-project/selkies \
            --source-ref "${CANONICAL_REF}" \
            --target-dir component \
            --target-repository "${TARGET_REPOSITORY}" \
            --output "${GITHUB_OUTPUT}"

      - name: Push the snapshot without force
        if: steps.snapshot.outputs.changed == 'true'
        run: git -C component push origin refs/heads/monorepo-import:refs/heads/monorepo-import

      - name: Verify the published branch identity
        env:
          MIRROR_COMMIT: ${{ steps.snapshot.outputs.mirror_commit }}
        run: |
          set -euo pipefail
          read -r remote_mirror _ < <(git -C component ls-remote --exit-code --heads origin refs/heads/monorepo-import)
          [ "${remote_mirror}" = "${MIRROR_COMMIT}" ]
          [ "$(git -C component rev-parse refs/heads/monorepo-import)" = "${remote_mirror}" ]

  build:
    name: Build snapshot wheels
    needs: sync
    if: needs.sync.outputs.build_required == 'true' || inputs.retry_release
    permissions:
      contents: read
      actions: read
    uses: selkies-project/selkies/.github/workflows/build-pixelflux-pcmflux-wheels.yaml@monorepo-import
    with:
      checkout_repository: ${{ github.repository }}
      checkout_ref: ${{ needs.sync.outputs.mirror_commit }}

  release:
    name: Publish ${{ inputs.component }} snapshot prerelease
    needs: [sync, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sync.outputs.build_required == 'true' || inputs.retry_release) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check the mirror and build identities
        env:
          MIRROR_COMMIT: ${{ needs.sync.outputs.mirror_commit }}
          BUILD_COMMIT: ${{ needs.build.outputs.checkout_commit }}
        run: |
          set -euo pipefail
          [ -n "${MIRROR_COMMIT}" ] && [ "${MIRROR_COMMIT}" = "${BUILD_COMMIT}" ] || {
            echo "::error::the built commit does not match the snapshot commit"
            exit 1
          }

      - name: Check out the built snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.sync.outputs.mirror_commit }}
          persist-credentials: false

      - name: Verify canonical source metadata
        env:
          COMPONENT: ${{ inputs.component }}
          MIRROR_COMMIT: ${{ needs.sync.outputs.mirror_commit }}
          SOURCE_COMMIT: ${{ needs.sync.outputs.source_commit }}
          SOURCE_REF: ${{ env.CANONICAL_REF }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "${MIRROR_COMMIT}" ]
          [ "$(git rev-parse HEAD^2)" = "${SOURCE_COMMIT}" ]
          python3 - <<'PY'
          import json
          import os

          with open('.monorepo-transition.json', encoding='utf-8') as stream:
              metadata = json.load(stream)
          expected = {
              'component': os.environ['COMPONENT'],
              'canonical_repository': 'selkies-project/selkies',
              'canonical_ref': os.environ['SOURCE_REF'],
              'canonical_commit': os.environ['SOURCE_COMMIT'],
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit(f'source metadata mismatch for {key}')
          PY

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.component }}-wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Verify and identify the component wheels
        env:
          COMPONENT: ${{ inputs.component }}
          MIRROR_COMMIT: ${{ needs.sync.outputs.mirror_commit }}
          SOURCE_COMMIT: ${{ needs.sync.outputs.source_commit }}
          SOURCE_REF: ${{ env.CANONICAL_REF }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(wheelhouse/"${COMPONENT}"-*.whl)
          ((${#wheels[@]} > 0)) || {
            echo "::error::no ${COMPONENT} wheels were produced"
            exit 1
          }
          for wheel in "${wheels[@]}"; do
            [ -s "${wheel}" ] || {
              echo "::error::empty wheel: ${wheel}"
              exit 1
            }
          done
          tag="monorepo-${MIRROR_COMMIT:0:12}"
          {
            echo "TAG=${tag}"
            echo 'BODY<<EOF'
            printf "Full-source Selkies snapshot for \`%s\`.\n\n" "${COMPONENT}"
            printf "Canonical source: \`selkies-project/selkies@%s\` (\`%s\`).\n\n" "${SOURCE_COMMIT}" "${SOURCE_REF}"
            printf "Snapshot commit: \`%s\`.\n\nOnly these %s wheels are attached; no standalone PyPI release is made.\n" "${MIRROR_COMMIT}" "${COMPONENT}"
            echo 'EOF'
          } >> "${GITHUB_ENV}"

      - name: Create the GitHub-only prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          target_commitish: ${{ needs.sync.outputs.mirror_commit }}
          body: ${{ env.BODY }}
          prerelease: true
          make_latest: false
          files: wheelhouse/*.whl

  promote:
    name: Propose ${{ inputs.component }} promotion to main
    needs: [sync, build, release]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.release.result == 'success' && (needs.sync.outputs.build_required == 'true' || inputs.retry_release) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the protected destination
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: component
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the trusted promotion helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selkies-project/selkies
          ref: ${{ env.CANONICAL_REF }}
          path: canonical
          persist-credentials: false

      - name: Open or refresh the reviewed pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          TARGET_REPOSITORY: selkies-project/${{ inputs.component }}
          SOURCE_COMMIT: ${{ needs.sync.outputs.source_commit }}
          MIRROR_COMMIT: ${{ needs.sync.outputs.mirror_commit }}
        run: |
          set -euo pipefail
          git -C component fetch --no-tags origin refs/heads/monorepo-import:refs/remotes/origin/monorepo-import
          canonical/.github/scripts/promote-component-snapshot.sh \
            --component "${COMPONENT}" \
            --source-ref "${CANONICAL_REF}" \
            --source-commit "${SOURCE_COMMIT}" \
            --mirror-commit "${MIRROR_COMMIT}" \
            --target-dir component \
            --target-repository "${TARGET_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --output "${GITHUB_OUTPUT}"

      - name: Link the reviewed promotion
        env:
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.pull_request_url }}
        run: |
          set -euo pipefail
          if [ -n "${PULL_REQUEST_URL}" ]; then
            echo "Review and merge ${PULL_REQUEST_URL}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo 'Main already contains the exact snapshot and its canonical ancestry.' >> "${GITHUB_STEP_SUMMARY}"
          fi
