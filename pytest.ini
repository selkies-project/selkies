# The suites in tests/ are standalone programs; tests/test_suites.py runs each
# one as a pytest case. Select a tier with its marker: pytest -m unit
[pytest]
testpaths = tests
markers =
    unit: needs only the source tree
    integration: needs a display, PulseAudio, and a built selkies server
    e2e: additionally needs Playwright browsers and the built web client
    perf: long constrained-link benchmark, run on request
    soak: full pixelflux and pcmflux API surface, run on request
    image: a published desktop image through the release checklist, run on request
