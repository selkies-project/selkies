# The Rust Selkies: one workspace for the server and its capture and encode libraries.
[workspace]
resolver = "3"
members = ["crates/selkies", "crates/selkies-rtc", "crates/pixelflux", "crates/pcmflux"]
default-members = ["crates/selkies", "crates/selkies-rtc"]
exclude = [
    "crates/pixelflux/codec-sys",
    "crates/pixelflux/va-sys",
    "crates/pixelflux/nvcodec-sys",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/selkies-project/selkies"

[workspace.dependencies]
# The server links pixelflux and pcmflux directly, without either crate's optional Python bridge.
pixelflux = { path = "crates/pixelflux", default-features = false, features = ["gpl"] }
pcmflux = { path = "crates/pcmflux", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# rtc-sctp carries the Selkies SCTP fixes until they land upstream
# (crates/selkies-rtc/vendor/rtc-sctp/rtc-sctp-selkies.patch).
[patch.crates-io]
rtc-sctp = { path = "crates/selkies-rtc/vendor/rtc-sctp" }

# Optimized enough to time and to drive a browser with, and rebuilt in seconds rather than the
# minutes fat LTO takes; numbers quoted anywhere come from `release`.
[profile.iterate]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 256
incremental = true
strip = false
