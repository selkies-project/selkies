# The Rust Selkies: one workspace for the server, its capture and encode libraries, its window
# manager, and the desktop shell.
[workspace]
resolver = "3"
members = [
    "crates/selkies",
    "crates/selkies-rtc",
    "crates/pixelflux",
    "crates/pcmflux",
    "crates/selkies-wm",
    "crates/selkies-draw",
    "crates/selkies-desktop",
    "crates/pelorus",
    "crates/selkies-turn-rest",
    "crates/selkies-suites",
    "crates/xtask",
]
default-members = ["crates/selkies", "crates/selkies-rtc", "crates/selkies-desktop"]
exclude = [
    "crates/pixelflux/codec-sys",
    "crates/pixelflux/va-sys",
    "crates/pixelflux/nvcodec-sys",
    # The shell's end-to-end tools, each a workspace of its own built where the checks run.
    "crates/selkies-desktop/tests/driver",
    "crates/selkies-desktop/tests/trayicon",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/selkies-project/selkies"

[workspace.dependencies]
# The server links pixelflux and pcmflux directly, without either crate's optional Python bridge.
pixelflux = { path = "crates/pixelflux", default-features = false, features = ["gpl"] }
pcmflux = { path = "crates/pcmflux", default-features = false }

# Needless clones and collects, buffers behind two pointers, calling conventions that copy, and
# widening `as` casts, refused in every crate of the workspace (`[lints] workspace = true`). pixelflux,
# pcmflux and the fuzz crates build outside the workspace and repeat the table.
[workspace.lints.clippy]
assigning_clones = "deny"
cast_lossless = "deny"
cloned_instead_of_copied = "deny"
implicit_clone = "deny"
large_types_passed_by_value = "deny"
needless_collect = "deny"
rc_buffer = "deny"
redundant_clone = "deny"
trivially_copy_pass_by_ref = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# rtc-dtls carries the handshake's retransmission fix and rtc-srtp the in-place RTP encryption,
# both with code-scanning fixes, and rtc-sctp the Selkies SCTP fixes, until they land upstream
# (crates/selkies-rtc/vendor/*/*-selkies.patch).
[patch.crates-io]
rtc-dtls = { path = "crates/selkies-rtc/vendor/rtc-dtls" }
rtc-sctp = { path = "crates/selkies-rtc/vendor/rtc-sctp" }
rtc-srtp = { path = "crates/selkies-rtc/vendor/rtc-srtp" }

# Optimized enough to time and to drive a browser with, and rebuilt in seconds rather than the
# minutes fat LTO takes; numbers quoted anywhere come from `release`.
[profile.iterate]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 256
incremental = true
strip = false
