# The Rust Selkies: one workspace, the server crate under crates/, and the capture stack
# pinned to a commit of each sibling repository.
[workspace]
resolver = "3"
members = ["crates/selkies", "crates/selkies-rtc"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/selkies-project/selkies"

[workspace.dependencies]
# The capture stack follows the main branch of each repository, at the commit Cargo.lock records
# for every build (`cargo update -p pixelflux -p pcmflux` moves it). Working on a sibling beside
# this tree is a `[patch]` of that repository's URL with a path, in a Cargo configuration outside
# the repository, so every checkout builds the locked commits.
pixelflux = { git = "https://github.com/selkies-project/pixelflux", branch = "main", default-features = false, features = ["gpl"] }
pcmflux = { git = "https://github.com/selkies-project/pcmflux", branch = "main", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# rtc-sctp carries the Selkies SCTP fixes until they land upstream
# (crates/selkies-rtc/vendor/rtc-sctp/rtc-sctp-selkies.patch).
[patch.crates-io]
rtc-sctp = { path = "crates/selkies-rtc/vendor/rtc-sctp" }

# Optimized enough to time and to drive a browser with, and rebuilt in seconds rather than the
# minutes fat LTO takes; numbers quoted anywhere come from `release`.
[profile.iterate]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 256
incremental = true
strip = false
