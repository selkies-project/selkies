# The Rust Selkies: one workspace, the server crate under crates/, and the capture stack
# as path dependencies while the three trees are developed side by side.
[workspace]
resolver = "3"
members = ["crates/selkies", "crates/selkies-rtc"]
# The sibling checkouts keep their own workspaces, locks, and profiles: each is released on
# its own, and a build run from inside one must resolve against its own Cargo.lock.
exclude = ["pixelflux", "pcmflux"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/selkies-project/selkies"

[workspace.dependencies]
# The capture stack, pinned by the build like the Python package pins its wheels: a path
# while the trees sit beside each other, a version before anything is released.
pixelflux = { path = "pixelflux/pixelflux", default-features = false, features = ["gpl"] }
pcmflux = { path = "pcmflux/pcmflux", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# rtc-sctp carries the Selkies SCTP fixes until they land upstream
# (crates/selkies-rtc/vendor/rtc-sctp/rtc-sctp-selkies.patch).
[patch.crates-io]
rtc-sctp = { path = "crates/selkies-rtc/vendor/rtc-sctp" }

# Optimized enough to time and to drive a browser with, and rebuilt in seconds rather than the
# minutes fat LTO takes; numbers quoted anywhere come from `release`.
[profile.iterate]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 256
incremental = true
strip = false
