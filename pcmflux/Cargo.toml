[package]
name = "pcmflux"
version = "2.2.1"
edition = "2024"
# let-chains (stable in edition 2024 since 1.88) are the newest language feature used.
rust-version = "1.88"

[lib]
name = "pcmflux"
crate-type = ["cdylib"]

[features]
# The Python build asks for the extension module (setup.py); left off, the
# crate links the interpreter, which is what `cargo test` needs.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.30.1"
libpulse-binding = "2.30"
opusic-sys = "0.7"
bytemuck = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
