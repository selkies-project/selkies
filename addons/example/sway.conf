# Session compositor settings, installed as the last entry of /etc/sway/config.d,
# which the distribution's config includes on its final line, so these win over
# the defaults it sets.
#
# The desktop behaves as it does on X11: application windows float as they do
# under Openbox rather than tiling, LXQt draws the desktop and its panel rather
# than sway's own wallpaper and status bar, and X11-only applications keep
# working. The desktop window is the exception, tiled below the panel by the
# keeper (see the background note below).
for_window [class=".*"] floating enable
for_window [app_id=".*"] floating enable
# Floated windows keep exactly the size they ask for, as Openbox gives them.
# sway's default floor of 75x50 otherwise inflates the 32-pixel panel to 50:
# its strut and its popup placement still assume the height it asked for, so
# menus overlap the bar and the bar runs taller than the X11 session's.
floating_minimum_size 1 x 1
# The background below the session, shown wherever the desktop window does not
# reach (a second output, and briefly while the session starts). Set to the
# desktop's own colour (pcmanfm-qt BgColor) so the two read as one surface. The
# desktop itself is kept tiled below the panel by the session's keeper, which
# identifies it across pcmanfm-qt versions where a static rule here could not.
bar bar-0 mode invisible
output * bg #2e3436 solid_color
xwayland enable
