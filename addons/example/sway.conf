# Session compositor settings, installed as the last entry of /etc/sway/config.d,
# which the distribution's config includes on its final line, so these win over
# the defaults it sets.
#
# The desktop behaves as it does on X11: LXQt windows float as they do under
# Openbox rather than tiling, LXQt draws the desktop and its panel rather than
# sway's own wallpaper and status bar, and X11-only applications keep working.
for_window [class=".*"] floating enable
for_window [app_id=".*"] floating enable
bar bar-0 mode invisible
output * bg #000000 solid_color
xwayland enable
