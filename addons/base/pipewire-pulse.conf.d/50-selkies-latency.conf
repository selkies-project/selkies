# pipewire-pulse's buffer for a PulseAudio client that leaves its size to the
# server: a 10 ms request and a 40 ms target, where upstream's 20 ms and 2 s put
# such a client's audio about 1.8 s behind the capture Selkies streams.
pulse.properties = {
    pulse.default.req     = 480/48000
    pulse.default.tlength = 1920/48000
}
