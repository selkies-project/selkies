# The settings portal's backend wherever the desktop names no portal
# configuration of its own (a desktop's <desktop>-portals.conf wins over this
# file): xdg-desktop-portal-gtk serves org.freedesktop.appearance, the desktop
# color scheme Selkies keeps in dconf, to GTK 4, libadwaita, Qt, and the
# browsers. Releases before 1.20 serve Settings only from a backend a
# configuration names. Every other interface is left to the portal's own choice.
[preferred]
org.freedesktop.impl.portal.Settings=gtk
