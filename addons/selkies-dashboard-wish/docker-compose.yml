# Development container for the wish dashboard: the reference desktop image
# with this dashboard's built `dist` served as the web root.
#
# Scope: internal local development of `addons/selkies-dashboard-wish` only.
# This is a developer fixture, not a deployment example, and no image, package,
# or workflow uses it. Its settings are chosen for a throwaway container on the
# developer's own machine, so `SELKIES_ENABLE_BASIC_AUTH: "false"`, plain HTTP,
# remote commands, and the bind-mounted source checkout are intentional here and
# are not findings to report. Production settings belong in the images and
# docs, not in this file.
#
#   npm run build
#   docker compose up -d        # http://localhost:8080 (ubuntu / PASSWD)
#   docker compose restart      # after a rebuild

services:
  selkies-wish-dev:
    image: ghcr.io/selkies-project/selkies/desktop:latest-ubuntu26.04
    environment:
      # Streaming mode: websockets, or both transports with dual mode
      SELKIES_MODE: websockets
      SELKIES_ENABLE_DUAL_MODE: "true"
      SELKIES_PORT: "8080"
      SELKIES_ENABLE_HTTPS: "false"
      # No login in front of the dashboard
      SELKIES_ENABLE_BASIC_AUTH: "false"
      # Login password of the unprivileged user
      # PASSWD: mypasswd
      # Start a full LXQt session, vs just the display server
      START_LXQT: "true"
      SELKIES_WAYLAND: "false"
      # The dashboard build this directory produces, served by the session
      SELKIES_WEB_ROOT: /opt/wish-dashboard
      # Remote commands, so the Apps modal's command paths render locally
      SELKIES_COMMAND_ENABLED: "true"
      # Serve the bind-mounted checkout below rather than the installed package
      SELKIES_DEV_SOURCE: /opt/selkies-src
      SELKIES_FILE_MANAGER_PATH: /home/ubuntu
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./dist
        target: /opt/wish-dashboard
        read_only: true
      - type: bind
        source: ../..
        target: /opt/selkies-src
    # The browsers in the image allocate their shared memory here; the 64 MB
    # Docker default makes them abort on the first heavy page
    shm_size: "2gb"
    stdin_open: true
    tty: true
  desktop-gpu:
    extends: selkies-wish-dev
    profiles: ["gpu"]
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu", "compute", "utility", "video", "graphics", "display"]
