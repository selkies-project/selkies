#
# foot's defaults for the session, the terminal on the Wayland backend; a
# user's ~/.config/foot/foot.ini replaces this file. It shares its font,
# scrollback, and palette with xfce4-terminal's defaults on X11
# (/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-terminal.xml), so a
# terminal looks the same on either backend. TERM is xterm-256color rather
# than foot's own, which a host reached over ssh and the stock bashrc's color
# prompt both recognize. Every key foot.ini(5) documents is left at foot's
# default unless set here.

[main]
term=xterm-256color
font=monospace:size=11
pad=6x6
initial-window-size-chars=100x30

[scrollback]
lines=10000

[colors]
background=15121f
foreground=e4def0
cursor=15121f d5499a
selection-foreground=ffffff
selection-background=7967c5
regular0=1f1b2e
regular1=ff5f87
regular2=5fd7a0
regular3=f0c674
regular4=7aa2f7
regular5=d5499a
regular6=46e5e5
regular7=c8c3d6
bright0=4b4563
bright1=ff87a8
bright2=87f0c0
bright3=ffd98a
bright4=9cb8ff
bright5=e57ab8
bright6=8af2f2
bright7=ffffff
